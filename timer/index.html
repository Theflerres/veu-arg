/* ---------- Glitch dos dígitos ----------
   Efeito puramente visual por cima do texto já renderizado: não mexe no
   cálculo do countdown. Quem fecha a janela chama tickCountdown(), que segue
   sendo a única fonte da verdade — assim volta ao valor certo sem duplicar a
   conta e sem deixar um número errado congelado na tela.
   ------------------------------------------------------------------- */
function scheduleGlitch(){
  const faixa = CONFIG.glitchIntervalRange || [7000, 18000];
  const delay = faixa[0] + Math.random() * (faixa[1] - faixa[0]);
  glitchTimer = setTimeout(runGlitch, delay);
}

function sorteiaChar(str){ return str.charAt(Math.floor(Math.random() * str.length)); }

// Troca o modo em runtime (painel de debug). Se houver glitch em curso, a
// classe do CSS acompanha na hora — senão a cor/skew ficariam um ciclo atrás.
function setGlitchMode(modo){
  glitchMode = modo;
  if (glitchFrames) el.digits.classList.toggle('corrompido', modo !== 'digitos');
  return glitchMode;
}

// Um caractere corrompido para um algarismo, conforme o modo.
function charCorrompido(d, modo){
  if (modo === 'caos'){
    const pool = CONFIG.glitchModes.filter(m => m !== 'caos');
    modo = pool[Math.floor(Math.random() * pool.length)];
  }
  if (modo === 'simbolos') return sorteiaChar(CONFIG.glitchSymbols);
  if (modo === 'quebrados'){
    const sosias = (CONFIG.glitchBroken || {})[d];
    return sosias ? sorteiaChar(sosias) : d;   // sem sósia definido: deixa passar
  }
  return String(Math.floor(Math.random() * 10));
}

// Troca só os algarismos e preserva os ':' — a largura do texto não muda,
// então os dígitos não "pulam" de posição durante o efeito. Recebe o valor
// real como argumento (ver countdownTexto) em vez de ler a tela.
function digitosCorrompidos(base){
  const modo  = glitchMode;
  const taxa  = (CONFIG.glitchCorruptRatio || {})[modo];
  const ratio = typeof taxa === 'number' ? taxa : 1;
  return String(base).replace(/[0-9]/g,
    d => (Math.random() < ratio ? charCorrompido(d, modo) : d));
}

function endGlitch(){
  if (!glitchFrames) return;      // nada em curso: sai barato
  clearInterval(glitchFrames);
  glitchFrames = null;
  el.digits.classList.remove('glitching');
  el.digits.classList.remove('corrompido');
  tickCountdown();          // devolve o valor real imediatamente
}

function runGlitch(){
  scheduleGlitch();                        // reagenda sempre, mesmo se pular

  // não compete com o dimming dos eventos de conteúdo nem com o boot
  if (state.current !== 'idle') return;
  // travado e já em curso: reiniciar aqui só faria piscar o valor real por um
  // quadro a cada reagendamento. Deixa a janela em voo seguir.
  if (glitchTravado && glitchFrames) return;
  // countdown zerado não tem algarismo pra corromper
  if (!/[0-9]/.test(countdownTexto)) return;

  if (glitchFrames) endGlitch();           // clique repetido: reinicia limpo

  const fim = agora() + (CONFIG.glitchDuration || 320);
  el.digits.classList.add('glitching');
  el.digits.classList.toggle('corrompido', glitchMode !== 'digitos');

  glitchFrames = setInterval(() => {
    // Sair de idle encerra sempre, inclusive travado: o glitch não pode
    // competir com o dimming do evento. O fim da janela, esse sim, a trava
    // do debug ignora — é o que mantém os dígitos quebrados na tela.
    if (state.current !== 'idle' || (!glitchTravado && agora() >= fim)){
      endGlitch();
      return;
    }
    pintaDigitos();
  }, CONFIG.glitchStepMs || 45);
}

scheduleGlitch();

/* ---------- Event scheduling ---------- */
function scheduleNextEvent(){
  // Idempotente de proposito: nunca pode existir mais de um timer de evento em
  // paralelo. No fluxo normal nunca ha um pendente aqui (endEvent so roda uma
  // vez por evento); isto protege o caso em que um endEvent() ja em voo dentro
  // do closure de um evento chega depois de um reset do painel de debug.
  clearTimeout(state.eventTimer);
  const [min, max] = CONFIG.eventIntervalRange;
  const delay = min + Math.random() * (max - min);
  state.eventTimer = setTimeout(runRandomEvent, delay);
}

// Monta o sorteio a partir de CONFIG.eventWeights (peso 0 desliga o tipo).
// Sorteio por soma acumulada, então peso fracionário vale (codigo: 0.5).
function pickWeightedEvent(){
  const pesos = CONFIG.eventWeights || {};
  const tipos = Object.keys(pesos).filter(tipo => (pesos[tipo] || 0) > 0);
  const total = tipos.reduce((soma, tipo) => soma + pesos[tipo], 0);
  if (!total) return null;
  let r = Math.random() * total;
  for (let i = 0; i < tipos.length; i++){
    r -= pesos[tipos[i]];
    if (r < 0) return tipos[i];
  }
  return tipos[tipos.length - 1];   // arredondamento de ponto flutuante
}

function runRandomEvent(){
  if (state.current !== 'idle') { scheduleNextEvent(); return; }
  // Perto do zero nada começa: um evento no ar disputaria a tela com o colapso.
  if (CONFIG.targetDate.getTime() - agora() < (CONFIG.eventCutoffMs || 30000)){
    scheduleNextEvent();
    return;
  }

  const pick = pickWeightedEvent();

  // Sacola em vez de pickRandom: nenhuma entrada se repete antes de o pool
  // inteiro daquela fase ter passado. Pool vazia (tudo filtrado) não trava o
  // ciclo — reagenda e tenta de novo no próximo intervalo.
  if (pick === 'lore'){
    const entrada = sacolaLore();
    if (entrada) showContentEvent('event_lore', entrada);
    else scheduleNextEvent();
  }
  else if (pick === 'math'){
    const entrada = sacolaMath();
    if (entrada) showContentEvent('event_math', entrada, 'type-error');
    else scheduleNextEvent();
  }
  else if (pick === 'video') showVideoEvent();
  else if (pick === 'transfer') showTransferEvent();
  else if (pick === 'codigo'){
    const entrada = sacolaCodigo();
    if (entrada) showCodeEvent(entrada);
    else scheduleNextEvent();
  }
  // todos os pesos zerados ou tipo desconhecido: não trava o ciclo
  else scheduleNextEvent();
}

function pickRandom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function showContentEvent(stateName, entry, extraClass){
  state.current = stateName;
  endGlitch();              // e o glitch nao compete com o dimming
  el.wrap.classList.add('dimmed');
  el.status.textContent = 'STATUS: PROCESSANDO';

  const panel = document.createElement('div');
  panel.className = 'event-panel' + (extraClass ? ' ' + extraClass : '');
  panel.innerHTML = `<div class="tag">${entry.tag}</div><div class="body">${entry.body}</div>`;
  el.eventLayer.appendChild(panel);
  requestAnimationFrame(() => panel.classList.add('visible'));

  setTimeout(() => {
    panel.classList.remove('visible');
    setTimeout(() => panel.remove(), 450);
    endEvent();
  }, CONFIG.eventVisibleDuration);
}

/* ---------- Evento de vídeo ----------
   Sorteia um .webm da lista, espera o vídeo REALMENTE terminar ('ended')
   em vez de usar duração fixa, e garante que endEvent() rode exatamente
   uma vez por evento — qualquer falha (arquivo ausente, codec recusado,
   decode travado) cai no mesmo caminho de saída e devolve o estado ao idle.
   ------------------------------------------------------------------- */
const videoState = {
  broken: new Set(),   // arquivos que falharam: não são sorteados de novo nesta sessão
  lastPlayed: null,    // evita repetir o mesmo vídeo duas vezes seguidas
};

function pickVideoFile(){
  const pool = CONFIG.videoEntries.filter(f => !videoState.broken.has(f));
  if (!pool.length) return null;
  const candidates = pool.length > 1
    ? pool.filter(f => f !== videoState.lastPlayed)
    : pool;
  return pickRandom(candidates);
}

function showVideoEvent(){
  const file = pickVideoFile();
  // Nenhum vídeo utilizável (lista vazia ou todos quebrados): segue o baile,
  // sem entrar no estado de vídeo e sem tela preta.
  if (!file){ scheduleNextEvent(); return; }

  state.current = 'event_video';
  videoState.lastPlayed = file;
  endGlitch();
  el.wrap.classList.add('dimmed');
  el.status.textContent = 'STATUS: PROCESSANDO';

  const v = el.video;
  let settled = false;
  let loadTimer = null;
  let maxTimer = null;

  function cleanup(){
    clearTimeout(loadTimer);
    clearTimeout(maxTimer);
    v.removeEventListener('canplay', onCanPlay);
    v.removeEventListener('ended', onEnded);
    v.removeEventListener('error', onError);
  }

  // Caminho único de saída: 'settled' impede que endEvent() rode duas vezes
  // (o que agendaria dois timers de evento em paralelo).
  function finish(){
    if (settled) return;
    settled = true;
    cleanup();
    el.videoLayer.classList.remove('visible');
    v.pause();
    // libera o decoder só depois do fade-out do layer
    setTimeout(() => { v.removeAttribute('src'); v.load(); }, 600);
    endEvent();
  }

  function fail(reason){
    if (settled) return;
    console.warn('[P3] vídeo ignorado (' + reason + '):', file);
    videoState.broken.add(file);
    finish();
  }

  function onCanPlay(){
    clearTimeout(loadTimer);
    el.videoLayer.classList.add('visible');
    const p = v.play();
    if (p && typeof p.catch === 'function') p.catch(() => fail('play() recusado'));
    maxTimer = setTimeout(() => fail('excedeu videoMaxDuration'), CONFIG.videoMaxDuration);
  }
  function onEnded(){ finish(); }
  function onError(){ fail('falha de carregamento/decode'); }

  v.addEventListener('canplay', onCanPlay, { once: true });
  v.addEventListener('ended', onEnded);
  v.addEventListener('error', onError);

  // Colapso com este vídeo no ar ou ainda carregando: sem isto o 'canplay'
  // atrasado o traria de volta por cima do colapso, e os timers mexeriam no
  // mesmo <video> que o vídeo final usa.
  state.cancelEvent = () => {
    settled = true;
    cleanup();
    v.removeEventListener('canplay', onCanPlay);
    try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e){}
  };

  // Se o arquivo nem chega a ficar pronto, desiste em vez de travar no estado.
  loadTimer = setTimeout(() => fail('timeout de carregamento'), CONFIG.videoLoadTimeout);

  v.src = CONFIG.videoBasePath + file;
  v.load();
}

function endEvent(){
  // Evento que termina depois do zero: a sequência final já é dona da tela e
  // do estado. Sem isto o estado voltava a 'idle' no meio da invasão.
  if (state.current === 'ending') return;
  state.cancelEvent = null;
  state.current = 'idle';
  el.wrap.classList.remove('dimmed');
  el.status.textContent = 'STATUS: OBSERVANDO';
  scheduleNextEvent();
}


/* ---------- Evento de transferência ----------
   Segue as mesmas regras dos outros eventos de conteúdo: escurece o
   countdown e sai por endEvent() exatamente uma vez.

   Censura idêntica à de fagulhas-data.ts do site: o idCode aparece limpo e o
   nome do sujeito é sempre censurado. Não inventamos regra nova aqui — no
   original nenhuma Fagulha tem o nome revelado.
   ------------------------------------------------------------------- */
const transferState = {
  broken: new Set(),   // imagens que falharam: não são sorteadas de novo
};

function pickTransferRoute(){
  const nodes = CONFIG.netNodes || [];
  if (nodes.length < 2) return null;
  const de = pickRandom(nodes);
  const restantes = nodes.filter(n => n !== de);   // origem != destino
  return { de, para: pickRandom(restantes) };
}

function pickFagulhaImage(){
  const pool = [];
  (CONFIG.fagulhaFiles || []).forEach(f => {
    (f.imagens || []).forEach(img => {
      if (!transferState.broken.has(img)) pool.push({ f, img });
    });
  });
  return pool.length ? pickRandom(pool) : null;
}

// Nome de arquivo com a censura do site: ID visível, nome do sujeito em blocos.
function nomeDeArquivo(f){
  return f.idCode.replace(/ /g, '') + '_' + f.nome + '.dat';
}

function showTransferEvent(){
  const rota = pickTransferRoute();
  const alvo = pickFagulhaImage();
  // sem rota ou sem imagem utilizável: segue o baile, sem entrar no estado
  if (!rota || !alvo){ scheduleNextEvent(); return; }

  state.current = 'event_transfer';
  endGlitch();
  el.wrap.classList.add('dimmed');
  el.status.textContent = 'STATUS: TRANSFERINDO';

  const f = alvo.f;
  const dur = CONFIG.transferVisibleDuration || CONFIG.eventVisibleDuration;
  const janela = dur * 0.85;       // chega em 100% um pouco antes de sair

  const panel = document.createElement('div');
  panel.className = 'event-panel type-transfer';
  panel.innerHTML =
    '<div class="tag">TRANSFERINDO \u25b8 ' + rota.de.nome + ' → ' + rota.para.nome + '</div>' +
    '<div class="transfer-body">' +
      '<img class="transfer-img" alt="">' +
      '<div class="transfer-info">' +
        '<div class="body">' +
          'ARQUIVO .......... ' + nomeDeArquivo(f) + '\n' +
          'CODINOME ......... ' + f.codinome + '\n' +
          'STATUS ........... ' + f.status + '\n' +
          'CLASSIFICA\u00c7\u00c3O .... ' + f.classificacao + '\n' +
          'TAMANHO .......... ' + f.size +
        '</div>' +
        '<div class="transfer-bar"><span></span></div>' +
        '<div class="transfer-pct">0%</div>' +
      '</div>' +
    '</div>';

  const img = panel.querySelector('.transfer-img');
  const barra = panel.querySelector('.transfer-bar span');
  const pct = panel.querySelector('.transfer-pct');

  // imagem quebrada não pode derrubar o evento: some só ela, o painel fica
  img.addEventListener('error', () => {
    console.warn('[P3] imagem de fagulha ignorada:', alvo.img);
    transferState.broken.add(alvo.img);
    img.style.display = 'none';
  });
  img.src = CONFIG.fagulhaBasePath + alvo.img;

  el.eventLayer.appendChild(panel);

  /* A barra precisa ter os 0% RESOLVIDOS antes de receber a largura final.
     Setar transition e width no mesmo callback (como estava) faz o navegador
     calcular o estilo uma vez só: a transição não tem de onde partir e a barra
     nasce cheia. O void offsetWidth força o reflow entre os dois estados —
     nada de transição pulada. */
  barra.style.width = '0%';
  void barra.offsetWidth;
  barra.style.transition = 'width ' + janela + 'ms linear';
  barra.style.width = '100%';

  // o cronômetro do número começa junto com a barra, pra os dois terminarem juntos
  const inicio = agora();

  requestAnimationFrame(() => panel.classList.add('visible'));
  let pctTimer = setInterval(() => {
    const r = Math.min(1, (agora() - inicio) / janela);
    pct.textContent = r >= 1 ? '100% // COMPLETO' : Math.round(r * 100) + '%';
    if (r >= 1){ clearInterval(pctTimer); pctTimer = null; }
  }, 100);

  // caminho único de saída, igual ao do vídeo: endEvent() roda uma vez só
  let settled = false;
  function finish(){
    if (settled) return;
    settled = true;
    clearInterval(pctTimer);
    panel.classList.remove('visible');
    setTimeout(() => panel.remove(), 450);
    endEvent();
  }
  setTimeout(finish, dur);
  state.cancelEvent = () => { settled = true; clearInterval(pctTimer); };
}

/* ---------- Evento de código ----------
   Mesmas regras dos outros eventos de conteúdo. O trecho é digitado ao vivo:
   o texto é redesenhado a cada tecla, com o que vem depois de // em cada
   linha na cor apagada — nada além disso de destaque. {apagar N} vira um passo
   próprio (pausa + N backspaces) e nunca chega a ser exibido.
   ------------------------------------------------------------------- */

// Trecho -> passos: { texto } a digitar ou { apagar: N }.
function passosDoCodigo(code){
  const fonte = String(code || '').replace(/\r/g, '');
  const passos = [];
  const re = /\{apagar (\d+)\}/g;
  let ultimo = 0;
  let m;
  while ((m = re.exec(fonte))){
    if (m.index > ultimo) passos.push({ texto: fonte.slice(ultimo, m.index) });
    passos.push({ apagar: parseInt(m[1], 10) });
    ultimo = re.lastIndex;
  }
  if (ultimo < fonte.length) passos.push({ texto: fonte.slice(ultimo) });
  return passos;
}

function escapaHtml(s){
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function pintaCodigo(texto){
  return texto.split('\n').map(linha => {
    const i = linha.indexOf('//');
    if (i < 0) return escapaHtml(linha);
    return escapaHtml(linha.slice(0, i)) +
      '<span class="comentario">' + escapaHtml(linha.slice(i)) + '</span>';
  }).join('\n');
}

function showCodeEvent(entry){
  const cfg = CONFIG.codigo || {};
  state.current = 'event_codigo';
  endGlitch();
  el.wrap.classList.add('dimmed');
  el.status.textContent = 'STATUS: PROCESSANDO';

  const panel = document.createElement('div');
  panel.className = 'event-panel type-code';
  panel.innerHTML = '<div class="tag">CÓDIGO</div><div class="body"></div>';
  const corpo = panel.querySelector('.body');
  el.eventLayer.appendChild(panel);
  requestAnimationFrame(() => panel.classList.add('visible'));

  const passos = passosDoCodigo(entry.code);
  let texto = '';
  let passo = 0;
  let pos = 0;          // caractere do passo de texto, ou backspaces já dados + 1
  let timer = null;
  let settled = false;

  function desenha(){
    corpo.innerHTML = pintaCodigo(texto) + '<span class="cursor">&nbsp;</span>';
  }

  function tempoTecla(ch){
    if (ch === '\n') return cfg.newlineMs || 250;
    const base = cfg.charMs || 35;
    const v = cfg.charJitter == null ? 0.4 : cfg.charJitter;
    return base * (1 - v + Math.random() * 2 * v);
  }

  // caminho único de saída, igual ao do vídeo e da transferência
  function finish(){
    if (settled) return;
    settled = true;
    clearTimeout(timer);
    panel.classList.remove('visible');
    setTimeout(() => panel.remove(), 450);
    endEvent();
  }

  function proximo(){
    if (settled) return;
    // Painel tirado da tela por fora (reset do debug): para aqui, e quem tirou
    // já cuidou do estado.
    if (!panel.isConnected){ settled = true; return; }

    const p = passos[passo];
    if (!p){ timer = setTimeout(finish, cfg.holdMs || 4000); return; }

    if (p.texto !== undefined){
      if (pos >= p.texto.length){ passo++; pos = 0; proximo(); return; }
      const ch = p.texto[pos++];
      texto += ch;
      desenha();
      timer = setTimeout(proximo, tempoTecla(ch));
      return;
    }

    // {apagar N}: primeiro a pausa, depois um backspace por vez
    if (pos === 0){ pos = 1; timer = setTimeout(proximo, cfg.eraseDelayMs || 600); return; }
    if (pos > p.apagar){ passo++; pos = 0; proximo(); return; }
    texto = texto.slice(0, -1);
    pos++;
    desenha();
    timer = setTimeout(proximo, cfg.eraseCharMs || 60);
  }

  state.cancelEvent = () => { settled = true; clearTimeout(timer); };
  desenha();
  proximo();
}

/* ---------- Boot sequence ----------
   Puramente estético: revela as linhas em intervalos regulares, segura um
   instante e some. Só no fim o estado vira 'idle' e o ciclo de eventos começa
   — por isso nada de lore/math/vídeo pode aparecer por cima do boot.
   ------------------------------------------------------------------- */
function endBoot(){
  if (state.current !== 'boot') return;   // roda uma vez só
  state.current = 'idle';
  el.stage.classList.remove('booting');
  el.bootLayer.classList.add('done');
  el.status.textContent = 'STATUS: OBSERVANDO';
  setTimeout(() => el.bootLayer.remove(), 700);   // tira do DOM após o fade
  scheduleNextEvent();
}

function runBootSequence(){
  const linhas = CONFIG.bootLines || [];
  const total = CONFIG.bootDuration || 0;

  // boot desligado: cai direto no ciclo normal
  if (!total || !linhas.length){ endBoot(); return; }

  el.status.textContent = 'STATUS: BOOT';

  // revela as linhas nos primeiros 80% e usa o resto como pausa antes do fade
  const passo = (total * 0.8) / linhas.length;
  linhas.forEach((linha, i) => {
    setTimeout(() => {
      const texto = interpolaBoot(linha.t);
      const div = document.createElement('div');
      div.className = 'boot-line' + (linha.c ? ' ' + linha.c : '');
      div.textContent = texto;
      if (i === linhas.length - 1) div.innerHTML = texto + '<span class="cursor">&nbsp;</span>';
      el.bootLines.appendChild(div);
      requestAnimationFrame(() => div.classList.add('visible'));
    }, passo * i);
  });

  setTimeout(endBoot, total);
}

/* ==========================================================================
   CAMADA DE REDE (decorativa)
   Roda em paralelo à state machine: nunca lê nem escreve state.current e
   nunca chama endEvent/scheduleNextEvent. Um pulso pode acontecer durante um
   lore, um vídeo, o boot ou o idle sem interferir em nada.
   ========================================================================== */
const SVG_NS = 'http://www.w3.org/2000/svg';
const netEl = {
  edges: document.getElementById('net-edges'),
  nodes: document.getElementById('net-nodes'),
  pulses: document.getElementById('net-pulses'),
};
const netState = {
  byId: {},
  nodes: [],      // nós "vivos": guardam base (bx,by) e posição atual (x,y)
  edges: [],
  pulsos: [],     // pulsos em voo
  pool: [],       // círculos de pulso reaproveitados
  raf: null,
  t0: 0,
};

function buildNetwork(){
  netState.t0 = agora();

  (CONFIG.netNodes || []).forEach((cfg, i) => {
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', cfg.x); c.setAttribute('cy', cfg.y);
    c.setAttribute('r', cfg.hub ? 8 : 5);
    c.setAttribute('class', 'net-node' + (cfg.hub ? ' hub' : ''));
    netEl.nodes.appendChild(c);

    let label = null;
    if (CONFIG.netShowLabels){
      label = document.createElementNS(SVG_NS, 'text');
      label.setAttribute('x', cfg.x + (cfg.hub ? 17 : 13));
      label.setAttribute('y', cfg.y + 5);
      label.setAttribute('class', 'net-label');
      label.textContent = cfg.nome;
      netEl.nodes.appendChild(label);
    }

    // Período próprio por nó, espalhado pela faixa, mais um jitter. Os quatro
    // harmônicos usam razões não inteiras (0.61/0.83/0.47) pra órbita ficar
    // irregular e os nós nunca voltarem a sincronizar entre si.
    const faixa = CONFIG.netDriftPeriodRange || [9000, 21000];
    const total = (CONFIG.netNodes || []).length || 1;
    const base = faixa[0] + (faixa[1] - faixa[0]) * ((i + 0.5) / total);
    const per = (base * (0.85 + Math.random() * 0.3)) / 1000;   // em segundos
    const w = k => (2 * Math.PI) / (per * k);

    const no = {
      cfg, circle: c, label,
      bx: cfg.x, by: cfg.y, x: cfg.x, y: cfg.y,
      dx: cfg.hub ? 17 : 13,
      w1: w(1), w2: w(0.61), w3: w(0.83), w4: w(0.47),
      f1: Math.random() * Math.PI * 2, f2: Math.random() * Math.PI * 2,
      f3: Math.random() * Math.PI * 2, f4: Math.random() * Math.PI * 2,
      arestas: [],
      timer: null,
    };
    netState.byId[cfg.id] = no;
    netState.nodes.push(no);
  });

  (CONFIG.netEdges || []).forEach(par => {
    const a = netState.byId[par[0]], b = netState.byId[par[1]];
    if (!a || !b) return;          // aresta apontando pra nó inexistente: ignora
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.setAttribute('class', 'net-edge');
    netEl.edges.appendChild(line);
    const aresta = { a, b, line, ativos: 0 };
    netState.edges.push(aresta);
    a.arestas.push(aresta);
    b.arestas.push(aresta);
  });
}

/* ---------- Loop de animação ----------
   Um único rAF cuida de tudo que é contínuo: posição dos nós, endpoints das
   arestas e posição dos pulsos. O pulso NÃO usa mais transição CSS: com os
   nós se mexendo, endpoints fixos fariam o pulso descolar da linha. Aqui ele
   é interpolado entre as posições VIVAS dos dois nós, no mesmo frame.
   ------------------------------------------------------------------- */
function netFrame(){
  const tAgora = agora();
  const t = (tAgora - netState.t0) / 1000;
  const A = CONFIG.netDriftAmplitude || 0;

  if (A > 0){
    for (let i = 0; i < netState.nodes.length; i++){
      const n = netState.nodes[i];
      n.x = n.bx + A * (0.62 * Math.sin(n.w1 * t + n.f1) + 0.38 * Math.sin(n.w2 * t + n.f2));
      n.y = n.by + A * (0.58 * Math.cos(n.w3 * t + n.f3) + 0.42 * Math.sin(n.w4 * t + n.f4));
      n.circle.setAttribute('cx', n.x);
      n.circle.setAttribute('cy', n.y);
      if (n.label){
        n.label.setAttribute('x', n.x + n.dx);
        n.label.setAttribute('y', n.y + 5);
      }
    }
    for (let i = 0; i < netState.edges.length; i++){
      const e = netState.edges[i];
      e.line.setAttribute('x1', e.a.x); e.line.setAttribute('y1', e.a.y);
      e.line.setAttribute('x2', e.b.x); e.line.setAttribute('y2', e.b.y);
    }
  }

  for (let i = netState.pulsos.length - 1; i >= 0; i--){
    const p = netState.pulsos[i];
    const r = (tAgora - p.inicio) / p.dur;
    if (r >= 1){ encerraPulso(p, i); continue; }
    p.circle.setAttribute('cx', p.de.x + (p.para.x - p.de.x) * r);
    p.circle.setAttribute('cy', p.de.y + (p.para.y - p.de.y) * r);
  }

  // Sem drift e sem pulso em voo não há o que animar: o loop dorme e volta
  // no próximo pulso. Com o drift ligado (padrão) ele roda sempre.
  if (A <= 0 && netState.pulsos.length === 0){ netState.raf = null; return; }
  netState.raf = requestAnimationFrame(netFrame);
}

function ensureNetLoop(){
  if (netState.raf === null) netState.raf = requestAnimationFrame(netFrame);
}

/* ---------- Pulsos: um ciclo independente por nó ---------- */
function acquirePulseCircle(){
  const c = netState.pool.pop();
  if (c) return c;
  const novo = document.createElementNS(SVG_NS, 'circle');
  novo.setAttribute('r', 5);
  novo.setAttribute('class', 'net-pulse');
  netEl.pulses.appendChild(novo);
  return novo;
}

function encerraPulso(p, i){
  netState.pulsos.splice(i, 1);
  p.circle.classList.remove('moving');
  netState.pool.push(p.circle);
  // contador por aresta: outro pulso pode estar passando pela mesma linha
  p.aresta.ativos--;
  if (p.aresta.ativos <= 0){
    p.aresta.ativos = 0;
    p.aresta.line.classList.remove('active');
  }
}

function scheduleNodePulse(no){
  const faixa = CONFIG.netPulseIntervalRange || [4000, 11000];
  const delay = faixa[0] + Math.random() * (faixa[1] - faixa[0]);
  no.timer = setTimeout(() => runNodePulse(no), delay);
}

function runNodePulse(no){
  scheduleNodePulse(no);            // reagenda sempre, mesmo se pular a vez

  const teto = CONFIG.netMaxConcurrentPulses || 1;
  if (netState.pulsos.length >= teto) return;   // teto cheio: pula a vez
  const aresta = pickRandom(no.arestas);
  if (!aresta) return;                          // nó sem aresta

  // sentido sorteado por disparo, como antes
  const inverso = Math.random() < 0.5;
  const de   = inverso ? aresta.b : aresta.a;
  const para = inverso ? aresta.a : aresta.b;

  aresta.ativos++;
  aresta.line.classList.add('active');

  const circle = acquirePulseCircle();
  circle.setAttribute('cx', de.x);
  circle.setAttribute('cy', de.y);
  circle.classList.add('moving');

  netState.pulsos.push({
    circle, aresta, de, para,
    inicio: agora(),
    dur: CONFIG.netPulseDuration || 1800,
  });
  ensureNetLoop();
}

buildNetwork();
netState.nodes.forEach(scheduleNodePulse);
ensureNetLoop();

runBootSequence();

/* ==========================================================================
   SEQUÊNCIA FINAL — colapso, invasão e desligamento
   Roda uma vez, quando o countdown chega a zero, e não tem volta: state.current
   sai de 'idle' para sempre, o que por si só cala eventos e o glitch de
   idle — todos exigem 'idle' para entrar em cena (ver os returns por aí).

   Três fases, cada uma numa classe do <body>:
     1. colapso    — a tela perde sincronia e os dígitos se desfazem
     2. invadido   — log do invasor subindo, HUD trocada, rede em vermelho
     3. desligando — o tubo colapsa numa linha, num ponto, e apaga (.desligado)

   Tudo que a sequência mexe fora desta seção (CONFIG da rede, textos da HUD)
   fica anotado em endingState, porque o reset do painel de debug desfaz.
   ========================================================================== */

// Todo setTimeout das fases passa por aqui: é o que abortEnding() consegue cancelar.
function endingTimer(fn, delay){
  const id = setTimeout(fn, delay);
  endingState.timers.push(id);
  return id;
}

function flash(duracao){
  el.flash.style.animationDuration = (duracao || 220) + 'ms';
  el.flash.classList.remove('on');
  // Reflow forçado: sem ele a classe re-adicionada no mesmo frame não reinicia
  // a animação e o segundo flash da sequência simplesmente não aparece.
  void el.flash.offsetWidth;
  el.flash.classList.add('on');
}

/* Ponto de entrada único, chamado pelo tick do countdown.
   O corpo sai por setTimeout de propósito: quando a página carrega já depois do
   alvo, o primeiro tickCountdown() roda durante a avaliação do script — antes
   de netState e do grafo existirem — e mexer neles dali daria ReferenceError.
   Um salto de macrotask garante o script inteiro no ar. */
function triggerEnding(){
  if (endingState.armed) return;
  endingState.armed = true;
  setTimeout(() => {
    const janela = (CONFIG.ending || {}).replayWindowMs;
    const atraso = agora() - CONFIG.targetDate.getTime();
    if (typeof janela === 'number' && janela >= 0 && atraso > janela) skipToDeadScreen();
    else startEnding();
  }, 0);
}

function startEnding(){
  if (endingState.started) return;
  endingState.started = true;
  endingState.armed = true;
  state.current = 'ending';        // cala eventos e o glitch de idle

  clearInterval(countdownInterval);
  clearInterval(idlePhraseTimer);
  clearTimeout(state.eventTimer);
  clearTimeout(glitchTimer);
  glitchTimer = null;
  endGlitch();

  // Evento que estivesse no ar para por completo (timers, digitação, vídeo
  // carregando) antes de o painel sair, para nada dele reaparecer no colapso.
  if (state.cancelEvent){
    const cancela = state.cancelEvent;
    state.cancelEvent = null;
    try { cancela(); } catch (e){ console.warn('[P3] cancelEvent falhou:', e); }
  }

  // Painel ou vídeo que estivessem no ar saem de cena junto.
  Array.prototype.slice.call(el.eventLayer.children).forEach(painel => painel.remove());
  el.videoLayer.classList.remove('visible');
  try { el.video.pause(); } catch (e){}
  el.wrap.classList.remove('dimmed');

  // Carregou já no zero, com o boot em curso: a inicialização perdeu o sentido.
  // Os setTimeout de linha do boot seguem em voo, mas escrevem numa camada que
  // já saiu do DOM, e endBoot() sai na primeira linha por não estar mais em 'boot'.
  if (el.stage.classList.contains('booting')){
    el.stage.classList.remove('booting');
    el.bootLayer.classList.add('done');
    endingTimer(() => el.bootLayer.remove(), 700);
  }

  faseColapso();
}

/* ---------- Fase 1: colapso ---------- */
function faseColapso(){
  const cfg = CONFIG.ending || {};
  /* A duração sai do número de falas x o ritmo de leitura de cada uma, pra que
     acrescentar ou tirar uma linha de collapsePhrases não aperte as outras.
     collapseDuration continua valendo como override, se alguém fixar. */
  const falas = cfg.collapsePhrases || ['sinal fora de sincronia'];
  const dur = cfg.collapseDuration || falas.length * (cfg.collapsePhraseMs || 1050);

  document.body.classList.add('colapso');
  el.label.textContent = 'INICIALIZAÇÃO';
  el.status.textContent = 'STATUS: ???';
  flash(180);

  /* Aqui o glitch dos dígitos não tem mais janela nem trégua. Reaproveita
     digitosCorrompidos()/glitchMode em vez de duplicar a corrupção — só o laço
     é próprio, porque runGlitch() exige 'idle' e nunca mais estaremos lá. */
  el.digits.classList.add('glitching');
  endingState.digitLoop = setInterval(() => {
    el.digits.textContent = digitosCorrompidos(countdownTexto);
  }, cfg.collapseStepMs || 55);

  // O modo escala até 'caos': começa parecendo relógio errado e termina campo
  // de ruído. Cada degrau leva um estouro de branco junto.
  const escala = ['digitos', 'quebrados', 'simbolos', 'caos'];
  escala.forEach((modo, i) => {
    endingTimer(() => {
      glitchMode = modo;
      el.digits.classList.toggle('corrompido', modo !== 'digitos');
      if (i) flash(90);
    }, (dur / escala.length) * i);
  });

  falas.forEach((texto, i) => {
    endingTimer(() => { el.sub.textContent = texto; }, (dur / falas.length) * i);
  });

  endingTimer(faseInvasao, dur);
}

/* ---------- Fase 2: invasão ---------- */
function faseInvasao(){
  const cfg = CONFIG.ending || {};

  clearInterval(endingState.digitLoop);
  endingState.digitLoop = null;
  document.body.classList.remove('colapso');
  document.body.classList.add('invadido');
  flash(300);

  // HUD trocada pela do invasor; o relógio fica parado porque o intervalo do
  // countdown já morreu. Guarda os originais: o reset do debug precisa deles.
  endingState.hud = {
    left: el.hudLeft.textContent,
    build: el.hudBuild.textContent,
    label: el.label.textContent,
  };
  el.hudLeft.textContent = cfg.hudLeft || 'CONEXAO REMOTA // ORIGEM DESCONHECIDA';
  el.hudBuild.textContent = cfg.hudBuild || 'BUILD ???????????????';
  el.status.textContent = 'STATUS: COMPROMETIDO';

  /* A rede decorativa é a única coisa que continua rodando — e agora acelerada.
     Mexe no CONFIG porque é dali que scheduleNodePulse() lê a cada disparo; os
     timers em voo são refeitos para a faixa nova valer já no próximo pulso. */
  endingState.net = {
    intervalo: CONFIG.netPulseIntervalRange,
    duracao: CONFIG.netPulseDuration,
    teto: CONFIG.netMaxConcurrentPulses,
  };
  CONFIG.netPulseIntervalRange = cfg.netPulseIntervalRange || [110, 620];
  CONFIG.netPulseDuration = cfg.netPulseDuration || 520;
  CONFIG.netMaxConcurrentPulses = cfg.netMaxConcurrentPulses || 16;
  el.net.classList.add('invadido');
  netState.nodes.forEach(no => { clearTimeout(no.timer); scheduleNodePulse(no); });
  ensureNetLoop();

  // instabilidade de fundo enquanto o log corre
  endingState.flashLoop = setInterval(() => flash(70 + Math.random() * 90), 2200);

  escreveInvasao(0);
}

function escreveInvasao(i){
  const cfg = CONFIG.ending || {};
  const linhas = cfg.invasionLines || [];
  if (i >= linhas.length){ faseBanner(); return; }

  const linha = linhas[i] || {};
  const div = document.createElement('div');
  div.className = 'inv-line' + (linha.c ? ' ' + linha.c : '');
  div.textContent = linha.t || '';
  el.invLog.appendChild(div);

  /* O log é ancorado embaixo e o excedente já sai de vista pelo overflow do
     pai; ainda assim as linhas velhas saem do DOM, senão uma lista longa
     acumularia nós invisíveis. Conta o excedente antes de remover, para não
     depender de remove() ter efeito pra terminar. */
  const max = cfg.maxLogLines || 40;
  let excedente = el.invLog.children.length - max;
  while (excedente-- > 0 && el.invLog.children.length) el.invLog.children[0].remove();

  const faixa = cfg.lineDelayRange || [70, 260];
  const espera = faixa[0] + Math.random() * (faixa[1] - faixa[0]) + (linha.d || 0);
  endingTimer(() => escreveInvasao(i + 1), espera);
}

function faseBanner(){
  const cfg = CONFIG.ending || {};
  el.invBanner.textContent = cfg.bannerText || 'HORA DE ACORDAR';
  el.invBanner.classList.add('on');
  document.body.classList.add('tomado');     // o log recua atrás do banner
  flash(320);
  endingTimer(faseVideoFinal, cfg.bannerHold || 2400);
}

/* ---------- Fase 2.5: vídeo de apresentação ----------
   TODO: o arquivo ainda não existe. Ponha o nome dele em
   CONFIG.ending.finalVideo (ver o comentário lá) e esta fase entra sozinha.
   Enquanto finalVideo estiver vazio — ou se o arquivo faltar, não decodificar,
   tiver o play() recusado ou estourar o timeout — cai em fasePowerOff(), que é
   o desligamento CRT que a sequência já tinha antes deste vídeo existir.
   Reaproveita o <video> do #video-layer: durante a invasão .frame sobe pra
   z-index 45 e o #invasion-layer fica em 40, então o vídeo aparece por cima
   do log sem precisar de CSS novo.
   Mesmo caminho único de saída do evento de vídeo do idle: 'settled' garante
   que fasePowerOff() roda exatamente uma vez, por qualquer das saídas.
   ------------------------------------------------------------------- */
function faseVideoFinal(){
  const cfg = CONFIG.ending || {};
  const arquivo = cfg.finalVideo;
  if (!arquivo){ fasePowerOff(); return; }   // nada plugado: final de sempre

  const v = el.video;
  let settled = false;
  let loadTimer = null;

  function cleanup(){
    clearTimeout(loadTimer);
    v.removeEventListener('canplay', onCanPlay);
    v.removeEventListener('ended', onEnded);
    v.removeEventListener('error', onError);
  }

  function finish(){
    if (settled) return;
    settled = true;
    cleanup();
    el.videoLayer.classList.remove('visible');
    try { v.pause(); } catch (e){}
    fasePowerOff();
  }

  function fail(motivo){
    if (settled) return;
    console.warn('[P3] vídeo final ignorado (' + motivo + '):', arquivo);
    finish();
  }

  function onCanPlay(){
    clearTimeout(loadTimer);
    // o banner mora numa camada abaixo do vídeo: sai de cena antes de tocar
    el.invBanner.classList.remove('on');
    document.body.classList.remove('tomado');
    el.videoLayer.classList.add('visible');
    const p = v.play();
    if (p && typeof p.catch === 'function') p.catch(() => fail('play() recusado'));
    endingTimer(() => fail('excedeu finalVideoMaxDuration'), cfg.finalVideoMaxDuration || 180000);
  }
  function onEnded(){ finish(); }
  function onError(){ fail('falha de carregamento/decode'); }

  v.addEventListener('canplay', onCanPlay, { once: true });
  v.addEventListener('ended', onEnded);
  v.addEventListener('error', onError);
  loadTimer = endingTimer(() => fail('timeout de carregamento'), cfg.finalVideoLoadTimeout || 8000);

  v.src = (cfg.finalVideoBasePath || CONFIG.videoBasePath) + arquivo;
  v.load();
}

/* ---------- Fase 3: desligamento ---------- */
function fasePowerOff(){
  const cfg = CONFIG.ending || {};
  clearInterval(endingState.flashLoop);
  endingState.flashLoop = null;
  document.body.classList.add('desligando');
  // O tempo da animação é do CSS; este timer só espera ela acabar pra fixar o
  // estado morto — sem ele um reflow qualquer poderia repintar a imagem.
  endingTimer(() => {
    document.body.classList.add('desligado');
    state.current = 'offline';
    pararTudo();
  }, cfg.powerOffDuration || 1800);
}

/* Tela morta: nada mais precisa rodar. A Browser Source pode ficar horas nesta
   página depois da live, então todo laço contínuo para aqui. */
function pararTudo(){
  clearInterval(countdownInterval);
  clearInterval(idlePhraseTimer);
  clearInterval(endingState.digitLoop);
  clearInterval(endingState.flashLoop);
  clearTimeout(state.eventTimer);
  clearTimeout(glitchTimer);
  netState.nodes.forEach(no => clearTimeout(no.timer));
  if (netState.raf !== null){ cancelAnimationFrame(netState.raf); netState.raf = null; }
}

/* Página aberta muito depois do alvo (ver ending.replayWindowMs): não há
   invasão pra assistir, só a tela morta, e sem animação nenhuma. */
function skipToDeadScreen(){
  endingState.started = true;
  state.current = 'offline';
  el.stage.classList.remove('booting');
  document.body.classList.add('desligado');
  pararTudo();
}

/* Desfaz a sequência e devolve a tela ao idle. Existe para o botão de reset do
   painel de debug: na live o final não tem volta. */
function abortEnding(){
  endingState.timers.forEach(clearTimeout);
  endingState.timers.length = 0;
  clearInterval(endingState.digitLoop);
  clearInterval(endingState.flashLoop);
  endingState.digitLoop = null;
  endingState.flashLoop = null;

  if (endingState.net){
    CONFIG.netPulseIntervalRange = endingState.net.intervalo;
    CONFIG.netPulseDuration = endingState.net.duracao;
    CONFIG.netMaxConcurrentPulses = endingState.net.teto;
    endingState.net = null;
    netState.nodes.forEach(no => { clearTimeout(no.timer); scheduleNodePulse(no); });
    ensureNetLoop();
  }
  if (endingState.hud){
    el.hudLeft.textContent = endingState.hud.left;
    el.hudBuild.textContent = endingState.hud.build;
    el.label.textContent = endingState.hud.label;
    endingState.hud = null;
  }

  // o vídeo final pode estar no ar quando o reset do debug chega
  el.videoLayer.classList.remove('visible');
  try { el.video.pause(); } catch (e){}

  el.net.classList.remove('invadido');
  el.invLog.innerHTML = '';
  el.invBanner.classList.remove('on');
  el.invBanner.textContent = '';
  el.digits.classList.remove('glitching');
  el.digits.classList.remove('corrompido');
  el.flash.classList.remove('on');
  document.body.classList.remove('colapso');
  document.body.classList.remove('invadido');
  document.body.classList.remove('tomado');
  document.body.classList.remove('desligando');
  document.body.classList.remove('desligado');

  glitchMode = CONFIG.glitchMode || 'digitos';
  endingState.started = false;
  endingState.armed = false;
  startCountdownClock();     // volta a escrever dígitos, sub e relógio
  clearTimeout(glitchTimer);
  scheduleGlitch();
}

/* ==========================================================================
   PAINEL DE DEBUG — só existe em `npm run dev`, e com ?debug=1 na URL
   No build de produção import.meta.env.DEV é false e o Vite remove o bloco
   inteiro do JS. Em dev, sem o parâmetro, ele retorna na primeira linha e
   nada é criado: nenhum elemento, nenhum estilo, nenhum timer.

   Regra que todos os botões seguem: eles NÃO forçam por cima do estado atual.
   showContentEvent/showVideoEvent/showTransferEvent não checam state.current
   por conta própria (no fluxo real quem checa é runRandomEvent), então chamar
   qualquer uma delas durante outro evento quebraria a exclusão mútua e
   deixaria dois timers de evento em paralelo. Por isso a checagem vive aqui.
   ========================================================================== */
if (import.meta.env.DEV) (function(){
  var params;
  try { params = new URLSearchParams(location.search); } catch (e){ return; }
  if (!params || params.get('debug') !== '1') return;

  var CSS =
    '#debug-panel{position:fixed;top:56px;right:12px;z-index:100;' +
    'width:200px;padding:10px;background:rgba(3,8,4,0.88);' +
    'border:1px solid var(--phosphor-dim);font-family:var(--font-ui);' +
    'font-size:11px;color:var(--phosphor);letter-spacing:0.5px;}' +
    '#debug-panel h4{font-size:10px;letter-spacing:2px;color:var(--amber);' +
    'margin-bottom:8px;font-weight:400;}' +
    '#debug-panel button{display:block;width:100%;margin-bottom:4px;padding:5px 7px;' +
    'background:rgba(51,255,102,0.06);border:1px solid var(--phosphor-faint);' +
    'color:var(--phosphor);font-family:inherit;font-size:11px;text-align:left;' +
    'cursor:pointer;letter-spacing:0.5px;}' +
    '#debug-panel button:hover{background:rgba(51,255,102,0.16);' +
    'border-color:var(--phosphor-dim);}' +
    '#debug-panel button.perigo{color:var(--amber);border-color:rgba(255,176,0,0.35);}' +
    '#debug-estado{margin-top:8px;padding-top:7px;border-top:1px solid var(--phosphor-faint);' +
    'color:var(--phosphor-dim);line-height:1.5;white-space:pre-line;}' +
    '#debug-msg{margin-top:5px;min-height:26px;color:var(--amber);line-height:1.35;}' +
    '#debug-msg.ignorado{color:var(--err);}';

  var estilo = document.createElement('style');
  estilo.textContent = CSS;
  document.head.appendChild(estilo);

  var painel = document.createElement('div');
  painel.id = 'debug-panel';
  painel.innerHTML = '<h4>DEBUG</h4>';
  document.body.appendChild(painel);

  var linhaEstado = document.createElement('div');
  linhaEstado.id = 'debug-estado';
  var linhaMsg = document.createElement('div');
  linhaMsg.id = 'debug-msg';

  function aviso(texto, ignorado){
    linhaMsg.textContent = texto;
    linhaMsg.className = ignorado ? 'ignorado' : '';
  }

  /* Depois de um reset com evento em voo fica um endEvent() órfão agendado
     dentro do closure daquele evento — inalcançável daqui. Se um evento NOVO
     começar antes de o órfão disparar, ele marca idle por cima do novo e um
     segundo painel entra em cena. Por isso o reset abre uma janela de espera:
     nenhum evento de conteúdo entra até o órfão ter passado. */
  var bloqueadoAte = 0;

  var DESCRICAO_MODO = {
    digitos:   'algarismo vira outro algarismo (padrão da live)',
    simbolos:  'algarismo vira símbolo — o número some',
    quebrados: 'algarismo vira sósia torto (8→B, 1→|)',
    caos:      'sorteia entre os três a cada caractere',
  };

  // Porteiro: eventos de conteúdo só entram a partir do idle, igual ao fluxo real.
  function exigirIdle(nome){
    var tAgora = agora();
    if (tAgora < bloqueadoAte){
      aviso('IGNORADO: ' + nome + ' — esperando o evento anterior encerrar ('
        + Math.ceil((bloqueadoAte - tAgora) / 1000) + 's)', true);
      return false;
    }
    if (state.current !== 'idle'){
      aviso('IGNORADO: ' + nome + ' — estado atual é ' + state.current, true);
      return false;
    }
    return true;
  }

  function botao(rotulo, fn, perigo){
    var b = document.createElement('button');
    b.textContent = rotulo;
    if (perigo) b.className = 'perigo';
    b.addEventListener('click', function(){
      try { fn(); } catch (e){ aviso('ERRO: ' + e.message, true); }
    });
    painel.appendChild(b);
    return b;
  }

  botao('▸ lore', function(){
    if (!exigirIdle('lore')) return;
    var entrada = sacolaLore();
    if (!entrada){ aviso('nenhum lore disponível na fase ' + faseAtual(), true); return; }
    showContentEvent('event_lore', entrada);
    aviso('lore (fase ' + faseAtual() + '): ' + entrada.tag);
  });

  botao('▸ math', function(){
    if (!exigirIdle('math')) return;
    var entrada = sacolaMath();
    if (!entrada){ aviso('nenhum math disponível na fase ' + faseAtual(), true); return; }
    showContentEvent('event_math', entrada, 'type-error');
    aviso('math (fase ' + faseAtual() + '): ' + entrada.tag);
  });

  botao('▸ vídeo', function(){
    if (!exigirIdle('vídeo')) return;
    showVideoEvent();
    // showVideoEvent desiste sozinho se não houver arquivo utilizável
    aviso(state.current === 'event_video'
      ? 'vídeo: ' + videoState.lastPlayed
      : 'nenhum vídeo utilizável (todos quebrados?)');
  });

  botao('▸ transferência', function(){
    if (!exigirIdle('transferência')) return;
    showTransferEvent();
    aviso(state.current === 'event_transfer'
      ? 'transferência iniciada'
      : 'sem imagem/rota utilizável');
  });

  botao('▸ replay do boot', function(){
    if (!exigirIdle('boot')) return;
    // A camada de boot sai do DOM no fim da sequência: recoloca antes.
    clearTimeout(state.eventTimer);   // endBoot vai agendar de novo no fim
    el.bootLines.innerHTML = '';
    if (!el.bootLayer.parentNode) el.stage.appendChild(el.bootLayer);
    el.bootLayer.classList.remove('done');
    el.stage.classList.add('booting');
    state.current = 'boot';
    runBootSequence();
    aviso('boot reiniciado (' + CONFIG.bootDuration + 'ms)');
  });

  botao('▸ final: invasão', function(){
    if (!exigirIdle('final')) return;
    startEnding();
    aviso('sequência final em curso — ▸ reset volta pro idle');
  }, true);

  botao('▸ glitch nos dígitos', function(){
    if (!exigirIdle('glitch')) return;
    // runGlitch reagenda o próprio ciclo; sem limpar o pendente a cadeia duplica
    clearTimeout(glitchTimer);
    runGlitch();
    aviso('glitch (' + glitchMode + ') por '
      + (glitchTravado ? '∞ — travado' : CONFIG.glitchDuration + 'ms'));
  });

  /* Modo de corrupção: o que cada algarismo vira durante o glitch. Não mexe em
     estado nenhum do overlay, só na tabela de caracteres — por isso não passa
     pelo porteiro de idle e pode ser trocado no meio de uma janela. */
  var rotuloModo = botao('▸ modo: ' + glitchMode, function(){
    var modos = CONFIG.glitchModes;
    var proximo = modos[(modos.indexOf(glitchMode) + 1) % modos.length];
    setGlitchMode(proximo);
    rotuloModo.textContent = '▸ modo: ' + proximo;
    aviso('corrupção: ' + DESCRICAO_MODO[proximo]);
  });

  /* Trava: segura a janela de glitch aberta para dar tempo de olhar o efeito.
     Sair do idle ainda encerra (o glitch não pode disputar a tela com um
     evento); quando voltar ao idle, o próximo glitch agendado já entra travado
     de novo — daí a janela de 7–18s no aviso. */
  var rotuloTrava = botao('▸ travar glitch: OFF', function(){
    glitchTravado = !glitchTravado;
    rotuloTrava.textContent = '▸ travar glitch: ' + (glitchTravado ? 'ON' : 'OFF');
    if (!glitchTravado){
      endGlitch();                          // solta a janela em voo agora
      aviso('trava OFF — glitch volta ao ciclo normal');
      return;
    }
    if (state.current !== 'idle'){
      aviso('trava ON — começa quando voltar ao idle (agora: ' + state.current + ')', true);
      return;
    }
    clearTimeout(glitchTimer);              // não deixa a cadeia duplicar
    runGlitch();
    aviso('trava ON — dígitos quebrados até desligar (modo ' + glitchMode + ')');
  });

  botao('▸ pulso na rede', function(){
    var nos = netState.nodes;
    if (!nos.length){ aviso('grafo vazio', true); return; }
    var no = pickRandom(nos);
    // runNodePulse reagenda o ciclo do nó ao ser chamado. No fluxo real ele roda
    // A PARTIR do timer (que já se consumiu); chamando na mão, o timer pendente
    // continua vivo e a cadeia daquele nó duplicaria a cada clique.
    clearTimeout(no.timer);
    runNodePulse(no);
    aviso(netState.pulsos.length >= CONFIG.netMaxConcurrentPulses
      ? 'pulso a partir de ' + no.cfg.nome + ' (teto atingido)'
      : 'pulso a partir de ' + no.cfg.nome);
  });

  botao('▸ reset', function(){
    var anterior = state.current;
    // se a sequência final estava no ar, desfaz antes de recompor o idle
    if (endingState.started || endingState.armed) abortEnding();
    var espera = 0;
    if (anterior === 'event_video') espera = CONFIG.videoMaxDuration;
    else if (anterior === 'event_transfer') espera = CONFIG.transferVisibleDuration;
    else if (anterior === 'event_lore' || anterior === 'event_math') espera = CONFIG.eventVisibleDuration;
    // A janela só estende, nunca encurta: um segundo reset (já em idle,
    // espera=0) não pode apagar o bloqueio aberto pelo reset anterior — o
    // órfão daquele evento continua em voo.
    if (espera) bloqueadoAte = Math.max(bloqueadoAte, agora() + espera);

    clearTimeout(state.eventTimer);

    var paineis = Array.prototype.slice.call(el.eventLayer.children);
    for (var i = 0; i < paineis.length; i++) paineis[i].remove();

    el.videoLayer.classList.remove('visible');
    try { el.video.pause(); } catch (e){}
    el.wrap.classList.remove('dimmed');
    el.stage.classList.remove('booting');
    el.status.textContent = 'STATUS: OBSERVANDO';

    state.current = 'idle';
    scheduleNextEvent();
    aviso(espera
      ? 'reset — idle; eventos travados por ' + (espera / 1000) + 's (órfão em voo)'
      : 'reset — idle, timers limpos');
  }, true);

  painel.appendChild(linhaEstado);
  painel.appendChild(linhaMsg);

  setInterval(function(){
    linhaEstado.textContent =
      'fase: ' + faseAtual() + (FASE_FORCADA ? ' (forçada)' : '') +
      ' · ' + Math.max(0, diasRestantes()).toFixed(1) + 'd' +
      '\nestado: ' + state.current +
      '\npulsos: ' + netState.pulsos.length + '/' + CONFIG.netMaxConcurrentPulses +
      '\nglitch: ' + glitchMode + (glitchTravado ? ' (travado)' : '')
      + (glitchFrames ? ' · em curso' : '') +
      (agora() < bloqueadoAte
        ? ' · travado: ' + Math.ceil((bloqueadoAte - agora()) / 1000) + 's' : '');
  }, 250);

  console.log('[P3] modo debug ativo (?debug=1)');
})();

/* ==========================================================================
   MARCOS DA CONTAGEM
   Uma mensagem por marco (CONFIG.marcos), no painel de lore com a tag MARCO.
   Não interrompe nada: o vigia de 1s só exibe no idle, então um marco cruzado
   durante um evento entra logo depois dele — e na frente do próximo sorteio,
   que ainda está a 18s+ de distância e reagenda sozinho se achar a tela ocupada.

   O registro fica em localStorage para um reload da Browser Source não repetir.
   A chave leva a data alvo: se o alvo mudar, os marcos voltam a valer.
   ========================================================================== */
function chaveMarcos(){ return 'p3_marcos_vistos:' + CONFIG.targetDate.toISOString(); }

function lerMarcosVistos(){
  try {
    const v = JSON.parse(localStorage.getItem(chaveMarcos()) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e){ return []; }
}

const marcoState = {
  vistos: new Set(lerMarcosVistos()),   // também em memória: sem localStorage, ao menos não repete nesta carga
  pendente: null,                       // marco cruzado esperando o idle
  forcado: null,                        // ?marco=… (ignora e não grava o registro)
};

function marcaVisto(id){
  marcoState.vistos.add(id);
  try { localStorage.setItem(chaveMarcos(), JSON.stringify(Array.from(marcoState.vistos))); } catch (e){}
}

/* Um marco cruzado e não visto vale enquanto o marco SEGUINTE não tiver sido
   cruzado — não importa há quanto tempo ele cruzou nem se a página estava
   fechada. Na prática, só o marco cruzado mais recente (menor antesMs) pode
   aparecer; todos os anteriores a ele são dados como vistos sem aparecer. Se
   o mais recente já foi visto, nada fica pendente. Vale na carga e com a
   página aberta. */
function avaliaMarcos(){
  const cfg = CONFIG.marcos || {};
  const restante = CONFIG.targetDate.getTime() - agora();

  const cruzados = (cfg.lista || []).filter(m => restante <= m.antesMs);
  if (!cruzados.length) return;
  const maisRecente = cruzados.reduce((a, b) => (b.antesMs < a.antesMs ? b : a));

  cruzados.forEach(m => { if (m !== maisRecente && !marcoState.vistos.has(m.id)) marcaVisto(m.id); });
  marcoState.pendente = marcoState.vistos.has(maisRecente.id) ? null : maisRecente;
}

function vigiaMarcos(){
  // Sem horário verificado (ou com a tela do P3 no ar) nada é avaliado: um
  // relógio adiantado marcaria como vistos marcos que ainda nem chegaram.
  if (!relogio.liberado) return;

  // Da sequência final em diante nada daqui entra em cena.
  if (endingState.armed){
    marcoState.pendente = null;
    marcoState.forcado = null;
    return;
  }

  avaliaMarcos();

  if (state.current !== 'idle') return;

  const marco = marcoState.forcado || marcoState.pendente;
  if (marco){
    const forcado = marco === marcoState.forcado;
    if (forcado) marcoState.forcado = null;
    else marcoState.pendente = null;

    // O painel não pode estar no ar quando o countdown zerar.
    const restante = CONFIG.targetDate.getTime() - agora();
    const folga = CONFIG.eventVisibleDuration + ((CONFIG.marcos || {}).margemColapsoMs || 3000);
    if (!forcado) marcaVisto(marco.id);
    if (restante > folga){
      showContentEvent('event_lore', { tag: 'MARCO', body: marco.t });
      return;
    }
  }

}

setInterval(vigiaMarcos, 1000);

   ATALHOS DE TESTE POR QUERY STRING — só em `npm run dev`
   Nenhum deles depende de ?debug=1, e nenhum deixa rastro sem o parâmetro.
   No build de produção o bloco inteiro some (import.meta.env.DEV = false).
     ?fase=1|2|3  congela a fase narrativa (lido lá em cima, em FASE_FORCADA)
     ?final=1     dispara colapso + sequência final na hora, sem esperar o zero
                  e ignorando a janela de replay de 5 min
     ?marco=7d|3d|24h|1h|10m  mostra aquele marco no primeiro idle, sem ler

     ?resetmarcos=1  apaga o registro de marcos já mostrados
     ?codigo=N    digita o trecho N (1 a 12, na ordem de codeEntries) no

     ?travar=1    abre a tela do P3 de relógio manipulado logo na carga

if (import.meta.env.DEV) (function(){

  }

/* ==========================================================================
   VERIFICAÇÃO DE HORÁRIO + TELA DO P3
   Na carga: pergunta a hora ao servidor (cabeçalho Date de um fetch da própria
   página), ancora agora() nela e compara com o relógio local. Com a página
   aberta: a cada poucos segundos compara quanto o Date.now() andou com quanto
   o performance.now() andou — se divergirem, o relógio do sistema foi mexido
   (pra frente OU pra trás). Qualquer das duas coisas põe a tela do P3 no ar,
   que só sai com o relógio corrigido (botão TENTAR NOVAMENTE ou F5).

   Sem rede na carga, não trava: segue com o relógio local e avisa no console.
   Fora a âncora provisória do relógio (lá no topo), este é o único trecho
   que ainda lê Date.now() — é justamente o relógio sob suspeita.
   ========================================================================== */
const VERIFICACAO = {
  toleranciaServidorMs: 60000,  // relógio local x servidor (carga e "tentar de novo")
  toleranciaSaltoMs: 5000,      // salto do relógio com a página aberta, em módulo
  intervaloVigiaMs: 2000,
  timeoutFetchMs: 5000,
};

/* Hora do servidor, ou null se não deu para perguntar. `perf` é o
   performance.now() do instante a que `ms` se refere. */
async function horaDoServidor(){
  let controle = null, timer = null;
  try {
    if (typeof AbortController === 'function'){
      controle = new AbortController();
      timer = setTimeout(() => controle.abort(), VERIFICACAO.timeoutFetchMs);
    }
    const t0 = performance.now();
    const resp = await fetch(location.href.split('#')[0], {
      cache: 'no-store',
      signal: controle ? controle.signal : undefined,
    });
    const t1 = performance.now();
    // só o cabeçalho interessa: não baixa o resto da página
    try { if (resp.body) resp.body.cancel(); } catch (e){}
    const cab = resp.headers.get('Date');
    const ms = cab ? Date.parse(cab) : NaN;
    if (!Number.isFinite(ms)) throw new Error('resposta sem cabeçalho Date');
    // O cabeçalho trunca no segundo (+500 centra), e o servidor carimbou a
    // resposta mais ou menos no meio da ida e volta.
    return { ms: ms + 500 + (t1 - t0) / 2, perf: t1 };
  } catch (e){
    console.warn('[P3] verificação de horário indisponível (' + ((e && e.message) || e) +
      ') — seguindo com o relógio local.');
    return null;
  } finally {
    clearTimeout(timer);
  }
}

function ancoraNoServidor(s){
  relogio.base = s.ms;
  relogio.perf0 = s.perf;
  relogio.sincronizado = true;
}

/* true = relógio do sistema confiável. Com servidor, a referência é ele; sem,
   é a âncora que já existe (na primeira carga, o próprio relógio local — que
   então concorda consigo mesmo: é o fallback silencioso). */
async function verificaRelogio(){
  const s = await horaDoServidor();
  if (s) ancoraNoServidor(s);
  const desvio = agora() - Date.now();
  if (s) console.log('[P3] horário verificado com o servidor · desvio do relógio local: ' +
    (desvio / 1000).toFixed(1) + 's');
  return Math.abs(desvio) <= VERIFICACAO.toleranciaServidorMs;
}

/* ---------- Vigia contínuo ---------- */
const vigia = { data: Date.now(), perf: performance.now(), conferindo: false };

function zeraVigia(){
  vigia.data = Date.now();
  vigia.perf = performance.now();
}

function vigiaRelogio(){
  if (!relogio.liberado || vigia.conferindo){ zeraVigia(); return; }
  const salto = (Date.now() - vigia.data) - (performance.now() - vigia.perf);
  zeraVigia();
  if (Math.abs(salto) <= VERIFICACAO.toleranciaSaltoMs) return;

  console.warn('[P3] relógio do sistema saltou ' + (salto > 0 ? '+' : '') +
    (salto / 1000).toFixed(1) + 's com a página aberta');
  // Confere antes de acusar: o PC voltando de suspensão e a correção
  // automática de horário também fazem o relógio pular. Se o servidor
  // concorda com o relógio novo, foi isso — reancora sem alarde.
  vigia.conferindo = true;
  horaDoServidor().then(s => {
    vigia.conferindo = false;
    zeraVigia();
    if (s && Math.abs(s.ms + (performance.now() - s.perf) - Date.now()) <= VERIFICACAO.toleranciaServidorMs){
      ancoraNoServidor(s);
      return;
    }
    bloqueia();
  });
}

/* ---------- Áudio do P3 ----------
   Mesmo contrato do playHunterWest()/stopHunterWest() de src/app/sounds.ts
   (lá também existem playP3Timeout/stopP3Timeout para o site). Esta página é
   estática e não importa módulos do site, por isso a cópia local. O arquivo é
   public/sounds/p3-timeout.mp3; se não existir (ou o navegador barrar o
   autoplay), playP3Timeout() resolve null e a onda cai no modo simulado.
   Resolve com o AnalyserNode quando o som toca pela Web Audio. */
const P3_AUDIO = {
  src: new URL('../sounds/p3-timeout.mp3', location.href).href,
  ctx: null,
  el: null,
  fonte: null,
  analyser: null,
};

async function playP3Timeout(volume = 0.85){
  stopP3Timeout();
  const audio = new Audio(P3_AUDIO.src);
  audio.preload = 'auto';
  audio.volume = volume;
  P3_AUDIO.el = audio;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC){
      try {
        if (!P3_AUDIO.ctx) P3_AUDIO.ctx = new AC();
        const ctx = P3_AUDIO.ctx;
        // sem gesto do usuário o resume() pode ficar pendente para sempre
        if (ctx.state !== 'running') await Promise.race([ctx.resume(), new Promise(r => setTimeout(r, 300))]);
        // Só liga o elemento ao grafo com o contexto rodando: ligado a um
        // contexto suspenso, o som tocaria mudo.
        if (ctx.state === 'running' && P3_AUDIO.el === audio){
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.72;
          const fonte = ctx.createMediaElementSource(audio);
          fonte.connect(analyser);
          analyser.connect(ctx.destination);
          P3_AUDIO.fonte = fonte;
          P3_AUDIO.analyser = analyser;
        }
      } catch (e){ /* sem Web Audio: toca mesmo assim, com a onda simulada */ }
    }
    await audio.play();
    return P3_AUDIO.el === audio ? P3_AUDIO.analyser : null;
  } catch (e){
    // arquivo ausente ou autoplay bloqueado — a tela segue muda
    if (P3_AUDIO.el === audio) stopP3Timeout();
    return null;
  }
}

function stopP3Timeout(){
  const audio = P3_AUDIO.el;
  if (audio){
    try { audio.pause(); audio.currentTime = 0; } catch (e){}
  }
  try { if (P3_AUDIO.fonte) P3_AUDIO.fonte.disconnect(); } catch (e){}
  try { if (P3_AUDIO.analyser) P3_AUDIO.analyser.disconnect(); } catch (e){}
  P3_AUDIO.el = P3_AUDIO.fonte = P3_AUDIO.analyser = null;
}

/* ---------- Onda de voz ----------
   Com analyser: barras = espectro real (graves no centro, espelhado).
   Sem: fala procedural — sílabas em pico e vale puxadas por cada caractere
   digitado, quase parada entre as duas falas. */
const ONDA_BARRAS = 48;
const onda = {
  canvas: document.getElementById('p3l-wave'),
  barras: new Float32Array(ONDA_BARRAS),
  fase: Array.from({ length: ONDA_BARRAS }, () => Math.random() * Math.PI * 2),
  vel: Array.from({ length: ONDA_BARRAS }, () => 5 + Math.random() * 9),
  analyser: null,
  dados: null,
  falando: false,
  energia: 0,
  silaba: 0,
  proxSilaba: 0,
  raf: null,
};

// Chamado a cada caractere digitado: é o que dá ritmo de fala à simulação.
function ondaFala(ch){
  const t = performance.now();
  if (/[.,;:!?…—]/.test(ch)) onda.silaba = 0.04;              // respiração
  else if (ch === ' ') onda.silaba *= 0.35;                    // fim de palavra
  else if (t >= onda.proxSilaba){
    onda.silaba = 0.45 + Math.random() * 0.55;
    onda.proxSilaba = t + 70 + Math.random() * 120;
  }
}

function ondaQuadro(){
  const cv = onda.canvas;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const t = performance.now() / 1000;
  const c = (ONDA_BARRAS - 1) / 2;
  if (onda.analyser){
    if (!onda.dados) onda.dados = new Uint8Array(onda.analyser.frequencyBinCount);
    onda.analyser.getByteFrequencyData(onda.dados);
  } else {
    onda.energia += ((onda.falando ? 1 : 0.07) - onda.energia) * 0.08;
    onda.silaba *= 0.94;
  }

  for (let i = 0; i < ONDA_BARRAS; i++){
    const k = Math.abs(i - c) / c;               // 0 no centro, 1 nas pontas
    const repouso = 0.025 + 0.015 * Math.sin(t * 2 + i * 0.35);
    let alvo;
    if (onda.analyser){
      const v = onda.dados[1 + Math.floor(k * 44)] / 255;
      alvo = Math.max(repouso, Math.pow(v, 1.3));
    } else {
      const envelope = 0.2 + 0.8 * Math.exp(-Math.pow(k * 1.6, 2));
      const ruido = 0.6 * (0.5 + 0.5 * Math.sin(t * onda.vel[i] + onda.fase[i])) + 0.4 * Math.random();
      const nivel = onda.energia * (0.2 + 0.8 * onda.silaba);
      alvo = Math.max(repouso, nivel * envelope * ruido);
    }
    const b = onda.barras[i];
    onda.barras[i] = b + (alvo - b) * (alvo > b ? 0.5 : 0.16);
  }

  g.fillStyle = 'rgba(51,255,102,0.14)';
  g.fillRect(0, Math.round(h / 2), w, 1);

  const passo = w / ONDA_BARRAS;
  const larg = Math.max(2, passo * 0.55);
  g.fillStyle = '#33ff66';
  g.shadowColor = 'rgba(51,255,102,0.6)';
  g.shadowBlur = 10;
  for (let i = 0; i < ONDA_BARRAS; i++){
    const alt = Math.max(2, Math.min(1, onda.barras[i]) * h * 0.92);
    g.fillRect(i * passo + (passo - larg) / 2, (h - alt) / 2, larg, alt);
  }
  g.shadowBlur = 0;

  onda.raf = requestAnimationFrame(ondaQuadro);
}

function ondaLiga(){
  if (onda.raf === null) onda.raf = requestAnimationFrame(ondaQuadro);
}

function ondaDesliga(){
  if (onda.raf !== null) cancelAnimationFrame(onda.raf);
  onda.raf = null;
  onda.analyser = null;
  onda.dados = null;
  onda.falando = false;
  onda.energia = 0;
  onda.silaba = 0;
  onda.barras.fill(0);
}

/* ---------- Diálogo ----------
   Uma fala só, amarrada ao p3-timeout.mp3 (16s): silêncio até 3,42s, voz até
   14,78s, silêncio no fim. A digitação não tem velocidade fixa: cada caractere
   tem um horário marcado dentro da janela da voz (pontuação "pesa" mais, como
   pausa de respiração), e o último cai em 14,78s. O relógio de referência é o
   próprio áudio quando ele toca; sem áudio, o tempo desde a abertura da tela —
   os mesmos marcos nos dois modos. */
const P3_FALA = {
  texto: 'Curioso... você tentou mexer no tempo. Pra frente, pra trás, tanto faz — eu percebi. ' +
         'Se eu fosse você... eu teria cuidado onde mexe.',
  inicio: 3.42,     // s — primeira letra
  fim: 14.78,       // s — última letra
  respiro: 1.5,     // s de silêncio depois da fala antes do botão
};

function pesoDoChar(ch){
  if (ch === '.' || ch === '?' || ch === '!') return 7;
  if (ch === ',' || ch === '—') return 5;
  if (ch === ' ') return 1.4;
  return 1;
}

// Horário (s) de cada caractere: o peso de um caractere é a pausa DEPOIS dele.
const P3_TEMPOS = (function(){
  const t = P3_FALA.texto;
  const acum = [0];
  for (let i = 0; i < t.length - 1; i++) acum.push(acum[i] + pesoDoChar(t.charAt(i)));
  const total = acum[acum.length - 1] || 1;
  return acum.map(a => P3_FALA.inicio + (P3_FALA.fim - P3_FALA.inicio) * a / total);
})();

const p3 = {
  tela: document.getElementById('p3-lock'),
  fala: document.getElementById('p3l-fala'),
  botao: document.getElementById('p3l-retry'),
  status: document.getElementById('p3l-status'),
  sessao: 0,        // muda a cada abertura/fechamento: laço antigo para sozinho
  raf: null,
  inicio: 0,        // performance.now() da abertura (relógio do modo sem áudio)
  t: 0,             // último tempo lido — nunca anda pra trás
  digitados: 0,
  texto: null,      // nó de texto da fala
};

/* Segundos desde o início da fala. O áudio sai alguns ms depois da tela abrir:
   quando ele entra, o relógio passa a ser o dele (sincronia real com a voz);
   o Math.max em p3Quadro impede a troca de fazer o texto "desdigitar". */
function p3Tempo(){
  const a = P3_AUDIO.el;
  if (a && !a.paused && a.currentTime > 0) return a.currentTime;
  return (performance.now() - p3.inicio) / 1000;
}

function p3Quadro(sessao){
  if (sessao !== p3.sessao) return;
  const t = p3.t = Math.max(p3.t, p3Tempo());
  const texto = P3_FALA.texto;

  onda.falando = t >= P3_FALA.inicio && t < P3_FALA.fim;
  let n = p3.digitados;
  while (n < texto.length && P3_TEMPOS[n] <= t) ondaFala(texto.charAt(n++));
  if (n !== p3.digitados){
    p3.texto.data = texto.slice(0, n);
    p3.digitados = n;
  }

  if (t >= P3_FALA.fim + P3_FALA.respiro){
    p3.raf = null;
    p3.botao.hidden = false;
    requestAnimationFrame(() => p3.botao.classList.add('visivel'));
    p3.botao.focus({ preventScroll: true });
    return;
  }
  p3.raf = requestAnimationFrame(() => p3Quadro(sessao));
}

function p3Dialogo(sessao){
  p3.inicio = performance.now();
  p3.t = 0;
  p3.digitados = 0;
  p3.texto = document.createTextNode('');
  const cursor = document.createElement('span');
  cursor.className = 'p3l-cursor';
  cursor.textContent = '█';
  p3.fala.replaceChildren(p3.texto, cursor);

  // toca do 0s; o silêncio inicial do arquivo é a espera antes da primeira letra
  playP3Timeout().then(an => { if (sessao === p3.sessao) onda.analyser = an; });
  p3.raf = requestAnimationFrame(() => p3Quadro(sessao));
}

/* ---------- Abrir / fechar ---------- */
function bloqueia(){
  relogio.liberado = false;
  if (!p3.tela.hidden) return;
  clearInterval(countdownInterval);          // nada anda atrás da tela

  const sessao = ++p3.sessao;
  cancelAnimationFrame(p3.raf);
  p3.botao.hidden = true;
  p3.botao.classList.remove('visivel');
  p3.botao.disabled = false;
  p3.botao.textContent = 'TENTAR NOVAMENTE';
  p3.status.textContent = '';

  document.getElementById('screen').inert = true;
  p3.tela.hidden = false;
  ondaLiga();
  p3Dialogo(sessao);
}

function libera(){
  if (!p3.tela.hidden){
    p3.sessao++;
    cancelAnimationFrame(p3.raf);
    p3.raf = null;
    stopP3Timeout();
    ondaDesliga();
    p3.tela.hidden = true;
    document.getElementById('screen').inert = false;
  }
  relogio.liberado = true;
  zeraVigia();
  // depois do zero quem manda é a sequência final: não religa o relógio por cima
  if (!endingState.armed) startCountdownClock();
}

p3.botao.addEventListener('click', async () => {
  const sessao = p3.sessao;
  p3.botao.disabled = true;
  p3.botao.textContent = 'VERIFICANDO...';
  p3.status.textContent = '';
  const [ok] = await Promise.all([verificaRelogio(), new Promise(r => setTimeout(r, 700))]);
  if (sessao !== p3.sessao) return;
  if (ok){ libera(); return; }

  p3.botao.disabled = false;
  p3.botao.textContent = 'TENTAR NOVAMENTE';
  p3.status.textContent = '>> relógio ainda fora de sincronia. ajuste data e hora do sistema.';
  p3.tela.classList.remove('tremendo');
  void p3.tela.offsetWidth;                 // reinicia a animação
  p3.tela.classList.add('tremendo');
});

/* ---------- Partida ----------
   ?travar=1 abre a tela do P3 depois da verificação, para testar sem mexer
   no relógio. Só em `npm run dev`. */
verificaRelogio().then(ok => {
  let forcar = false;
  if (import.meta.env.DEV){
    try { forcar = new URLSearchParams(location.search).get('travar') === '1'; } catch (e){}
    if (forcar) console.log('[P3] ?travar=1 — tela de relógio manipulado forçada');
  }
  if (ok && !forcar) libera();
  else bloqueia();
  zeraVigia();
  setInterval(vigiaRelogio, VERIFICACAO.intervaloVigiaMs);
});

// Atalhos de console — só em `npm run dev`; o build de produção não tem
// window.P3Terminal.
if (import.meta.env.DEV){
  window.P3Terminal = {
    // permite trocar o alvo do countdown em runtime, se precisar
    setTargetDate: (isoString) => { CONFIG.targetDate = new Date(isoString); },
    // sequência final: útil pra ensaiar o encerramento sem esperar o zero
    runEnding: startEnding,
    abortEnding,
    // fase narrativa atual (1/2/3) e quanto falta, pra conferir no console
    faseAtual,
    diasRestantes,
    // tela do P3 de relógio manipulado, sem precisar mexer no relógio
    testarBloqueio: bloqueia,
  };
}
</script>
</body>
