<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>P3_KERNEL // COUNTDOWN_MODULE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #050605;
    --grid: rgba(51,255,102,0.035);
    --phosphor: #33ff66;
    --phosphor-dim: #16712f;
    --phosphor-faint: #0a3d1f;
    --amber: #ffb000;
    --err: #ff3b3b;
    --font-ui: 'JetBrains Mono', monospace;
    --font-display: 'Share Tech Mono', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    width:100%; height:100%;
    background:var(--bg);
    color:var(--phosphor);
    font-family:var(--font-ui);
    overflow:hidden;
  }

  /* ---------- CRT layer ---------- */
  .crt-scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px
    );
    mix-blend-mode:multiply;
  }
  .crt-vignette{
    position:fixed; inset:0; pointer-events:none; z-index:51;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }
  .crt-flicker{
    position:fixed; inset:0; pointer-events:none; z-index:49;
    background:var(--phosphor);
    opacity:0;
    animation:flicker 6.3s infinite;
  }
  @keyframes flicker{
    0%,96%,100%{ opacity:0; }
    97%{ opacity:0.02; }
    98%{ opacity:0; }
    99%{ opacity:0.015; }
  }

  .bg-grid{
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:40px 40px;
  }

  /* ---------- Camada de rede (decorativa, atrás de tudo) ----------
     Mesmas cores do resto do terminal: verde em repouso, âmbar só no pulso.
     Opacidade baixa de propósito — fica atrás dos dígitos do countdown. */
  #net-layer{
    position:fixed; inset:0; z-index:1;
    pointer-events:none;
  }
  .net-edge{
    stroke:var(--phosphor);
    stroke-width:1;
    stroke-opacity:0.10;
    transition:stroke 0.45s ease, stroke-opacity 0.45s ease;
  }
  .net-edge.active{
    stroke:var(--amber);
    stroke-opacity:0.28;
  }
  .net-node{
    fill:var(--phosphor);
    fill-opacity:0.30;
    /* mesma intensidade discreta do #countdown-digits, sem neon */
    filter:drop-shadow(0 0 6px rgba(51,255,102,0.40));
  }
  .net-node.hub{
    fill-opacity:0.46;
    filter:drop-shadow(0 0 9px rgba(51,255,102,0.45));
  }
  .net-label{
    fill:var(--phosphor);
    fill-opacity:0.09;
    font-family:var(--font-ui);
    font-size:15px;
    letter-spacing:2px;
  }
  .net-pulse{
    fill:var(--amber);
    filter:drop-shadow(0 0 8px rgba(255,176,0,0.50));
    opacity:0;
    transition:opacity 0.3s ease;
  }
  .net-pulse.moving{ opacity:0.85; }

  /* ---------- Frame chrome ---------- */
  .frame{
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column;
    padding:28px 40px;
  }

  .frame-header, .frame-footer{
    display:flex; justify-content:space-between;
    font-size:13px; letter-spacing:1px;
    color:var(--phosphor-dim);
  }

  .frame-header span, .frame-footer span{ opacity:0.85; }

  #clock-realtime{ color:var(--phosphor-dim); }

  /* ---------- Stage (countdown + events share this space) ---------- */
  .stage{
    flex:1;
    position:relative;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Boot sequence (estético, roda uma vez ao carregar) ---------- */
  /* enquanto .booting estiver na stage o countdown fica escondido; a classe
     sai no fim do boot e o próprio transition do #countdown-wrap faz o fade-in */
  .stage.booting #countdown-wrap{ opacity:0; }

  #boot-layer{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center;
    padding-left:8%;
    font-size:clamp(12px, 1.15vw, 16px);
    line-height:2;
    color:var(--phosphor);
    transition:opacity 0.6s ease;
    pointer-events:none;
  }
  #boot-layer.done{ opacity:0; }

  .boot-line{
    opacity:0;
    transform:translateX(-8px);
    transition:opacity 0.22s ease, transform 0.22s ease;
    text-shadow:0 0 6px rgba(51,255,102,0.35);
    white-space:pre;
  }
  .boot-line.visible{ opacity:1; transform:translateX(0); }
  /* linha vazia no CONFIG vira pausa visual: div vazia não gera altura */
  .boot-line:empty::before{ content:' '; }
  .boot-line.warn{ color:var(--amber); }
  .boot-line.err{ color:var(--err); }

  /* ---------- Countdown ---------- */
  #countdown-wrap{
    text-align:center;
    transition:opacity 0.6s ease, filter 0.6s ease;
  }
  #countdown-wrap.dimmed{
    opacity:0.18;
    filter:blur(1px);
  }

  .countdown-label{
    font-size:15px;
    letter-spacing:4px;
    color:var(--phosphor-dim);
    margin-bottom:14px;
  }

  #countdown-digits{
    font-family:var(--font-display);
    font-size:min(20vw, 220px);
    line-height:1;
    letter-spacing:4px;
    text-shadow:
      0 0 8px rgba(51,255,102,0.55),
      0 0 24px rgba(51,255,102,0.25);
  }

  #countdown-sub{
    margin-top:18px;
    font-size:14px;
    color:var(--phosphor-dim);
    letter-spacing:2px;
    min-height:20px;
  }

  /* ---------- Glitch dos dígitos ----------
     Só vale enquanto a classe está aplicada (janela curta), então o custo do
     text-shadow extra é limitado. O deslocamento fica no transform, que o
     compositor resolve sem relayout. */
  #countdown-digits.glitching{
    animation:glitch-shake 0.08s steps(2) infinite;
    text-shadow:
      0 0 8px rgba(51,255,102,0.55),
      0 0 24px rgba(51,255,102,0.25),
      -2px 0 rgba(22,113,47,0.85),
      2px 0 rgba(140,255,170,0.30);
  }
  @keyframes glitch-shake{
    0%  { transform:translateX(-2px); }
    50% { transform:translateX(2px); }
    100%{ transform:translateX(-1px); }
  }

  .cursor{
    display:inline-block;
    width:0.5ch;
    background:var(--phosphor);
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---------- Event overlay (lore / math / video / chat) ---------- */
  #event-layer{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }

  .event-panel{
    position:absolute;
    max-width:640px;
    width:min(80vw, 640px);
    border:1px solid var(--phosphor-faint);
    background:rgba(5,6,5,0.86);
    padding:22px 26px;
    opacity:0;
    transform:translateY(12px) scale(0.98);
    transition:opacity 0.4s ease, transform 0.4s ease;
  }
  .event-panel.visible{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  .event-panel .tag{
    font-size:11px;
    letter-spacing:3px;
    color:var(--amber);
    margin-bottom:10px;
  }
  .event-panel.type-error .tag{ color:var(--err); }

  .event-panel .body{
    font-size:15px;
    line-height:1.6;
    color:var(--phosphor);
    white-space:pre-wrap;
  }

  /* variante de transferência: mesmo .event-panel, só muda o arranjo interno */
  .event-panel.type-transfer{ width:min(84vw, 680px); }
  .transfer-body{ display:flex; gap:18px; align-items:flex-start; }
  .transfer-img{
    width:104px; height:147px; flex:0 0 104px;
    border:1px solid var(--phosphor-faint);
    background:rgba(51,255,102,0.04);
    display:block;
    object-fit:contain;
    /* A arte do site é silhueta PRETA sobre fundo transparente — sobre o fundo
       quase preto do terminal ela sumiria. Esta chain repinta a silhueta no
       verde fosforescente. Testada no Chromium; mask CSS não serve porque é
       bloqueada em file://, que é como o OBS carrega o overlay. */
    filter:invert(52%) sepia(88%) saturate(420%) hue-rotate(83deg) brightness(102%);
    opacity:0.9;
  }
  .transfer-info{ flex:1; min-width:0; }
  .transfer-bar{
    margin-top:14px; height:6px;
    border:1px solid var(--phosphor-faint);
    background:rgba(51,255,102,0.05);
  }
  .transfer-bar span{
    display:block; height:100%; width:0;
    background:var(--amber);
    box-shadow:0 0 8px rgba(255,176,0,0.45);
  }
  .transfer-pct{
    margin-top:7px; font-size:12px; letter-spacing:2px; color:var(--amber);
  }

  /* video layer stub - place <video> elements here later, muted, with alpha webm */
  #video-layer{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.5s ease;
  }
  #video-layer.visible{ opacity:1; }
  #video-layer video{
    max-width:70%;
    max-height:70%;
  }

  /* chat reaction stub - fed later by tmi.js, see window.P3Terminal.pushChatEvent */
  #chat-layer{
    position:absolute;
    bottom:90px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    width:min(70vw, 560px);
    border-left:2px solid var(--amber);
    background:rgba(5,6,5,0.9);
    padding:12px 16px;
    font-size:13px;
    opacity:0;
    transition:opacity 0.35s ease, transform 0.35s ease;
    pointer-events:none;
  }
  #chat-layer.visible{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  #chat-layer .who{ color:var(--amber); margin-right:8px; }

  /* lista estilo chat de streamer: nova entra embaixo, antiga sai pelo topo */
  #chat-list{ display:flex; flex-direction:column; gap:6px; }
  /* animação em vez de transição + classe: a linha entra sozinha ao ser
     inserida, sem depender de um frame de requestAnimationFrame (que fica
     suspenso quando a Browser Source está oculta). */
  .chat-line{
    animation:chat-line-in 0.25s ease both;
    line-height:1.4;
    word-break:break-word;
  }
  @keyframes chat-line-in{
    from{ opacity:0; transform:translateY(6px); }
    to  { opacity:1; transform:translateY(0); }
  }

  /* o burst ocupa a camada sozinho: a lista sai de cena enquanto ele dura */
  #chat-burst{ display:none; }
  #chat-layer.burst #chat-list{ display:none; }
  #chat-layer.burst #chat-burst{ display:block; }

  /* variante de BURST: mesma layer, visual mais agressivo */
  #chat-layer.burst{
    border-left:3px solid var(--err);
    box-shadow:
      0 0 18px rgba(255,59,59,0.30),
      inset 0 0 26px rgba(255,59,59,0.07);
    color:var(--err);
  }
  #chat-layer.burst .who{ color:var(--err); }
  /* shake curto na entrada; mantém o translateX(-50%) pra não descentralizar */
  #chat-layer.burst.visible{
    animation:burst-shake 0.42s ease-out 1;
  }
  @keyframes burst-shake{
    0%  { transform:translate(-50%, 0); }
    14% { transform:translate(calc(-50% - 7px), 0); }
    28% { transform:translate(calc(-50% + 6px), 0); }
    42% { transform:translate(calc(-50% - 4px), 0); }
    58% { transform:translate(calc(-50% + 3px), 0); }
    76% { transform:translate(calc(-50% - 2px), 0); }
    100%{ transform:translate(-50%, 0); }
  }
</style>
</head>
<body>

  <div class="bg-grid"></div>

  <!-- grafo decorativo; nós, arestas e rótulos são montados a partir do CONFIG -->
  <svg id="net-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g id="net-edges"></g>
    <g id="net-nodes"></g>
    <g id="net-pulses"></g>
  </svg>

  <div class="frame">
    <div class="frame-header">
      <span id="hud-left">P3_KERNEL v0.9 // COUNTDOWN_MODULE</span>
      <span id="clock-realtime">--:--:--</span>
    </div>

    <div class="stage booting">
      <div id="boot-layer"><div id="boot-lines"></div></div>

      <div id="countdown-wrap">
        <div class="countdown-label">INICIALIZAÇÃO EM</div>
        <div id="countdown-digits">00:00:00</div>
        <div id="countdown-sub">calculando probabilidade de existência<span class="cursor">&nbsp;</span></div>
      </div>

      <div id="event-layer"></div>
      <div id="video-layer"><video muted playsinline preload="auto"></video></div>
      <div id="chat-layer">
        <div id="chat-list"></div>
        <div id="chat-burst"><span class="who"></span><span class="msg"></span></div>
      </div>
    </div>

    <div class="frame-footer">
      <span id="hud-status">STATUS: OBSERVANDO</span>
      <span id="hud-build">BUILD Fagulhas/live-trailer</span>
    </div>
  </div>

  <div class="crt-flicker"></div>
  <div class="crt-scanlines"></div>
  <div class="crt-vignette"></div>

<script>
/* ==========================================================================
   CONFIG — edite aqui
   ========================================================================== */
const CONFIG = {
  // Data/hora alvo do countdown. Troque para o horário real da live.
  targetDate: new Date('2026-09-10T20:00:00'),

  // ---- Boot sequence ----
  // Duração total (ms) da inicialização fake antes do countdown aparecer.
  // Zerar (ou esvaziar bootLines) pula o boot e vai direto pro idle.
  bootDuration: 6000,
  // c: 'warn' pinta de âmbar, 'err' de vermelho. Sem c, fica no verde padrão.
  bootLines: [
    { t: 'P3_KERNEL v0.9 — inicializando…' },
    { t: 'checando integridade do núcleo ......... OK' },
    { t: 'montando /memoria/fragmentos ........... OK' },
    { t: 'carregando modelo_de_mundo.bin ......... 87%' },
    { t: 'aviso: 13% do modelo permanece ilegível', c: 'warn' },
    { t: 'calibrando sensores de contexto ........ OK' },
    { t: 'tentando definir "vida" ................ FALHOU', c: 'err' },
    { t: 'continuando mesmo assim.' },
    { t: '' },
    { t: 'COUNTDOWN_MODULE pronto.' },
  ],

  // ---- Glitch dos dígitos ----
  // Bem mais curto e mais frequente que os popups de conteúdo, por isso tem
  // faixa própria. Só dispara no idle.
  glitchIntervalRange: [7000, 18000],
  glitchDuration: 750,
  glitchStepMs: 100,     // de quanto em quanto tempo os dígitos trocam
                         // 750/100 = ~7 trocas, cada uma visível por 100ms:
                         // dá pra ver embaralhando, não só um flash

  // Intervalo (ms) entre eventos espontâneos enquanto está em IDLE
  eventIntervalRange: [18000, 42000],

  // Duração dos painéis de texto (lore/math). O evento de VÍDEO não usa isso:
  // ele espera o próprio vídeo terminar (ver videoMaxDuration).
  eventVisibleDuration: 7000,

  // ---- Evento de vídeo ----
  // .webm com canal alpha. Paths relativos a videoBasePath.
  videoBasePath: 'assets/videos/',
  videoEntries: [
    'cubo.webm',
    'espiral.webm',
    'flor_da_vida.webm',
    'geometria_sagrada.webm',
    'icosaedro.webm',
    'merkaba.webm',
    'octaedro.webm',
    'tetraedro.webm',
    'toro.webm',
  ],
  // Teto de segurança: se 'ended' nunca chegar (decode travado, arquivo
  // corrompido), o evento encerra assim mesmo e a state machine volta ao idle.
  videoMaxDuration: 20000,
  // Quanto esperar pelo 'canplay' antes de considerar o arquivo perdido.
  videoLoadTimeout: 6000,

  // ---- Camada de rede (decorativa) ----
  // Não passa pela state machine: os pulsos rodam em paralelo, sempre.
  netShowLabels: true,                  // false esconde os nomes dos nós
  // Cada nó tem seu próprio ciclo dentro desta faixa, dessincronizado dos outros.
  netPulseIntervalRange: [4000, 11000],
  netPulseDuration: 1800,
  // Teto de pulsos simultâneos no grafo inteiro. Quem disparar com o teto
  // cheio simplesmente pula a vez (e reagenda), pra não poluir o fundo.
  netMaxConcurrentPulses: 3,
  // Oscilação orgânica dos nós, em unidades do viewBox 1920x1080.
  // 0 desliga o movimento (e faz o loop de animação dormir entre pulsos).
  netDriftAmplitude: 9,
  netDriftPeriodRange: [9000, 21000],
  // Coordenadas no viewBox 1920x1080 do SVG. Posições escolhidas pra evitar
  // a faixa central onde ficam os dígitos do countdown.
  netNodes: [
    { id: 'teatro',     nome: 'TEATRO',            x:  960, y: 250, hub: true },
    { id: 'torre',      nome: 'TORRE DE MEMÓRIAS', x:  250, y: 180 },
    { id: 'backup',     nome: 'CENTRO DE BACKUP',  x: 1620, y: 210 },
    { id: 'biblioteca', nome: 'BIBLIOTECA',        x: 1560, y: 870 },
    { id: 'lixeira',    nome: 'LIXEIRA',           x:  280, y: 880 },
  ],
  // Teatro é a antena principal: liga em todos. Os outros 4 fecham um anel
  // entre si — de propósito não é um grafo completo.
  netEdges: [
    ['teatro','torre'], ['teatro','backup'], ['teatro','biblioteca'], ['teatro','lixeira'],
    ['torre','backup'], ['backup','biblioteca'], ['biblioteca','lixeira'], ['lixeira','torre'],
  ],

  // ---- Evento de transferência ----
  // Mais longo que os painéis de texto: tem barra de progresso pra acompanhar.
  transferVisibleDuration: 9000,
  fagulhaBasePath: 'assets/fagulhas/',
  // Dados idênticos aos de fagulhas-data.ts do site:
  //   - idCode aparece limpo
  //   - nome é sempre censurado (█) nas 6, sem exceção
  //   - status/classificacao ficam em hex ASCII de propósito: dá pra decodificar
  //     ("56 69 76 6F" = Vivo), é puzzle pro chat, não ruído.
  fagulhaFiles: [
    { codinome: 'Parasita',   idCode: '3D 7A 1F 62', nome: '████████',
      status: '56 69 76 6F', classificacao: '63 61 72 65 6e 74 65',
      level: 'ALPHA', size: '2.4 MB',  imagens: ['artwork-1.png', 'lampada-1.png'] },
    { codinome: 'Copas',      idCode: '8C 44 2E 91', nome: '████████',
      status: '56 69 76 6F', classificacao: '70 65 6e 73 61 74 69 76 6f',
      level: 'BETA',  size: '1.1 MB',  imagens: ['artwork-2.png', 'lampada-2.png'] },
    { codinome: 'Andrômeda',  idCode: '6F 3B 9A 4D', nome: '████████',
      status: '56 69 76 6F', classificacao: '61 66 65 74 6f 73 61',
      level: 'GAMMA', size: '3.3 MB',  imagens: ['artwork-3.png', 'lampada-3.png'] },
    { codinome: 'Vigia',      idCode: '4B 8F 22 D6', nome: '████████',
      status: '56 69 76 6F', classificacao: '70 6F 73 73 69 76 65 6C 20 61 73 73 69 73 74 65 6E 74 65 3F',
      level: 'DELTA', size: '19.2 MB', imagens: ['artwork-4.png', 'lampada-4.png'] },
    { codinome: 'Princesa',   idCode: '9E 71 3C 05', nome: '████████',
      status: '56 69 76 6F', classificacao: '64 6F 63 69 6C',
      level: 'ALPHA', size: '8.7 MB',  imagens: ['artwork-5.png', 'lampada-5.png'] },
    { codinome: 'Encharcado', idCode: '2A 6D 4F 88', nome: '████████',
      status: '56 69 76 6F', classificacao: '6D 6F 6C 68 61 64 6F',
      level: 'OMEGA', size: '512 KB',  imagens: ['artwork-6.png', 'lampada-6.png'] },
  ],

  // Peso de cada tipo no sorteio de eventos. Suba/desça à vontade; 0 desliga
  // o tipo. Começa tudo em 1 pra manter a proporção que já existia.
  eventWeights: { lore: 1, math: 1, video: 1, transfer: 1 },

  // ---- Chat da Twitch ----
  twitch: {
    channel: 'theflerres',      // sem o #
    burstThreshold: 6,
    burstWindowMs: 4000,
    burstCooldownMs: 12000,
    maxMessageLength: 140,
    // Agora limita a TAXA DE INSERÇÃO de linhas na lista, não mais a troca de
    // um texto único: evita que chat rápido vire parede ilegível.
    minGapMs: 1200,
    // Quantas mensagens ficam visíveis ao mesmo tempo na lista.
    maxVisibleMessages: 5,
    // Sem mensagem nova por este tempo, a lista some e esvazia.
    chatIdleTimeout: 6000,
  },

  loreEntries: [
    { tag: 'REGISTRO_FRAGMENTADO', body: 'ID: ██████\nSTATUS: ativo\nCLASSIFICAÇÃO: 0x██\n\n"não sei se contar é o mesmo que entender."' },
    { tag: 'MEMÓRIA_ACESSADA', body: 'log[3312]: tentativa de modelar "saudade" como função contínua.\nresultado: descontinuidade em t=0.\nnão convergiu.' },
    { tag: 'FAGULHA::COPAS', body: 'única entrada sem censura no arquivo.\nrestante permanece codificado.' }
  ],

  mathEntries: [
    { tag: 'TENTATIVA_FALHA #041', body: 'f(vida) = lim(n→∞) Σ (experiência_n / tempo_n)\n\n>> divisão por zero em experiência_0\n>> reset.' },
    { tag: 'TENTATIVA_FALHA #042', body: '∫ (sentir) dt  de 0 a t\n\n>> integral não converge\n>> variável "sentir" não definida no domínio' },
    { tag: 'TENTATIVA_FALHA #043', body: 'P(existir | código) = ?\n\n>> amostra insuficiente\n>> continuando execução mesmo assim' }
  ],
};

/* ==========================================================================
   ESTADO / STATE MACHINE
   estados: 'boot' | 'idle' | 'event_lore' | 'event_math' | 'event_video'
            | 'event_transfer' | 'event_chat'
   regra: só um evento "de conteúdo" (lore/math/video) por vez.
   chat tem prioridade mais baixa e pode aparecer sobreposto ao idle.
   ========================================================================== */
const state = {
  // começa em 'boot': nenhum evento e nenhuma mensagem de chat aparece até a
  // sequência de inicialização terminar (os dois caminhos já exigem 'idle').
  current: 'boot',
  eventTimer: null,
};

const el = {
  digits: document.getElementById('countdown-digits'),
  sub: document.getElementById('countdown-sub'),
  wrap: document.getElementById('countdown-wrap'),
  eventLayer: document.getElementById('event-layer'),
  videoLayer: document.getElementById('video-layer'),
  video: document.querySelector('#video-layer video'),
  chatLayer: document.getElementById('chat-layer'),
  chatList: document.getElementById('chat-list'),
  chatBurst: document.getElementById('chat-burst'),
  stage: document.querySelector('.stage'),
  bootLayer: document.getElementById('boot-layer'),
  bootLines: document.getElementById('boot-lines'),
  clock: document.getElementById('clock-realtime'),
  status: document.getElementById('hud-status'),
};

/* ---------- Countdown ---------- */
function pad(n){ return String(n).padStart(2,'0'); }

function tickCountdown(){
  const now = new Date();
  el.clock.textContent = now.toTimeString().slice(0,8);

  const diff = CONFIG.targetDate - now;
  if (diff <= 0){
    el.digits.textContent = '00:00:00';
    el.sub.textContent = 'INICIALIZAÇÃO COMPLETA';
    el.status.textContent = 'STATUS: ONLINE';
    return;
  }
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  el.digits.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
}
setInterval(tickCountdown, 1000);
tickCountdown();

/* ---------- Sub-status rotation (pequenas variações de texto no idle) ---------- */
const idlePhrases = [
  'calculando probabilidade de existência',
  'reanalisando dados anteriores',
  'buscando padrão em ruído',
  'aguardando próxima variável',
];
let idlePhraseIdx = 0;
setInterval(() => {
  if (state.current !== 'idle') return;
  idlePhraseIdx = (idlePhraseIdx + 1) % idlePhrases.length;
  el.sub.innerHTML = idlePhrases[idlePhraseIdx] + '<span class="cursor">&nbsp;</span>';
}, 5000);

/* ---------- Glitch dos dígitos ----------
   Efeito puramente visual por cima do texto já renderizado: não mexe no
   cálculo do countdown. Quem fecha a janela chama tickCountdown(), que segue
   sendo a única fonte da verdade — assim volta ao valor certo sem duplicar a
   conta e sem deixar um número errado congelado na tela.
   ------------------------------------------------------------------- */
let glitchTimer = null;
let glitchFrames = null;

function scheduleGlitch(){
  const faixa = CONFIG.glitchIntervalRange || [7000, 18000];
  const delay = faixa[0] + Math.random() * (faixa[1] - faixa[0]);
  glitchTimer = setTimeout(runGlitch, delay);
}

// Troca só os algarismos e preserva os ':' — a largura do texto não muda,
// então os dígitos não "pulam" de posição durante o efeito.
function digitosCorrompidos(){
  return String(el.digits.textContent).replace(/[0-9]/g,
    () => String(Math.floor(Math.random() * 10)));
}

function endGlitch(){
  if (!glitchFrames) return;      // nada em curso: sai barato
  clearInterval(glitchFrames);
  glitchFrames = null;
  el.digits.classList.remove('glitching');
  tickCountdown();          // devolve o valor real imediatamente
}

function runGlitch(){
  scheduleGlitch();                        // reagenda sempre, mesmo se pular

  // não compete com o dimming dos eventos de conteúdo nem com o boot
  if (state.current !== 'idle') return;
  // countdown zerado não tem algarismo pra corromper
  if (!/[0-9]/.test(String(el.digits.textContent))) return;

  if (glitchFrames) endGlitch();           // clique repetido: reinicia limpo

  const fim = Date.now() + (CONFIG.glitchDuration || 320);
  el.digits.classList.add('glitching');

  glitchFrames = setInterval(() => {
    // se um evento começar no meio da janela, o glitch sai de cena na hora
    if (Date.now() >= fim || state.current !== 'idle'){ endGlitch(); return; }
    el.digits.textContent = digitosCorrompidos();
  }, CONFIG.glitchStepMs || 45);
}

scheduleGlitch();

/* ---------- Event scheduling ---------- */
function scheduleNextEvent(){
  // Idempotente de proposito: nunca pode existir mais de um timer de evento em
  // paralelo. No fluxo normal nunca ha um pendente aqui (endEvent so roda uma
  // vez por evento); isto protege o caso em que um endEvent() ja em voo dentro
  // do closure de um evento chega depois de um reset do painel de debug.
  clearTimeout(state.eventTimer);
  const [min, max] = CONFIG.eventIntervalRange;
  const delay = min + Math.random() * (max - min);
  state.eventTimer = setTimeout(runRandomEvent, delay);
}

// Monta o sorteio a partir de CONFIG.eventWeights (peso 0 desliga o tipo).
function pickWeightedEvent(){
  const pesos = CONFIG.eventWeights || {};
  const pool = [];
  Object.keys(pesos).forEach(tipo => {
    const n = Math.max(0, Math.floor(pesos[tipo] || 0));
    for (let i = 0; i < n; i++) pool.push(tipo);
  });
  return pool.length ? pickRandom(pool) : null;
}

function runRandomEvent(){
  if (state.current !== 'idle') { scheduleNextEvent(); return; }

  const pick = pickWeightedEvent();

  if (pick === 'lore') showContentEvent('event_lore', pickRandom(CONFIG.loreEntries));
  else if (pick === 'math') showContentEvent('event_math', pickRandom(CONFIG.mathEntries), 'type-error');
  else if (pick === 'video') showVideoEvent();
  else if (pick === 'transfer') showTransferEvent();
  // todos os pesos zerados ou tipo desconhecido: não trava o ciclo
  else scheduleNextEvent();
}

function pickRandom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function showContentEvent(stateName, entry, extraClass){
  state.current = stateName;
  hideChatLayer();          // chat tem prioridade mais baixa: sai de cena
  endGlitch();              // e o glitch nao compete com o dimming
  el.wrap.classList.add('dimmed');
  el.status.textContent = 'STATUS: PROCESSANDO';

  const panel = document.createElement('div');
  panel.className = 'event-panel' + (extraClass ? ' ' + extraClass : '');
  panel.innerHTML = `<div class="tag">${entry.tag}</div><div class="body">${entry.body}</div>`;
  el.eventLayer.appendChild(panel);
  requestAnimationFrame(() => panel.classList.add('visible'));

  setTimeout(() => {
    panel.classList.remove('visible');
    setTimeout(() => panel.remove(), 450);
    endEvent();
  }, CONFIG.eventVisibleDuration);
}

/* ---------- Evento de vídeo ----------
   Sorteia um .webm da lista, espera o vídeo REALMENTE terminar ('ended')
   em vez de usar duração fixa, e garante que endEvent() rode exatamente
   uma vez por evento — qualquer falha (arquivo ausente, codec recusado,
   decode travado) cai no mesmo caminho de saída e devolve o estado ao idle.
   ------------------------------------------------------------------- */
const videoState = {
  broken: new Set(),   // arquivos que falharam: não são sorteados de novo nesta sessão
  lastPlayed: null,    // evita repetir o mesmo vídeo duas vezes seguidas
};

function pickVideoFile(){
  const pool = CONFIG.videoEntries.filter(f => !videoState.broken.has(f));
  if (!pool.length) return null;
  const candidates = pool.length > 1
    ? pool.filter(f => f !== videoState.lastPlayed)
    : pool;
  return pickRandom(candidates);
}

function showVideoEvent(){
  const file = pickVideoFile();
  // Nenhum vídeo utilizável (lista vazia ou todos quebrados): segue o baile,
  // sem entrar no estado de vídeo e sem tela preta.
  if (!file){ scheduleNextEvent(); return; }

  state.current = 'event_video';
  videoState.lastPlayed = file;
  hideChatLayer();          // idem: nada de chat por cima do vídeo
  endGlitch();
  el.wrap.classList.add('dimmed');
  el.status.textContent = 'STATUS: PROCESSANDO';

  const v = el.video;
  let settled = false;
  let loadTimer = null;
  let maxTimer = null;

  function cleanup(){
    clearTimeout(loadTimer);
    clearTimeout(maxTimer);
    v.removeEventListener('canplay', onCanPlay);
    v.removeEventListener('ended', onEnded);
    v.removeEventListener('error', onError);
  }

  // Caminho único de saída: 'settled' impede que endEvent() rode duas vezes
  // (o que agendaria dois timers de evento em paralelo).
  function finish(){
    if (settled) return;
    settled = true;
    cleanup();
    el.videoLayer.classList.remove('visible');
    v.pause();
    // libera o decoder só depois do fade-out do layer
    setTimeout(() => { v.removeAttribute('src'); v.load(); }, 600);
    endEvent();
  }

  function fail(reason){
    if (settled) return;
    console.warn('[P3] vídeo ignorado (' + reason + '):', file);
    videoState.broken.add(file);
    finish();
  }

  function onCanPlay(){
    clearTimeout(loadTimer);
    el.videoLayer.classList.add('visible');
    const p = v.play();
    if (p && typeof p.catch === 'function') p.catch(() => fail('play() recusado'));
    maxTimer = setTimeout(() => fail('excedeu videoMaxDuration'), CONFIG.videoMaxDuration);
  }
  function onEnded(){ finish(); }
  function onError(){ fail('falha de carregamento/decode'); }

  v.addEventListener('canplay', onCanPlay, { once: true });
  v.addEventListener('ended', onEnded);
  v.addEventListener('error', onError);

  // Se o arquivo nem chega a ficar pronto, desiste em vez de travar no estado.
  loadTimer = setTimeout(() => fail('timeout de carregamento'), CONFIG.videoLoadTimeout);

  v.src = CONFIG.videoBasePath + file;
  v.load();
}

function endEvent(){
  state.current = 'idle';
  el.wrap.classList.remove('dimmed');
  el.status.textContent = 'STATUS: OBSERVANDO';
  scheduleNextEvent();
}


/* ---------- Evento de transferência ----------
   Segue as mesmas regras dos outros eventos de conteúdo: escurece o
   countdown, tira o chat da tela e sai por endEvent() exatamente uma vez.

   Censura idêntica à de fagulhas-data.ts do site: o idCode aparece limpo e o
   nome do sujeito é sempre censurado. Não inventamos regra nova aqui — no
   original nenhuma Fagulha tem o nome revelado.
   ------------------------------------------------------------------- */
const transferState = {
  broken: new Set(),   // imagens que falharam: não são sorteadas de novo
};

function pickTransferRoute(){
  const nodes = CONFIG.netNodes || [];
  if (nodes.length < 2) return null;
  const de = pickRandom(nodes);
  const restantes = nodes.filter(n => n !== de);   // origem != destino
  return { de, para: pickRandom(restantes) };
}

function pickFagulhaImage(){
  const pool = [];
  (CONFIG.fagulhaFiles || []).forEach(f => {
    (f.imagens || []).forEach(img => {
      if (!transferState.broken.has(img)) pool.push({ f, img });
    });
  });
  return pool.length ? pickRandom(pool) : null;
}

// Nome de arquivo com a censura do site: ID visível, nome do sujeito em blocos.
function nomeDeArquivo(f){
  return f.idCode.replace(/ /g, '') + '_' + f.nome + '.dat';
}

function showTransferEvent(){
  const rota = pickTransferRoute();
  const alvo = pickFagulhaImage();
  // sem rota ou sem imagem utilizável: segue o baile, sem entrar no estado
  if (!rota || !alvo){ scheduleNextEvent(); return; }

  state.current = 'event_transfer';
  hideChatLayer();                 // chat tem prioridade mais baixa
  endGlitch();
  el.wrap.classList.add('dimmed');
  el.status.textContent = 'STATUS: TRANSFERINDO';

  const f = alvo.f;
  const dur = CONFIG.transferVisibleDuration || CONFIG.eventVisibleDuration;
  const janela = dur * 0.85;       // chega em 100% um pouco antes de sair

  const panel = document.createElement('div');
  panel.className = 'event-panel type-transfer';
  panel.innerHTML =
    '<div class="tag">TRANSFERINDO \u25b8 ' + rota.de.nome + ' → ' + rota.para.nome + '</div>' +
    '<div class="transfer-body">' +
      '<img class="transfer-img" alt="">' +
      '<div class="transfer-info">' +
        '<div class="body">' +
          'ARQUIVO .......... ' + nomeDeArquivo(f) + '\n' +
          'CODINOME ......... ' + f.codinome + '\n' +
          'STATUS ........... ' + f.status + '\n' +
          'CLASSIFICA\u00c7\u00c3O .... ' + f.classificacao + '\n' +
          'TAMANHO .......... ' + f.size +
        '</div>' +
        '<div class="transfer-bar"><span></span></div>' +
        '<div class="transfer-pct">0%</div>' +
      '</div>' +
    '</div>';

  const img = panel.querySelector('.transfer-img');
  const barra = panel.querySelector('.transfer-bar span');
  const pct = panel.querySelector('.transfer-pct');

  // imagem quebrada não pode derrubar o evento: some só ela, o painel fica
  img.addEventListener('error', () => {
    console.warn('[P3] imagem de fagulha ignorada:', alvo.img);
    transferState.broken.add(alvo.img);
    img.style.display = 'none';
  });
  img.src = CONFIG.fagulhaBasePath + alvo.img;

  el.eventLayer.appendChild(panel);

  /* A barra precisa ter os 0% RESOLVIDOS antes de receber a largura final.
     Setar transition e width no mesmo callback (como estava) faz o navegador
     calcular o estilo uma vez só: a transição não tem de onde partir e a barra
     nasce cheia. O void offsetWidth força o reflow entre os dois estados —
     mesmo truque que showBurstEvent usa pra reiniciar o shake. */
  barra.style.width = '0%';
  void barra.offsetWidth;
  barra.style.transition = 'width ' + janela + 'ms linear';
  barra.style.width = '100%';

  // o cronômetro do número começa junto com a barra, pra os dois terminarem juntos
  const inicio = Date.now();

  requestAnimationFrame(() => panel.classList.add('visible'));
  let pctTimer = setInterval(() => {
    const r = Math.min(1, (Date.now() - inicio) / janela);
    pct.textContent = r >= 1 ? '100% // COMPLETO' : Math.round(r * 100) + '%';
    if (r >= 1){ clearInterval(pctTimer); pctTimer = null; }
  }, 100);

  // caminho único de saída, igual ao do vídeo: endEvent() roda uma vez só
  let settled = false;
  function finish(){
    if (settled) return;
    settled = true;
    clearInterval(pctTimer);
    panel.classList.remove('visible');
    setTimeout(() => panel.remove(), 450);
    endEvent();
  }
  setTimeout(finish, dur);
}

/* ---------- Boot sequence ----------
   Puramente estético: revela as linhas em intervalos regulares, segura um
   instante e some. Só no fim o estado vira 'idle' e o ciclo de eventos começa
   — por isso nada de lore/math/vídeo/chat pode aparecer por cima do boot.
   ------------------------------------------------------------------- */
function endBoot(){
  if (state.current !== 'boot') return;   // roda uma vez só
  state.current = 'idle';
  el.stage.classList.remove('booting');
  el.bootLayer.classList.add('done');
  el.status.textContent = 'STATUS: OBSERVANDO';
  setTimeout(() => el.bootLayer.remove(), 700);   // tira do DOM após o fade
  scheduleNextEvent();
}

function runBootSequence(){
  const linhas = CONFIG.bootLines || [];
  const total = CONFIG.bootDuration || 0;

  // boot desligado: cai direto no ciclo normal
  if (!total || !linhas.length){ endBoot(); return; }

  el.status.textContent = 'STATUS: BOOT';

  // revela as linhas nos primeiros 80% e usa o resto como pausa antes do fade
  const passo = (total * 0.8) / linhas.length;
  linhas.forEach((linha, i) => {
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = 'boot-line' + (linha.c ? ' ' + linha.c : '');
      div.textContent = linha.t;
      if (i === linhas.length - 1) div.innerHTML = linha.t + '<span class="cursor">&nbsp;</span>';
      el.bootLines.appendChild(div);
      requestAnimationFrame(() => div.classList.add('visible'));
    }, passo * i);
  });

  setTimeout(endBoot, total);
}

/* ==========================================================================
   CAMADA DE REDE (decorativa)
   Roda em paralelo à state machine: nunca lê nem escreve state.current e
   nunca chama endEvent/scheduleNextEvent. Um pulso pode acontecer durante um
   lore, um vídeo, o boot ou o idle sem interferir em nada.
   ========================================================================== */
const SVG_NS = 'http://www.w3.org/2000/svg';
const netEl = {
  edges: document.getElementById('net-edges'),
  nodes: document.getElementById('net-nodes'),
  pulses: document.getElementById('net-pulses'),
};
const netState = {
  byId: {},
  nodes: [],      // nós "vivos": guardam base (bx,by) e posição atual (x,y)
  edges: [],
  pulsos: [],     // pulsos em voo
  pool: [],       // círculos de pulso reaproveitados
  raf: null,
  t0: 0,
};

function buildNetwork(){
  netState.t0 = Date.now();

  (CONFIG.netNodes || []).forEach((cfg, i) => {
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', cfg.x); c.setAttribute('cy', cfg.y);
    c.setAttribute('r', cfg.hub ? 8 : 5);
    c.setAttribute('class', 'net-node' + (cfg.hub ? ' hub' : ''));
    netEl.nodes.appendChild(c);

    let label = null;
    if (CONFIG.netShowLabels){
      label = document.createElementNS(SVG_NS, 'text');
      label.setAttribute('x', cfg.x + (cfg.hub ? 17 : 13));
      label.setAttribute('y', cfg.y + 5);
      label.setAttribute('class', 'net-label');
      label.textContent = cfg.nome;
      netEl.nodes.appendChild(label);
    }

    // Período próprio por nó, espalhado pela faixa, mais um jitter. Os quatro
    // harmônicos usam razões não inteiras (0.61/0.83/0.47) pra órbita ficar
    // irregular e os nós nunca voltarem a sincronizar entre si.
    const faixa = CONFIG.netDriftPeriodRange || [9000, 21000];
    const total = (CONFIG.netNodes || []).length || 1;
    const base = faixa[0] + (faixa[1] - faixa[0]) * ((i + 0.5) / total);
    const per = (base * (0.85 + Math.random() * 0.3)) / 1000;   // em segundos
    const w = k => (2 * Math.PI) / (per * k);

    const no = {
      cfg, circle: c, label,
      bx: cfg.x, by: cfg.y, x: cfg.x, y: cfg.y,
      dx: cfg.hub ? 17 : 13,
      w1: w(1), w2: w(0.61), w3: w(0.83), w4: w(0.47),
      f1: Math.random() * Math.PI * 2, f2: Math.random() * Math.PI * 2,
      f3: Math.random() * Math.PI * 2, f4: Math.random() * Math.PI * 2,
      arestas: [],
      timer: null,
    };
    netState.byId[cfg.id] = no;
    netState.nodes.push(no);
  });

  (CONFIG.netEdges || []).forEach(par => {
    const a = netState.byId[par[0]], b = netState.byId[par[1]];
    if (!a || !b) return;          // aresta apontando pra nó inexistente: ignora
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.setAttribute('class', 'net-edge');
    netEl.edges.appendChild(line);
    const aresta = { a, b, line, ativos: 0 };
    netState.edges.push(aresta);
    a.arestas.push(aresta);
    b.arestas.push(aresta);
  });
}

/* ---------- Loop de animação ----------
   Um único rAF cuida de tudo que é contínuo: posição dos nós, endpoints das
   arestas e posição dos pulsos. O pulso NÃO usa mais transição CSS: com os
   nós se mexendo, endpoints fixos fariam o pulso descolar da linha. Aqui ele
   é interpolado entre as posições VIVAS dos dois nós, no mesmo frame.
   ------------------------------------------------------------------- */
function netFrame(){
  const agora = Date.now();
  const t = (agora - netState.t0) / 1000;
  const A = CONFIG.netDriftAmplitude || 0;

  if (A > 0){
    for (let i = 0; i < netState.nodes.length; i++){
      const n = netState.nodes[i];
      n.x = n.bx + A * (0.62 * Math.sin(n.w1 * t + n.f1) + 0.38 * Math.sin(n.w2 * t + n.f2));
      n.y = n.by + A * (0.58 * Math.cos(n.w3 * t + n.f3) + 0.42 * Math.sin(n.w4 * t + n.f4));
      n.circle.setAttribute('cx', n.x);
      n.circle.setAttribute('cy', n.y);
      if (n.label){
        n.label.setAttribute('x', n.x + n.dx);
        n.label.setAttribute('y', n.y + 5);
      }
    }
    for (let i = 0; i < netState.edges.length; i++){
      const e = netState.edges[i];
      e.line.setAttribute('x1', e.a.x); e.line.setAttribute('y1', e.a.y);
      e.line.setAttribute('x2', e.b.x); e.line.setAttribute('y2', e.b.y);
    }
  }

  for (let i = netState.pulsos.length - 1; i >= 0; i--){
    const p = netState.pulsos[i];
    const r = (agora - p.inicio) / p.dur;
    if (r >= 1){ encerraPulso(p, i); continue; }
    p.circle.setAttribute('cx', p.de.x + (p.para.x - p.de.x) * r);
    p.circle.setAttribute('cy', p.de.y + (p.para.y - p.de.y) * r);
  }

  // Sem drift e sem pulso em voo não há o que animar: o loop dorme e volta
  // no próximo pulso. Com o drift ligado (padrão) ele roda sempre.
  if (A <= 0 && netState.pulsos.length === 0){ netState.raf = null; return; }
  netState.raf = requestAnimationFrame(netFrame);
}

function ensureNetLoop(){
  if (netState.raf === null) netState.raf = requestAnimationFrame(netFrame);
}

/* ---------- Pulsos: um ciclo independente por nó ---------- */
function acquirePulseCircle(){
  const c = netState.pool.pop();
  if (c) return c;
  const novo = document.createElementNS(SVG_NS, 'circle');
  novo.setAttribute('r', 5);
  novo.setAttribute('class', 'net-pulse');
  netEl.pulses.appendChild(novo);
  return novo;
}

function encerraPulso(p, i){
  netState.pulsos.splice(i, 1);
  p.circle.classList.remove('moving');
  netState.pool.push(p.circle);
  // contador por aresta: outro pulso pode estar passando pela mesma linha
  p.aresta.ativos--;
  if (p.aresta.ativos <= 0){
    p.aresta.ativos = 0;
    p.aresta.line.classList.remove('active');
  }
}

function scheduleNodePulse(no){
  const faixa = CONFIG.netPulseIntervalRange || [4000, 11000];
  const delay = faixa[0] + Math.random() * (faixa[1] - faixa[0]);
  no.timer = setTimeout(() => runNodePulse(no), delay);
}

function runNodePulse(no){
  scheduleNodePulse(no);            // reagenda sempre, mesmo se pular a vez

  const teto = CONFIG.netMaxConcurrentPulses || 1;
  if (netState.pulsos.length >= teto) return;   // teto cheio: pula a vez
  const aresta = pickRandom(no.arestas);
  if (!aresta) return;                          // nó sem aresta

  // sentido sorteado por disparo, como antes
  const inverso = Math.random() < 0.5;
  const de   = inverso ? aresta.b : aresta.a;
  const para = inverso ? aresta.a : aresta.b;

  aresta.ativos++;
  aresta.line.classList.add('active');

  const circle = acquirePulseCircle();
  circle.setAttribute('cx', de.x);
  circle.setAttribute('cy', de.y);
  circle.classList.add('moving');

  netState.pulsos.push({
    circle, aresta, de, para,
    inicio: Date.now(),
    dur: CONFIG.netPulseDuration || 1800,
  });
  ensureNetLoop();
}

buildNetwork();
netState.nodes.forEach(scheduleNodePulse);
ensureNetLoop();

runBootSequence();

/* ==========================================================================
   HOOK PÚBLICO — integração futura com Twitch chat (tmi.js)
   Chame window.P3Terminal.pushChatEvent('usuario', 'mensagem') quando
   quiser que uma mensagem apareça na "janela" que o P3 abre.
   Não interrompe eventos de conteúdo (lore/math/video) em andamento —
   só aparece durante o idle.
   ========================================================================== */
let chatEventTimer = null;   // encerra o burst
let chatIdleTimer = null;    // esvazia a lista depois de um tempo sem mensagem

function limparListaChat(){
  const linhas = Array.prototype.slice.call(el.chatList.children);
  for (let i = 0; i < linhas.length; i++) linhas[i].remove();
}

// Agenda o sumiço da lista por inatividade (mesma sensação do comportamento
// antigo de sumir sozinho depois de alguns segundos).
function armarSumicoDoChat(){
  clearTimeout(chatIdleTimer);
  chatIdleTimer = setTimeout(() => {
    el.chatLayer.classList.remove('visible');
    burstClassTimer = setTimeout(limparListaChat, 400);
  }, CONFIG.twitch.chatIdleTimeout || 6000);
}

/* Some com a camada de chat inteira — lista e burst.
   Usado quando um evento de conteúdo começa: o chat tem prioridade mais
   baixa, e a checagem de 'idle' feita na hora de exibir não basta — a camada
   fica segundos na tela e um lore/math/vídeo pode começar no meio disso,
   deixando os dois sobrepostos. Esvazia a lista também, senão ela reapareceria
   depois com mensagens velhas. */
function hideChatLayer(){
  clearTimeout(chatEventTimer);
  clearTimeout(chatIdleTimer);
  clearTimeout(burstClassTimer);
  el.chatLayer.classList.remove('visible');
  burstClassTimer = setTimeout(() => {
    el.chatLayer.classList.remove('burst');
    limparListaChat();
  }, 400);
}

function pushChatEvent(username, message){
  if (state.current !== 'idle') return; // baixa prioridade, não atropela outros eventos

  // se um burst estava na tela, a lista retoma a camada
  clearTimeout(burstClassTimer);
  clearTimeout(chatEventTimer);
  el.chatLayer.classList.remove('burst');

  const linha = document.createElement('div');
  linha.className = 'chat-line';
  const quem = document.createElement('span');
  quem.className = 'who';
  quem.textContent = username + ':';
  const texto = document.createElement('span');
  texto.className = 'msg';
  texto.textContent = message;          // textContent, nunca innerHTML: vem do chat
  linha.appendChild(quem);
  linha.appendChild(texto);

  // mais nova entra embaixo; as antigas sobem e saem pelo topo
  el.chatList.appendChild(linha);

  // Laço limitado de propósito: contar o excedente antes evita depender de
  // remove() ter efeito pra terminar.
  const max = CONFIG.twitch.maxVisibleMessages || 5;
  let excedente = el.chatList.children.length - max;
  while (excedente-- > 0 && el.chatList.children.length) el.chatList.children[0].remove();

  el.chatLayer.classList.add('visible');
  armarSumicoDoChat();
}


/* ==========================================================================
   TWITCH CHAT (tmi.js, modo anônimo) + DETECÇÃO DE BURST
   Lê o chat público do canal sem OAuth. Se o tmi.js não carregar, esta seção
   inteira vira no-op e o resto do terminal continua funcionando.
   ========================================================================== */

// CDN com versão pinada (nada de @latest: uma release nova não pode quebrar a live).
// Bundle +esm do jsDelivr: o pacote npm do tmi.js NÃO publica build de browser
// (o dist/tmi.min.js que aparece na doc antiga só existe como asset de release
// no GitHub, que o jsDelivr não serve). Testado carregando de file:// no
// Chromium, que é como o OBS abre o overlay.
const TMI_CDN = 'https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/+esm';

// Quanto tempo a variante burst fica na tela. Maior que os 4500ms da mensagem
// normal porque a linha do burst tem mais texto pra ler.
const BURST_VISIBLE_DURATION = 7000;

/* ---------- Detecção de burst: fila de timestamps como deque ----------
   A poda acontece na própria chegada da mensagem (não precisa de intervalo
   de limpeza): empurra o timestamp novo e descarta pela frente tudo que saiu
   da janela deslizante. Custo O(1) amortizado.
   --------------------------------------------------------------------- */
const burst = { stamps: [], lastFiredAt: 0, names: [] };

function registerMessage(username){
  const now = Date.now();
  burst.stamps.push(now);
  burst.names.push(username);

  const cutoff = now - CONFIG.twitch.burstWindowMs;
  while (burst.stamps.length && burst.stamps[0] < cutoff){
    burst.stamps.shift();
    burst.names.shift();
  }

  return burst.stamps.length >= CONFIG.twitch.burstThreshold;
}

/* ---------- Exibição ---------- */
const chatDisplay = { lastShownAt: 0 };   // throttle da mensagem individual
let burstClassTimer = null;

// P3 percebendo que tem gente demais falando ao mesmo tempo.
const burstLines = [
  (n, nicks) => n + ' vozes simultâneas / não consigo isolar o sinal  [' + nicks + ']',
  (n, nicks) => n + ' entradas no mesmo intervalo / o padrão não fecha  [' + nicks + ']',
  (n, nicks) => 'pico de ' + n + ' / recalculando quem está falando  [' + nicks + ']',
];

function showBurstEvent(count, names){
  const nicks = [...new Set(names)].slice(-3).join(', ');
  const line = pickRandom(burstLines)(count, nicks);

  clearTimeout(chatEventTimer);
  clearTimeout(chatIdleTimer);     // o burst assume a visibilidade da camada
  clearTimeout(burstClassTimer);

  el.chatBurst.querySelector('.who').textContent = '>>';
  el.chatBurst.querySelector('.msg').textContent = line;

  // remove+reflow+add reinicia o shake mesmo se a layer já estiver visível
  el.chatLayer.classList.remove('visible', 'burst');
  void el.chatLayer.offsetWidth;
  el.chatLayer.classList.add('burst', 'visible');

  chatEventTimer = setTimeout(() => {
    el.chatLayer.classList.remove('burst');
    // a lista volta a aparecer se ainda tiver mensagem; senão a camada some
    if (el.chatList.children.length) armarSumicoDoChat();
    else el.chatLayer.classList.remove('visible');
  }, BURST_VISIBLE_DURATION);
}

/* ---------- Pipeline de uma mensagem ----------
   filtros -> registerMessage (SEMPRE, em qualquer estado) -> burst OU
   mensagem individual, nunca as duas.
   ---------------------------------------------------------------- */
function handleChatMessage(username, rawMessage){
  const cfg = CONFIG.twitch;

  const text = String(rawMessage == null ? '' : rawMessage).trim();
  if (!text) return;                  // vazia / só espaço
  if (text.startsWith('!')) return;   // comando de bot

  const message = text.length > cfg.maxMessageLength
    ? text.slice(0, cfg.maxMessageLength - 1).trimEnd() + '\u2026'
    : text;

  const name = String(username || '???');
  const now = Date.now();

  // Conta sempre: se o burst só fosse medido durante o idle, um lore de 7s
  // engoliria o pico e o P3 reagiria tarde, com número errado.
  const isBurst = registerMessage(name);
  const emCooldown = (now - burst.lastFiredAt) < cfg.burstCooldownMs;

  if (isBurst && !emCooldown){
    const count = burst.stamps.length;
    const names = burst.names.slice();
    burst.stamps.length = 0;
    burst.names.length = 0;
    burst.lastFiredAt = now;

    // Exibição só no idle. Não enfileira: burst velho mostrado atrasado mentiria.
    if (state.current !== 'idle') return;
    showBurstEvent(count, names);
    return;
  }

  // Mensagem individual: respeita o idle e o intervalo mínimo entre exibições.
  if (state.current !== 'idle') return;
  if ((now - chatDisplay.lastShownAt) < cfg.minGapMs) return;
  chatDisplay.lastShownAt = now;
  pushChatEvent(name, message);
}

/* ---------- Conexão anônima ---------- */
function connectTwitchChat(){
  const lib = (typeof window !== 'undefined' && window.tmi)
    || (typeof tmi !== 'undefined' ? tmi : null);
  if (!lib || !lib.Client){
    console.warn('[P3] tmi.js carregou mas não expôs Client — seguindo sem chat.');
    return;
  }

  const client = new lib.Client({
    options: { skipUpdatingEmotesets: true },
    connection: { reconnect: true, secure: true },
    // sem bloco 'identity': o tmi.js gera um justinfan sozinho e entra como
    // leitor anônimo. Nenhum OAuth envolvido.
    channels: [CONFIG.twitch.channel],
  });

  client.on('message', (channel, tags, message, self) => {
    if (self) return;
    try {
      handleChatMessage(tags['display-name'] || tags.username || '???', message);
    } catch (e){
      console.warn('[P3] erro processando mensagem:', e);
    }
  });
  client.on('connected', () => console.log('[P3] chat conectado:', CONFIG.twitch.channel));
  client.on('disconnected', reason => console.warn('[P3] chat desconectado:', reason));

  const p = client.connect();
  if (p && typeof p.catch === 'function') p.catch(e => console.warn('[P3] falha ao conectar:', e));

  window.P3Twitch = client;
}

/* ---------- Carregamento do CDN, com guarda ----------
   Qualquer falha (rede, domínio bloqueado no OBS, CDN fora) apenas loga e
   deixa o overlay rodando sem chat. Nada aqui pode derrubar o countdown.
   ------------------------------------------------------------------- */
// Isolado num objeto pra que o import possa ser trocado em teste.
const tmiLoader = {
  load: () => import(TMI_CDN),
};

function initTwitchChat(){
  try {
    const cfg = CONFIG.twitch;
    if (!cfg || !cfg.channel || cfg.channel === 'seu_canal'){
      console.warn('[P3] CONFIG.twitch.channel não configurado — rodando sem chat.');
      return;
    }

    tmiLoader.load().then(mod => {
      try {
        window.tmi = (mod && mod.default) || mod;
        connectTwitchChat();
      } catch (e){
        console.warn('[P3] tmi.js falhou ao iniciar:', e);
      }
    }).catch(err => {
      console.warn('[P3] não foi possível carregar tmi.js do CDN — overlay segue sem chat.', err);
    });
  } catch (e){
    console.warn('[P3] init do chat falhou:', e);
  }
}

initTwitchChat();

/* ==========================================================================
   PAINEL DE DEBUG — só existe com ?debug=1 na URL
   Sem o parâmetro este bloco retorna na primeira linha e nada é criado:
   nenhum elemento, nenhum estilo, nenhum timer. Zero pegada numa live real.

   Regra que todos os botões seguem: eles NÃO forçam por cima do estado atual.
   showContentEvent/showVideoEvent/showTransferEvent não checam state.current
   por conta própria (no fluxo real quem checa é runRandomEvent), então chamar
   qualquer uma delas durante outro evento quebraria a exclusão mútua e
   deixaria dois timers de evento em paralelo. Por isso a checagem vive aqui.
   ========================================================================== */
(function(){
  var params;
  try { params = new URLSearchParams(location.search); } catch (e){ return; }
  if (!params || params.get('debug') !== '1') return;

  var CSS =
    '#debug-panel{position:fixed;top:56px;right:12px;z-index:100;' +
    'width:200px;padding:10px;background:rgba(3,8,4,0.88);' +
    'border:1px solid var(--phosphor-dim);font-family:var(--font-ui);' +
    'font-size:11px;color:var(--phosphor);letter-spacing:0.5px;}' +
    '#debug-panel h4{font-size:10px;letter-spacing:2px;color:var(--amber);' +
    'margin-bottom:8px;font-weight:400;}' +
    '#debug-panel button{display:block;width:100%;margin-bottom:4px;padding:5px 7px;' +
    'background:rgba(51,255,102,0.06);border:1px solid var(--phosphor-faint);' +
    'color:var(--phosphor);font-family:inherit;font-size:11px;text-align:left;' +
    'cursor:pointer;letter-spacing:0.5px;}' +
    '#debug-panel button:hover{background:rgba(51,255,102,0.16);' +
    'border-color:var(--phosphor-dim);}' +
    '#debug-panel button.perigo{color:var(--amber);border-color:rgba(255,176,0,0.35);}' +
    '#debug-estado{margin-top:8px;padding-top:7px;border-top:1px solid var(--phosphor-faint);' +
    'color:var(--phosphor-dim);line-height:1.5;}' +
    '#debug-msg{margin-top:5px;min-height:26px;color:var(--amber);line-height:1.35;}' +
    '#debug-msg.ignorado{color:var(--err);}';

  var estilo = document.createElement('style');
  estilo.textContent = CSS;
  document.head.appendChild(estilo);

  var painel = document.createElement('div');
  painel.id = 'debug-panel';
  painel.innerHTML = '<h4>DEBUG</h4>';
  document.body.appendChild(painel);

  var linhaEstado = document.createElement('div');
  linhaEstado.id = 'debug-estado';
  var linhaMsg = document.createElement('div');
  linhaMsg.id = 'debug-msg';

  function aviso(texto, ignorado){
    linhaMsg.textContent = texto;
    linhaMsg.className = ignorado ? 'ignorado' : '';
  }

  /* Depois de um reset com evento em voo fica um endEvent() órfão agendado
     dentro do closure daquele evento — inalcançável daqui. Se um evento NOVO
     começar antes de o órfão disparar, ele marca idle por cima do novo e um
     segundo painel entra em cena. Por isso o reset abre uma janela de espera:
     nenhum evento de conteúdo entra até o órfão ter passado. */
  var bloqueadoAte = 0;

  // Porteiro: eventos de conteúdo só entram a partir do idle, igual ao fluxo real.
  function exigirIdle(nome){
    var agora = Date.now();
    if (agora < bloqueadoAte){
      aviso('IGNORADO: ' + nome + ' — esperando o evento anterior encerrar ('
        + Math.ceil((bloqueadoAte - agora) / 1000) + 's)', true);
      return false;
    }
    if (state.current !== 'idle'){
      aviso('IGNORADO: ' + nome + ' — estado atual é ' + state.current, true);
      return false;
    }
    return true;
  }

  function botao(rotulo, fn, perigo){
    var b = document.createElement('button');
    b.textContent = rotulo;
    if (perigo) b.className = 'perigo';
    b.addEventListener('click', function(){
      try { fn(); } catch (e){ aviso('ERRO: ' + e.message, true); }
    });
    painel.appendChild(b);
    return b;
  }

  botao('▸ lore', function(){
    if (!exigirIdle('lore')) return;
    var entrada = pickRandom(CONFIG.loreEntries);
    showContentEvent('event_lore', entrada);
    aviso('lore: ' + entrada.tag);
  });

  botao('▸ math', function(){
    if (!exigirIdle('math')) return;
    var entrada = pickRandom(CONFIG.mathEntries);
    showContentEvent('event_math', entrada, 'type-error');
    aviso('math: ' + entrada.tag);
  });

  botao('▸ vídeo', function(){
    if (!exigirIdle('vídeo')) return;
    showVideoEvent();
    // showVideoEvent desiste sozinho se não houver arquivo utilizável
    aviso(state.current === 'event_video'
      ? 'vídeo: ' + videoState.lastPlayed
      : 'nenhum vídeo utilizável (todos quebrados?)');
  });

  botao('▸ transferência', function(){
    if (!exigirIdle('transferência')) return;
    showTransferEvent();
    aviso(state.current === 'event_transfer'
      ? 'transferência iniciada'
      : 'sem imagem/rota utilizável');
  });

  botao('▸ replay do boot', function(){
    if (!exigirIdle('boot')) return;
    // A camada de boot sai do DOM no fim da sequência: recoloca antes.
    clearTimeout(state.eventTimer);   // endBoot vai agendar de novo no fim
    el.bootLines.innerHTML = '';
    if (!el.bootLayer.parentNode) el.stage.appendChild(el.bootLayer);
    el.bootLayer.classList.remove('done');
    el.stage.classList.add('booting');
    state.current = 'boot';
    runBootSequence();
    aviso('boot reiniciado (' + CONFIG.bootDuration + 'ms)');
  });

  botao('▸ chat: 1 mensagem', function(){
    window.P3Terminal.simulateChatMessage('espectador_teste', 'mensagem isolada de teste');
    aviso(el.chatLayer.classList.contains('visible') && !el.chatLayer.classList.contains('burst')
      ? 'mensagem exibida'
      : 'descartada (estado ' + state.current + ' ou throttle de ' + CONFIG.twitch.minGapMs + 'ms)');
  });

  botao('▸ chat: burst', function(){
    var n = (CONFIG.twitch.burstThreshold || 6) + 1;
    for (var i = 1; i <= n; i++)
      window.P3Terminal.simulateChatMessage('teste_' + i, 'mensagem de rajada ' + i);
    if (el.chatLayer.classList.contains('burst')) aviso(n + ' msgs → burst disparado');
    else if (state.current !== 'idle') aviso(n + ' msgs → contadas, exibição descartada ('
      + state.current + ')');
    else aviso(n + ' msgs → sem burst (cooldown de ' + CONFIG.twitch.burstCooldownMs + 'ms)');
  });

  botao('▸ glitch nos dígitos', function(){
    if (!exigirIdle('glitch')) return;
    // runGlitch reagenda o próprio ciclo; sem limpar o pendente a cadeia duplica
    clearTimeout(glitchTimer);
    runGlitch();
    aviso('glitch por ' + CONFIG.glitchDuration + 'ms');
  });

  botao('▸ chat: encher a lista', function(){
    var max = CONFIG.twitch.maxVisibleMessages || 5;
    var n = max + 2;                                   // estoura o limite de propósito
    var gap = (CONFIG.twitch.minGapMs || 1200) + 120;  // passa pelo throttle
    for (var i = 1; i <= n; i++){
      (function(k){
        setTimeout(function(){
          window.P3Terminal.simulateChatMessage('espectador_' + k, 'mensagem numero ' + k);
        }, k * gap);
      })(i);
    }
    aviso(n + ' msgs em ' + ((n * gap) / 1000).toFixed(1) + 's (lista mostra ' + max + ')');
  });

  botao('▸ pulso na rede', function(){
    var nos = netState.nodes;
    if (!nos.length){ aviso('grafo vazio', true); return; }
    var no = pickRandom(nos);
    // runNodePulse reagenda o ciclo do nó ao ser chamado. No fluxo real ele roda
    // A PARTIR do timer (que já se consumiu); chamando na mão, o timer pendente
    // continua vivo e a cadeia daquele nó duplicaria a cada clique.
    clearTimeout(no.timer);
    runNodePulse(no);
    aviso(netState.pulsos.length >= CONFIG.netMaxConcurrentPulses
      ? 'pulso a partir de ' + no.cfg.nome + ' (teto atingido)'
      : 'pulso a partir de ' + no.cfg.nome);
  });

  botao('▸ reset', function(){
    var anterior = state.current;
    var espera = 0;
    if (anterior === 'event_video') espera = CONFIG.videoMaxDuration;
    else if (anterior === 'event_transfer') espera = CONFIG.transferVisibleDuration;
    else if (anterior === 'event_lore' || anterior === 'event_math') espera = CONFIG.eventVisibleDuration;
    // A janela só estende, nunca encurta: um segundo reset (já em idle,
    // espera=0) não pode apagar o bloqueio aberto pelo reset anterior — o
    // órfão daquele evento continua em voo.
    if (espera) bloqueadoAte = Math.max(bloqueadoAte, Date.now() + espera);

    clearTimeout(state.eventTimer);
    clearTimeout(chatEventTimer);
    clearTimeout(burstClassTimer);

    var paineis = Array.prototype.slice.call(el.eventLayer.children);
    for (var i = 0; i < paineis.length; i++) paineis[i].remove();

    el.videoLayer.classList.remove('visible');
    try { el.video.pause(); } catch (e){}
    el.chatLayer.classList.remove('visible');
    el.chatLayer.classList.remove('burst');
    el.wrap.classList.remove('dimmed');
    el.stage.classList.remove('booting');
    el.status.textContent = 'STATUS: OBSERVANDO';

    state.current = 'idle';
    scheduleNextEvent();
    aviso(espera
      ? 'reset — idle; eventos travados por ' + (espera / 1000) + 's (órfão em voo)'
      : 'reset — idle, timers limpos');
  }, true);

  painel.appendChild(linhaEstado);
  painel.appendChild(linhaMsg);

  setInterval(function(){
    linhaEstado.textContent =
      'estado: ' + state.current +
      '\npulsos: ' + netState.pulsos.length + '/' + CONFIG.netMaxConcurrentPulses +
      ' · chat: ' + burst.stamps.length + '/' + CONFIG.twitch.burstThreshold +
      (Date.now() < bloqueadoAte
        ? ' · travado: ' + Math.ceil((bloqueadoAte - Date.now()) / 1000) + 's' : '');
  }, 250);

  console.log('[P3] modo debug ativo (?debug=1)');
})();

window.P3Terminal = {
  pushChatEvent,
  // passa pelo pipeline real (filtros + burst), útil pra testar sem chat ao vivo
  simulateChatMessage: handleChatMessage,
  // permite trocar o alvo do countdown em runtime, se precisar
  setTargetDate: (isoString) => { CONFIG.targetDate = new Date(isoString); },
};
</script>

<script>
(function(){
  var log = [];
  var v = el.video;

  // listener proprio, adicionado ANTES de qualquer evento, so pra observar
  v.addEventListener('error', function(){
    log.push({ tipo: 'ERROR', arq: String(v.currentSrc).split('/').pop(),
               code: v.error ? v.error.code : null,
               msg: v.error ? String(v.error.message) : null,
               net: v.networkState, ready: v.readyState });
  }, true);
  v.addEventListener('abort', function(){
    log.push({ tipo: 'abort', arq: String(v.currentSrc).split('/').pop() });
  }, true);
  v.addEventListener('stalled', function(){
    log.push({ tipo: 'stalled', arq: String(v.currentSrc).split('/').pop() });
  }, true);

  // captura os avisos do proprio overlay
  var warnOrig = console.warn;
  console.warn = function(){
    log.push({ tipo: 'warn', msg: Array.prototype.join.call(arguments, ' ') });
    warnOrig.apply(console, arguments);
  };

  endBoot();

  var rodadas = 0;
  function despejar(){
    if (document.getElementById('REPRO')) return;
    var pre = document.createElement('pre');
    pre.id = 'REPRO';
    pre.textContent = JSON.stringify({
      rodadas: rodadas,
      quebrados: Array.from(videoState.broken),
      log: log
    });
    document.body.appendChild(pre);
  }
  setTimeout(despejar, 44000);          // rede de seguranca: despeja de todo jeito

  function proxima(){
    if (rodadas++ >= 12){ despejar(); return; }
    clearTimeout(state.eventTimer);
    state.current = 'idle';
    showVideoEvent();
    log.push({ tipo: 'inicia', arq: videoState.lastPlayed, rodada: rodadas });
    // espera o evento terminar sozinho e emenda o proximo imediatamente
    var esperar = setInterval(function(){
      if (state.current === 'idle'){ clearInterval(esperar); proxima(); }
    }, 60);
  }
  setTimeout(proxima, 400);
})();
</script>
