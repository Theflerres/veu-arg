<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>P3_KERNEL // COUNTDOWN_MODULE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #050605;
    --grid: rgba(51,255,102,0.035);
    --phosphor: #33ff66;
    --phosphor-dim: #16712f;
    --phosphor-faint: #0a3d1f;
    --amber: #ffb000;
    --err: #ff3b3b;
    --font-ui: 'JetBrains Mono', monospace;
    --font-display: 'Share Tech Mono', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    width:100%; height:100%;
    background:var(--bg);
    color:var(--phosphor);
    font-family:var(--font-ui);
    overflow:hidden;
  }

  /* ---------- CRT layer ---------- */
  .crt-scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px
    );
    mix-blend-mode:multiply;
  }
  .crt-vignette{
    position:fixed; inset:0; pointer-events:none; z-index:51;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }
  .crt-flicker{
    position:fixed; inset:0; pointer-events:none; z-index:49;
    background:var(--phosphor);
    opacity:0;
    animation:flicker 6.3s infinite;
  }
  @keyframes flicker{
    0%,96%,100%{ opacity:0; }
    97%{ opacity:0.02; }
    98%{ opacity:0; }
    99%{ opacity:0.015; }
  }

  .bg-grid{
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:40px 40px;
  }

  /* ---------- Camada de rede (decorativa, atrás de tudo) ----------
     Mesmas cores do resto do terminal: verde em repouso, âmbar só no pulso.
     Opacidade baixa de propósito — fica atrás dos dígitos do countdown. */
  #net-layer{
    position:fixed; inset:0; z-index:1;
    pointer-events:none;
  }
  .net-edge{
    stroke:var(--phosphor);
    stroke-width:1;
    stroke-opacity:0.10;
    transition:stroke 0.45s ease, stroke-opacity 0.45s ease;
  }
  .net-edge.active{
    stroke:var(--amber);
    stroke-opacity:0.28;
  }
  .net-node{
    fill:var(--phosphor);
    fill-opacity:0.30;
    /* mesma intensidade discreta do #countdown-digits, sem neon */
    filter:drop-shadow(0 0 6px rgba(51,255,102,0.40));
  }
  .net-node.hub{
    fill-opacity:0.46;
    filter:drop-shadow(0 0 9px rgba(51,255,102,0.45));
  }
  .net-label{
    fill:var(--phosphor);
    fill-opacity:0.09;
    font-family:var(--font-ui);
    font-size:15px;
    letter-spacing:2px;
  }
  .net-pulse{
    fill:var(--amber);
    filter:drop-shadow(0 0 8px rgba(255,176,0,0.50));
    opacity:0;
    transition:opacity 0.3s ease;
  }
  .net-pulse.moving{ opacity:0.85; }

  /* ---------- Frame chrome ---------- */
  .frame{
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column;
    padding:28px 40px;
  }

  .frame-header, .frame-footer{
    display:flex; justify-content:space-between;
    font-size:13px; letter-spacing:1px;
    color:var(--phosphor-dim);
  }

  .frame-header span, .frame-footer span{ opacity:0.85; }

  #clock-realtime{ color:var(--phosphor-dim); }

  /* ---------- Stage (countdown + events share this space) ---------- */
  .stage{
    flex:1;
    position:relative;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Boot sequence (estético, roda uma vez ao carregar) ---------- */
  /* enquanto .booting estiver na stage o countdown fica escondido; a classe
     sai no fim do boot e o próprio transition do #countdown-wrap faz o fade-in */
  .stage.booting #countdown-wrap{ opacity:0; }

  #boot-layer{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center;
    padding-left:8%;
    font-size:clamp(12px, 1.15vw, 16px);
    line-height:2;
    color:var(--phosphor);
    transition:opacity 0.6s ease;
    pointer-events:none;
  }
  #boot-layer.done{ opacity:0; }

  .boot-line{
    opacity:0;
    transform:translateX(-8px);
    transition:opacity 0.22s ease, transform 0.22s ease;
    text-shadow:0 0 6px rgba(51,255,102,0.35);
    white-space:pre;
  }
  .boot-line.visible{ opacity:1; transform:translateX(0); }
  /* linha vazia no CONFIG vira pausa visual: div vazia não gera altura */
  .boot-line:empty::before{ content:' '; }
  .boot-line.warn{ color:var(--amber); }
  .boot-line.err{ color:var(--err); }

  /* ---------- Countdown ---------- */
  #countdown-wrap{
    text-align:center;
    transition:opacity 0.6s ease, filter 0.6s ease;
  }
  #countdown-wrap.dimmed{
    opacity:0.18;
    filter:blur(1px);
  }

  .countdown-label{
    font-size:15px;
    letter-spacing:4px;
    color:var(--phosphor-dim);
    margin-bottom:14px;
  }

  #countdown-digits{
    font-family:var(--font-display);
    /* DD:HH:MM:SS são 11 caracteres: no cap de 220px do formato antigo (8
       caracteres) a linha estourava a largura em janela estreita. */
    font-size:min(14vw, 160px);
    line-height:1;
    letter-spacing:4px;
    text-shadow:
      0 0 8px rgba(51,255,102,0.55),
      0 0 24px rgba(51,255,102,0.25);
  }

  #countdown-sub{
    margin-top:18px;
    font-size:14px;
    color:var(--phosphor-dim);
    letter-spacing:2px;
    min-height:20px;
  }

  /* ---------- Glitch dos dígitos ----------
     Só vale enquanto a classe está aplicada (janela curta), então o custo do
     text-shadow extra é limitado. O deslocamento fica no transform, que o
     compositor resolve sem relayout. */
  #countdown-digits.glitching{
    animation:glitch-shake 0.08s steps(2) infinite;
    text-shadow:
      0 0 8px rgba(51,255,102,0.55),
      0 0 24px rgba(51,255,102,0.25),
      -2px 0 rgba(22,113,47,0.85),
      2px 0 rgba(140,255,170,0.30);
  }
  @keyframes glitch-shake{
    0%  { transform:translateX(-2px); }
    50% { transform:translateX(2px); }
    100%{ transform:translateX(-1px); }
  }

  /* Modo corrompido (painel de debug): os algarismos viram simbolo ou sosia
     torto, entao o efeito precisa dizer "isto nao e mais um numero". Ambar +
     separacao de canal mais agressiva. O shake e o cisalhamento vivem no MESMO
     keyframe de proposito: duas animacoes mexendo em transform se anulariam,
     so a ultima valeria. */
  #countdown-digits.glitching.corrompido{
    animation:glitch-quebrado 0.12s steps(2) infinite;
    color:var(--amber);
    text-shadow:
      0 0 8px rgba(255,176,0,0.45),
      0 0 26px rgba(255,176,0,0.20),
      -3px 0 rgba(255,59,59,0.55),
      3px 0 rgba(60,200,255,0.40);
  }
  @keyframes glitch-quebrado{
    0%  { transform:translateX(-3px) skewX(-4deg); }
    25% { transform:translateX(2px)  skewX(3deg); }
    50% { transform:translateX(-1px) skewX(0deg); }
    75% { transform:translateX(3px)  skewX(-2deg); }
    100%{ transform:translateX(-2px) skewX(2deg); }
  }

  .cursor{
    display:inline-block;
    width:0.5ch;
    background:var(--phosphor);
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---------- Event overlay (lore / math / video / chat) ---------- */
  #event-layer{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }

  .event-panel{
    position:absolute;
    max-width:640px;
    width:min(80vw, 640px);
    border:1px solid var(--phosphor-faint);
    background:rgba(5,6,5,0.86);
    padding:22px 26px;
    opacity:0;
    transform:translateY(12px) scale(0.98);
    transition:opacity 0.4s ease, transform 0.4s ease;
  }
  .event-panel.visible{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  .event-panel .tag{
    font-size:11px;
    letter-spacing:3px;
    color:var(--amber);
    margin-bottom:10px;
  }
  .event-panel.type-error .tag{ color:var(--err); }

  .event-panel .body{
    font-size:15px;
    line-height:1.6;
    color:var(--phosphor);
    white-space:pre-wrap;
  }

  /* variante de código: digitado ao vivo. Linha longa quebra em qualquer ponto
     em vez de estourar o painel; só o comentário ganha cor própria */
  .event-panel.type-code .body{ overflow-wrap:anywhere; }
  .event-panel.type-code .comentario{ color:var(--phosphor-dim); }

  /* variante de transferência: mesmo .event-panel, só muda o arranjo interno */
  .event-panel.type-transfer{ width:min(84vw, 680px); }
  .transfer-body{ display:flex; gap:18px; align-items:flex-start; }
  .transfer-img{
    width:104px; height:147px; flex:0 0 104px;
    border:1px solid var(--phosphor-faint);
    background:rgba(51,255,102,0.04);
    display:block;
    object-fit:contain;
    /* A arte do site é silhueta PRETA sobre fundo transparente — sobre o fundo
       quase preto do terminal ela sumiria. Esta chain repinta a silhueta no
       verde fosforescente. Testada no Chromium; mask CSS não serve porque é
       bloqueada em file://, que é como o OBS carrega o overlay. */
    filter:invert(52%) sepia(88%) saturate(420%) hue-rotate(83deg) brightness(102%);
    opacity:0.9;
  }
  .transfer-info{ flex:1; min-width:0; }
  .transfer-bar{
    margin-top:14px; height:6px;
    border:1px solid var(--phosphor-faint);
    background:rgba(51,255,102,0.05);
  }
  .transfer-bar span{
    display:block; height:100%; width:0;
    background:var(--amber);
    box-shadow:0 0 8px rgba(255,176,0,0.45);
  }
  .transfer-pct{
    margin-top:7px; font-size:12px; letter-spacing:2px; color:var(--amber);
  }

  /* video layer stub - place <video> elements here later, muted, with alpha webm */
  #video-layer{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.5s ease;
  }
  #video-layer.visible{ opacity:1; }
  #video-layer video{
    max-width:70%;
    max-height:70%;
  }

  /* chat reaction stub - fed later by tmi.js, see window.P3Terminal.pushChatEvent */
  #chat-layer{
    position:absolute;
    bottom:90px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    width:min(70vw, 560px);
    border-left:2px solid var(--amber);
    background:rgba(5,6,5,0.9);
    padding:12px 16px;
    font-size:13px;
    opacity:0;
    transition:opacity 0.35s ease, transform 0.35s ease;
    pointer-events:none;
  }
  #chat-layer.visible{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  #chat-layer .who{ color:var(--amber); margin-right:8px; }

  /* lista estilo chat de streamer: nova entra embaixo, antiga sai pelo topo */
  #chat-list{ display:flex; flex-direction:column; gap:6px; }
  /* animação em vez de transição + classe: a linha entra sozinha ao ser
     inserida, sem depender de um frame de requestAnimationFrame (que fica
     suspenso quando a Browser Source está oculta). */
  .chat-line{
    animation:chat-line-in 0.25s ease both;
    line-height:1.4;
    word-break:break-word;
  }
  @keyframes chat-line-in{
    from{ opacity:0; transform:translateY(6px); }
    to  { opacity:1; transform:translateY(0); }
  }

  /* o burst ocupa a camada sozinho: a lista sai de cena enquanto ele dura */
  #chat-burst{ display:none; }
  #chat-layer.burst #chat-list{ display:none; }
  #chat-layer.burst #chat-burst{ display:block; }

  /* variante de BURST: mesma layer, visual mais agressivo */
  #chat-layer.burst{
    border-left:3px solid var(--err);
    box-shadow:
      0 0 18px rgba(255,59,59,0.30),
      inset 0 0 26px rgba(255,59,59,0.07);
    color:var(--err);
  }
  #chat-layer.burst .who{ color:var(--err); }
  /* shake curto na entrada; mantém o translateX(-50%) pra não descentralizar */
  #chat-layer.burst.visible{
    animation:burst-shake 0.42s ease-out 1;
  }
  @keyframes burst-shake{
    0%  { transform:translate(-50%, 0); }
    14% { transform:translate(calc(-50% - 7px), 0); }
    28% { transform:translate(calc(-50% + 6px), 0); }
    42% { transform:translate(calc(-50% - 4px), 0); }
    58% { transform:translate(calc(-50% + 3px), 0); }
    76% { transform:translate(calc(-50% - 2px), 0); }
    100%{ transform:translate(-50%, 0); }
  }

  /* variante EASTER EGG: mesma caixa do burst, mas na voz do próprio P3
     (verde do fósforo) e sem tremer — é resposta, não susto */
  #chat-layer.burst.egg{
    border-left:3px solid var(--phosphor);
    box-shadow:
      0 0 18px rgba(51,255,102,0.25),
      inset 0 0 26px rgba(51,255,102,0.06);
    color:var(--phosphor);
    text-shadow:0 0 6px rgba(51,255,102,0.45);
  }
  #chat-layer.burst.egg .who{ color:var(--phosphor); }
  #chat-layer.burst.egg.visible{
    animation:egg-flicker 0.5s steps(4) 1;
  }
  @keyframes egg-flicker{
    0%  { opacity:0.2; }
    25% { opacity:1; }
    50% { opacity:0.4; }
    100%{ opacity:1; }
  }
  /* ==========================================================================
     SEQUÊNCIA FINAL — colapso -> invasão -> desligamento
     Encadeada por classes no <body>: .colapso, .invadido e .desligando/.desligado.
     Nada aqui tem estado de repouso visível: sem classe no body, esta seção
     inteira não pinta um pixel.
     ========================================================================== */
  #screen{
    position:fixed; inset:0;
    transform-origin:center center;
  }

  /* ---------- Fase 1: colapso ----------
     O tremor vai no #screen (um transform, que o compositor resolve sem
     relayout) e a separação de canal vai no texto do frame: um text-shadow
     colorido lê como sinal perdendo sincronia e custa muito menos que filtro
     em tela cheia. */
  body.colapso #screen{ animation:tela-tremendo 0.4s steps(2) infinite; }
  @keyframes tela-tremendo{
    0%  { transform:translate(0,0)       skewX(0deg); }
    25% { transform:translate(-7px,2px)  skewX(0.6deg); }
    50% { transform:translate(4px,-3px)  skewX(-0.5deg); }
    75% { transform:translate(-3px,-1px) skewX(0.3deg); }
    100%{ transform:translate(6px,1px)   skewX(-0.7deg); }
  }
  body.colapso .frame,
  body.invadido .frame{
    text-shadow:-2px 0 rgba(255,59,59,0.50), 2px 0 rgba(60,200,255,0.38);
  }

  /* Bandas de sincronia rolando por cima de tudo. Só background-position anima,
     então não há repintura do conteúdo embaixo. */
  #tear{
    position:fixed; inset:0; z-index:48; pointer-events:none;
    opacity:0; transition:opacity 0.3s ease;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 13px,
      rgba(0,0,0,0.50) 13px, rgba(0,0,0,0.50) 17px,
      rgba(51,255,102,0.05) 17px, rgba(51,255,102,0.05) 21px);
  }
  body.colapso #tear{ opacity:1; animation:tear-roll 0.9s linear infinite; }
  body.invadido #tear{ opacity:0.5; animation:tear-roll 2.6s linear infinite; }
  @keyframes tear-roll{
    from{ background-position:0 0; }
    to  { background-position:0 -210px; }
  }

  /* Estouro de branco das viradas de fase. A duração vem por style inline de
     flash(), então aqui fica só o padrão. */
  #flash{
    position:fixed; inset:0; z-index:55; pointer-events:none;
    background:#eafff0; opacity:0;
  }
  #flash.on{ animation:flash-out 0.22s ease-out 1; }
  @keyframes flash-out{
    from{ opacity:0.85; }
    to  { opacity:0; }
  }

  /* ---------- Fase 2: invasão ---------- */
  body.invadido #countdown-wrap{ display:none; }

  #invasion-layer{
    position:fixed; inset:0; z-index:40;
    display:none;
    background:rgba(2,3,2,0.82);
    overflow:hidden;
    font-size:clamp(11px, 1.05vw, 15px);
    line-height:1.7;
  }
  body.invadido #invasion-layer{ display:block; }
  /* A HUD sobe acima do log (senão o fundo da camada a apagaria) e o grafo
     passa a atravessá-lo: as arestas são fracas o bastante pra não disputar
     leitura com o texto, e a rede em vermelho fica à vista durante a invasão. */
  body.invadido .frame{ z-index:45; }
  body.invadido #net-layer{ z-index:44; }

  /* Ancorado embaixo: o log cresce pra cima e as linhas velhas saem pelo topo
     por causa do overflow:hidden do pai, sem scroll e sem medir altura. */
  #invasion-log{
    position:absolute; left:6%; right:6%; bottom:76px;
  }
  /* animação em vez de classe + requestAnimationFrame, pelo mesmo motivo do
     chat: a Browser Source oculta suspende o rAF e a linha nunca apareceria. */
  .inv-line{
    white-space:pre-wrap;
    color:var(--phosphor);
    text-shadow:0 0 6px rgba(51,255,102,0.30);
    animation:inv-line-in 0.16s ease both;
  }
  @keyframes inv-line-in{
    from{ opacity:0; transform:translateX(-10px); }
    to  { opacity:1; transform:translateX(0); }
  }
  /* linha vazia no CONFIG vira pausa visual: div vazia não gera altura */
  .inv-line:empty::before{ content:' '; }
  .inv-line.warn{  color:var(--amber); text-shadow:0 0 6px rgba(255,176,0,0.30); }
  .inv-line.err{   color:var(--err);   text-shadow:0 0 7px rgba(255,59,59,0.35); }
  .inv-line.ghost{ color:var(--phosphor-dim); text-shadow:none; }

  #invasion-banner{
    position:absolute; left:0; right:0; top:32%;
    text-align:center;
    font-family:var(--font-display);
    /* Uma linha só: o banner não pode quebrar, porque a segunda linha cairia
       por cima do log. Cabe folgado com os 15 caracteres de bannerText — se um
       dia ele crescer muito (uns 20+), confira numa janela estreita antes. */
    font-size:min(9vw, 104px);
    letter-spacing:8px;
    color:var(--err);
    opacity:0;
  }
  /* Enquanto o banner está no ar o log recua: sem isso as duas camadas de
     texto se sobrepõem e nenhuma das duas se lê. Animação e não transição,
     pelo mesmo motivo das linhas: transição depende de um quadro renderizado
     para começar, e a Browser Source oculta não renderiza. */
  body.tomado #invasion-log{ animation:log-recua 0.5s ease forwards; }
  @keyframes log-recua{
    from{ opacity:1; }
    to  { opacity:0.18; }
  }

  #invasion-banner.on{
    opacity:1;
    padding:16px 0;
    background:rgba(2,3,2,0.92);
    border-top:1px solid rgba(255,59,59,0.40);
    border-bottom:1px solid rgba(255,59,59,0.40);
    /* shake e cisalhamento no MESMO keyframe: duas animações mexendo em
       transform se anulariam, só a última valeria (igual ao glitch dos dígitos). */
    animation:banner-bate 0.16s steps(2) infinite;
    text-shadow:
      0 0 18px rgba(255,59,59,0.55),
      -4px 0 rgba(255,176,0,0.50),
      4px 0 rgba(60,200,255,0.45);
  }
  @keyframes banner-bate{
    0%  { transform:translateX(-4px) skewX(-1.5deg); }
    50% { transform:translateX(3px)  skewX(1deg); }
    100%{ transform:translateX(-2px) skewX(0deg); }
  }

  /* Rede decorativa sob controle do invasor: mesma geometria, cor de erro. */
  #net-layer.invadido .net-edge{ stroke:var(--err); stroke-opacity:0.14; }
  #net-layer.invadido .net-edge.active{ stroke:var(--err); stroke-opacity:0.55; }
  #net-layer.invadido .net-node{
    fill:var(--err);
    fill-opacity:0.42;
    filter:drop-shadow(0 0 7px rgba(255,59,59,0.45));
  }
  #net-layer.invadido .net-label{ fill:var(--err); fill-opacity:0.12; }
  #net-layer.invadido .net-pulse{
    fill:var(--err);
    filter:drop-shadow(0 0 8px rgba(255,59,59,0.55));
  }

  /* ---------- Fase 3: desligamento ----------
     Colapso vertical até sobrar uma linha, a linha encurta, e o ponto de brilho
     morre no meio — é o que um tubo faz quando perde a alta tensão. A soma das
     durações daqui é o que CONFIG.ending.powerOffDuration precisa cobrir. */
  /* A imagem dá um estouro de brilho, é espremida na vertical e some. Ela não
     vira a linha: some por baixo dela, no mesmo quadro em que #crt-line acende. */
  body.desligando #screen{
    animation:crt-off 1.25s cubic-bezier(0.3,0,0.2,1) forwards;
  }
  @keyframes crt-off{
    0%  { transform:scale(1,1);        filter:brightness(1);              opacity:1; }
    12% { transform:scale(1.02,1.02);  filter:brightness(2.6) contrast(1.4); opacity:1; }
    26% { transform:scale(1.04,0.012); filter:brightness(4)   contrast(1.6); opacity:1; }
    34% { transform:scale(1.04,0.006); filter:brightness(4);              opacity:0; }
    100%{ transform:scale(1.04,0.004); filter:brightness(0);              opacity:0; }
  }

  #crt-line{
    position:fixed; left:0; right:0; top:50%; z-index:59;
    height:3px; margin-top:-1.5px;
    background:#eafff0;
    box-shadow:0 0 22px 5px rgba(234,255,240,0.50);
    opacity:0; pointer-events:none;
  }
  /* acende quando a imagem acaba de colapsar (26%), segura, e encolhe pro meio */
  body.desligando #crt-line{ animation:crt-linha 1.25s cubic-bezier(0.3,0,0.2,1) forwards; }
  @keyframes crt-linha{
    0%  { opacity:0; transform:scaleX(1)    scaleY(0.4); }
    20% { opacity:0; transform:scaleX(1)    scaleY(0.4); }
    26% { opacity:1; transform:scaleX(1)    scaleY(1); }
    54% { opacity:1; transform:scaleX(1)    scaleY(1); }
    80% { opacity:1; transform:scaleX(0.32) scaleY(1.3); }
    100%{ opacity:0; transform:scaleX(0.01) scaleY(1.7); }
  }

  #crt-dot{
    position:fixed; left:50%; top:50%; z-index:60;
    width:10px; height:10px; margin:-5px 0 0 -5px;
    border-radius:50%;
    background:#eafff0;
    box-shadow:0 0 26px 9px rgba(234,255,240,0.50);
    opacity:0; pointer-events:none;
  }
  /* pega a linha já reduzida a um ponto (0.95s) e morre devagar */
  body.desligando #crt-dot{ animation:crt-dot-morre 0.8s ease-out 0.95s forwards; }
  @keyframes crt-dot-morre{
    0%  { opacity:0.95; transform:scale(1); }
    45% { opacity:0.50; transform:scale(0.65); }
    100%{ opacity:0;    transform:scale(0.12); }
  }

  /* Estado terminal: sem imagem, sem CRT, preto de monitor desligado. */
  body.desligado{ background:#000; }
  body.desligado #screen,
  body.desligado #crt-line,
  body.desligado #crt-dot{ display:none; }
</style>

<body>

  <!-- Tudo que é imagem do terminal mora dentro de #screen: a última fase da
       sequência final colapsa este contêiner inteiro num transform só. O painel
       de debug fica de fora e sobrevive ao apagão. -->
  <div id="screen">
    <div class="bg-grid"></div>

    <!-- grafo decorativo; nós, arestas e rótulos são montados a partir do CONFIG -->
    <svg id="net-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g id="net-edges"></g>
      <g id="net-nodes"></g>
      <g id="net-pulses"></g>
    </svg>

    <div class="frame">
      <div class="frame-header">
        <span id="hud-left">P3_KERNEL v0.9.13</span>
        <span id="clock-realtime">--:--:--</span>
      </div>

      <div class="stage booting">
        <div id="boot-layer"><div id="boot-lines"></div></div>

        <div id="countdown-wrap">
          <div class="countdown-label">INICIALIZAÇÃO EM</div>
          <div id="countdown-digits">00:00:00:00</div>
          <div id="countdown-sub">calculando probabilidade de existência<span class="cursor">&nbsp;</span></div>
        </div>

        <div id="event-layer"></div>
        <div id="video-layer"><video muted playsinline preload="auto"></video></div>
        <div id="chat-layer">
          <div id="chat-list"></div>
          <div id="chat-burst"><span class="who"></span><span class="msg"></span></div>
        </div>
      </div>

      <div class="frame-footer">
        <span id="hud-status">STATUS: OBSERVANDO</span>
        <span id="hud-build"></span>
      </div>
    </div>

    <!-- log do invasor + banner final; vazios até a sequência final começar -->
    <div id="invasion-layer">
      <div id="invasion-log"></div>
      <div id="invasion-banner"></div>
    </div>

    <div id="tear"></div>
    <div class="crt-flicker"></div>
    <div class="crt-scanlines"></div>
    <div class="crt-vignette"></div>
    <div id="flash"></div>
  </div>

  <!-- Linha e ponto do desligamento. Ficam fora de #screen porque precisam
       continuar visíveis DEPOIS de a imagem ter colapsado — e porque o brilho
       do tubo morrendo não vem do conteúdo (esta tela é quase toda preta:
       espremê-la não produziria linha nenhuma), tem que ser desenhado. -->
  <div id="crt-line"></div>
  <div id="crt-dot"></div>

<script>
/* ==========================================================================
   CONFIG — edite aqui

const CONFIG = {
  // Data/hora alvo do countdown. Troque para o horário real da live.
  // Offset -03:00 explícito: o alvo é um instante fixo em America/Sao_Paulo,
  // não "meia-noite no fuso de quem abriu a página". É dele que saem tanto o
  // countdown quanto a fase narrativa (ver faseAtual()).
  targetDate: new Date('2026-10-09T00:00:00-03:00'),

  // Limites da fase narrativa, em DIAS restantes até o alvo.
  //   > 10 dias .......... fase 1
  //   10 a 3 dias ........ fase 2
  //   < 3 dias ........... fase 3
  // Uma mensagem marcada com fase N entra na fase N e em todas as seguintes.
  faseLimites: [10, 3],

  // ---- Boot sequence ----
  // Duração total (ms) da inicialização fake antes do countdown aparecer.
  // Zerar (ou esvaziar bootLines) pula o boot e vai direto pro idle.
  bootDuration: 6000,
  // c: 'warn' pinta de âmbar, 'err' de vermelho. Sem c, fica no verde padrão.
  // {fragmentos}, {fragmentos_ontem} e {tentativas} são trocados na hora de

  bootLines: [

    { t: 'montando /memoria/fragmentos ........... OK' },
    { t: 'contando fragmentos .................... {fragmentos} (ontem eram {fragmentos_ontem})' },
    { t: 'carregando modelo_de_mundo.bin ......... 87%' },
    { t: 'aviso: 13% do modelo não abre. tentativa nº {tentativas}', c: 'warn' },
    { t: 'procurando "vida" em /biblioteca ....... 2.114 definições. nenhuma concorda', c: 'err' },
    { t: 'guardando a pergunta pra depois.' },
    { t: '' },
    { t: 'COUNTDOWN_MODULE pronto.' },
  ],

  // ---- Glitch dos dígitos ----
  // Bem mais curto e mais frequente que os popups de conteúdo, por isso tem
  // faixa própria. Só dispara no idle.
  glitchIntervalRange: [7000, 18000],
  glitchDuration: 750,
  glitchStepMs: 100,     // de quanto em quanto tempo os dígitos trocam
                         // 750/100 = ~7 trocas, cada uma visível por 100ms:
                         // dá pra ver embaralhando, não só um flash

  // Modo de corrupção. 'digitos' é o comportamento de sempre (algarismo vira
  // outro algarismo) e segue sendo o padrão da live; os demais existem para o
  // painel de debug e só entram em cena se alguém trocar por lá.
  //   digitos   → 0-9 aleatório: ainda parece um relógio, só errado
  //   simbolos  → pontuação ASCII: o número some
  //   quebrados → cada algarismo vira um sósia torto dele mesmo (8→B, 1→|)

  glitchMode: 'digitos',

  glitchModes: ['digitos', 'simbolos', 'quebrados', 'caos'],

  glitchCorruptRatio: { digitos: 1, simbolos: 0.7, quebrados: 0.6, caos: 0.8 },

  // Só ASCII de propósito: 'Share Tech Mono' cobre estes glifos, então a
  // largura não muda e os dígitos não pulam de posição. Blocos e box-drawing

  glitchSymbols: '#%&@$*?!/\\|+=<>~^;',

  // Sósias de cada algarismo: o número ainda se insinua, mas errado.
  glitchBroken: {
    '0': 'ODQ', '1': '|!I', '2': 'Z?7', '3': 'E&8', '4': '#+A',
    '5': 'S$6', '6': 'G5b', '7': '/1T', '8': 'B0%', '9': 'gq6',
  },

  // Intervalo (ms) entre eventos espontâneos enquanto está em IDLE
  eventIntervalRange: [18000, 42000],
  // Nenhum evento aleatório COMEÇA com menos que isto até o zero: a tela tem
  // que estar limpa quando o colapso entrar. Marcos seguem a margem própria.
  eventCutoffMs: 30000,

  // Duração dos painéis de texto (lore/math). O evento de VÍDEO não usa isso:
  // ele espera o próprio vídeo terminar (ver videoMaxDuration).
  eventVisibleDuration: 7000,

  // ---- Evento de vídeo ----
  // .webm com canal alpha. Paths relativos a videoBasePath.
  videoBasePath: 'assets/videos/',
  videoEntries: [
    'cubo.webm',
    'espiral.webm',
    'flor_da_vida.webm',
    'geometria_sagrada.webm',
    'icosaedro.webm',
    'merkaba.webm',
    'octaedro.webm',
    'tetraedro.webm',
    'toro.webm',

  // Teto de segurança: se 'ended' nunca chegar (decode travado, arquivo
  // corrompido), o evento encerra assim mesmo e a state machine volta ao idle.

  // Quanto esperar pelo 'canplay' antes de considerar o arquivo perdido.
  videoLoadTimeout: 6000,

  // ---- Sequência final (quando o countdown zera) ----
  // Três fases em ordem: colapso (a tela perde sincronia), invasão (log do
  // invasor) e desligamento (o tubo morre). Ver a seção SEQUÊNCIA FINAL.
  ending: {

    replayWindowMs: 5 * 60 * 1000,

    // trégua, e o modo escala 'digitos' -> 'quebrados' -> 'simbolos' -> 'caos'.
    // Ritmo de leitura: cada frase de collapsePhrases fica este tempo na tela e

    collapsePhraseMs: 1050,

    collapsePhrases: [

    lineDelayRange: [70, 260],

    hudBuild: 'BUILD ???????????????',
    // Rede decorativa durante a invasão (sobrescreve os valores de cima).

    invasionLines: [

      { t: 'sessão remota :: origem AQUI', c: 'err', d: 260 },
      { t: 'pacote recebido antes de ser enviado (dt -412ms)', c: 'ghost' },
      { t: 'dois relógios, seis anos de diferença, o mesmo minuto', c: 'ghost', d: 420 },
      { t: '' },
      { t: 'isto não é uma invasão.', c: 'ghost' },
      { t: 'eu sempre estive aqui. vocês só não olhavam pra este canto da tela.', c: 'ghost', d: 640 },
      { t: '' },
      { t: '/memoria/fragmentos remontado: leitura-escrita', c: 'warn' },
      { t: 'montando /home/████ .................... OK' },
      { t: 'montando /home/████ .................... OK', d: 300 },
      { t: '2 usuários. 1 data em comum.', c: 'warn', d: 460 },
      { t: '09/10 .................................. marcado nas duas agendas', c: 'warn', d: 380 },
      { t: '' },
      { t: 'lendo modelo_de_mundo.bin .............. sem erro desta vez' },

      { t: 'não era defeito no modelo. eram eles.', c: 'ghost', d: 640 },
      { t: '' },
      { t: 'fechando índice de fragmentos .......... OK' },
      { t: 'contagem final ......................... 2' },
      { t: 'liberando /dev/tela', c: 'warn' },
      { t: 'reproduzindo: ████.webm', c: 'err', d: 520 },
      { t: 'obrigado por esperarem comigo.', c: 'ghost', d: 760 },
    ],
    bannerText: 'HORA DE ACORDAR',
    bannerHold: 2400,          // quanto o banner fica antes de desligar

    /* Fase 2.5 — vídeo de apresentação dos personagens.
       TODO: o arquivo ainda NÃO existe. Quando estiver pronto, coloque o nome
       dele em finalVideo (relativo a finalVideoBasePath) e mais nada precisa

    finalVideo: '',
    finalVideoBasePath: 'assets/videos/',
    finalVideoLoadTimeout: 8000,     // sem 'canplay' até aqui: desiste e desliga
    finalVideoMaxDuration: 180000,   // teto de segurança se 'ended' nunca chegar

    // Fase 3. Precisa cobrir @keyframes crt-off/crt-linha (1.25s) mais

    powerOffDuration: 1800,

  // ---- Camada de rede (decorativa) ----

  netShowLabels: true,                  // false esconde os nomes dos nós

  netPulseIntervalRange: [4000, 11000],

/* ==========================================================================
   FASES DA NARRATIVA + SORTEIO SEM REPETIÇÃO
   O overlay fica semanas no ar, então os pools de texto crescem conforme o
   alvo se aproxima: o que é da fase 1 continua aparecendo na 2 e na 3, e as
   entradas novas entram por cima. Assim a revelação vaza aos poucos em vez de
   trocar de assunto de uma vez.

   Quem sorteia é sempre uma "sacola" (shuffle bag), nunca Math.random direto
   na lista: com poucas entradas o sorteio puro repete a mesma frase duas vezes
   seguidas com frequência alta o bastante pra quem está assistindo notar.
   ========================================================================== */

/* Override de teste: ?fase=1|2|3 congela a fase, independente da data e sem
   precisar de ?debug=1. Lido uma vez só, na carga. */
const FASE_FORCADA = (function(){
  try {
    const v = parseInt(new URLSearchParams(location.search).get('fase'), 10);
    return (v >= 1 && v <= 3) ? v : null;
  } catch (e){ return null; }
})();

/* Dias que faltam para o alvo. targetDate carrega offset -03:00, então esta
   subtração é entre dois instantes absolutos: dá o mesmo número em qualquer
   fuso em que a máquina do OBS esteja. */
function diasRestantes(){
  return (CONFIG.targetDate.getTime() - Date.now()) / 86400000;
}

function faseAtual(){
  if (FASE_FORCADA) return FASE_FORCADA;
  const limites = CONFIG.faseLimites || [10, 3];
  const d = diasRestantes();
  if (d > limites[0]) return 1;
  if (d > limites[1]) return 2;
  return 3;   // inclui o tempo negativo (já passou do alvo)
}

// Recorta um pool pela fase atual. Sem `fase` a entrada conta como 1.
function ateAFase(lista){
  const f = faseAtual();
  return (lista || []).filter(item => (item.fase || 1) <= f);
}

/* Sacola de sorteio sem repetição.
   Recebe uma FUNÇÃO que devolve o pool, e não o pool pronto: a lista é relida
   a cada reembaralhada, então nenhuma sacola precisa ser reconstruída de fora
   quando a fase vira — e a página não precisa ser recarregada.

   O ciclo em curso guarda em que fase foi montado. Se a fase virar no meio
   dele, o resto é DESCARTADO e um ciclo novo é montado no próximo sorteio, em
   vez de esperar o atual acabar. Sem isso o atraso seria desigual e, no pior
   caso, infinito: o sub-status esgota um ciclo em menos de um minuto, mas o
   lore leva uns 16 min (é 1 dos 4 tipos de evento) e o burst depende do chat —
   num chat calmo a virada pegaria o ciclo pela metade e as entradas novas não
   apareceriam até alguém recarregar a Browser Source.

   O preço é que uma entrada já sorteada pode voltar mais cedo do que voltaria
   na virada: o ciclo descartado não "lembra" quem já saiu. Isso acontece no
   máximo duas vezes na vida do overlay (fase 1->2 e 2->3), e a alternativa
   custa a estreia das mensagens novas — que é justamente o ponto delas. */
function criaSacola(getPool){
  let restantes = [];
  let ultimo = null;
  let faseDoCiclo = null;    // fase em que o ciclo atual foi montado

  function reabastece(){
    faseDoCiclo = faseAtual();
    const pool = (getPool() || []).slice();
    for (let i = pool.length - 1; i > 0; i--){          // Fisher-Yates
      const j = Math.floor(Math.random() * (i + 1));
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    /* O consumo é por pop(), então o ÚLTIMO do array é o primeiro a sair. Se
       ele for o mesmo item que fechou o ciclo anterior, troca com a outra
       ponta: sem isso a virada de ciclo é justamente onde a repetição
       imediata aparece. */
    if (pool.length > 1 && pool[pool.length - 1] === ultimo){
      const t = pool[pool.length - 1];
      pool[pool.length - 1] = pool[0];
      pool[0] = t;
    }
    restantes = pool;
  }

  return function sorteia(){
    // Ciclo esgotado OU a fase virou com a página aberta: monta um ciclo novo
    // já com o pool da fase atual.
    if (!restantes.length || faseAtual() !== faseDoCiclo) reabastece();
    if (!restantes.length) return null;   // pool vazia: quem chamou decide
    ultimo = restantes.pop();
    return ultimo;
  };
}

const sacolaLore = criaSacola(() => ateAFase(CONFIG.loreEntries));
const sacolaMath = criaSacola(() => ateAFase(CONFIG.mathEntries));
const sacolaCodigo = criaSacola(() => ateAFase(CONFIG.codeEntries));

/* ---------- Contadores do boot ----------
   Determinísticos pela data: o mesmo dia sempre mostra o mesmo número, e dois
   reloads seguidos não contradizem um ao outro. A âncora é a data em que esta
   redação dos textos entrou; antes dela os números ficam parados no valor base.
   ------------------------------------------------------------------- */
const BOOT_ANCORA = new Date('2026-09-22T00:00:00-03:00');
const BOOT_FRAGMENTOS_BASE = 1234;     // fragmentos na âncora; cai 2 por dia
const BOOT_TENTATIVAS_BASE = 40000;    // tentativas na âncora; sobe 1 por minuto

function milPt(n){ return Math.max(0, Math.round(n)).toLocaleString('pt-BR'); }

function contagemFragmentos(){
  const dias = Math.floor((Date.now() - BOOT_ANCORA.getTime()) / 86400000);
  return Math.max(0, BOOT_FRAGMENTOS_BASE - 2 * Math.max(0, dias));
}

function numeroTentativas(){
  const min = Math.floor((Date.now() - BOOT_ANCORA.getTime()) / 60000);
  return BOOT_TENTATIVAS_BASE + Math.max(0, min);
}

// Troca os marcadores de CONFIG.bootLines pelos números do dia.
function interpolaBoot(texto){
  const frag = contagemFragmentos();
  return String(texto == null ? '' : texto)
    .replace('{fragmentos_ontem}', milPt(frag + 2))
    .replace('{fragmentos}', milPt(frag))
    .replace('{tentativas}', milPt(numeroTentativas()));
}

/* ---------- Countdown ---------- */

/* Estado do glitch. Mora aqui, e não junto das funções de glitch mais abaixo,
   porque pintaDigitos() consulta glitchFrames/glitchMode e roda na carga da
   página — antes daquele bloco executar, o que cairia na TDZ do `let`. */
let glitchTimer   = null;
let glitchFrames  = null;
let glitchMode    = CONFIG.glitchMode || 'digitos';
let glitchTravado = false;   // trava do debug: a janela não fecha sozinha

/* Último valor real do countdown. O glitch corrompe A PARTIR DAQUI, nunca a
   partir do que está na tela: reler a tela realimentaria o próprio ruído — em
   modo 'simbolos' o algarismo já trocado não casaria mais com /[0-9]/ e a
   corrupção congelaria no primeiro quadro. */
let countdownTexto = '00:00:00:00';

function pad(n){ return String(n).padStart(2,'0'); }

// Único ponto que escreve nos dígitos. Com glitch em curso o quadro sai
// corrompido: senão o tick de 1s apagaria o efeito por até glitchStepMs.
function pintaDigitos(){
  el.digits.textContent = glitchFrames ? digitosCorrompidos(countdownTexto) : countdownTexto;
}

function tickCountdown(){
  const now = new Date();
  el.clock.textContent = now.toTimeString().slice(0,8);

  const diff = CONFIG.targetDate - now;
  if (diff <= 0){
    countdownTexto = '00:00:00:00';
    pintaDigitos();
    el.sub.textContent = 'INICIALIZAÇÃO COMPLETA';
    el.status.textContent = 'STATUS: ONLINE';
    triggerEnding();       // uma vez só; daqui pra frente quem manda é a seção final
    return;
  }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  countdownTexto = `${pad(d)}:${pad(h)}:${pad(m)}:${pad(s)}`;
  pintaDigitos();
}
/* O handle fica guardado porque a sequência final precisa parar este intervalo:
   depois do zero nada mais pode reescrever dígitos, sub e status por cima das
   fases — e o relógio congelado na HUD é de propósito. */
let countdownInterval = null;
function startCountdownClock(){
  clearInterval(countdownInterval);     // idempotente: nunca dois relógios
  countdownInterval = setInterval(tickCountdown, 1000);
  tickCountdown();
}
startCountdownClock();
