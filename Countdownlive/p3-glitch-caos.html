<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>P3_KERNEL // GLITCH_CAOS</title>

<!--
  PÁGINA DE CAPTURA — os dígitos em glitch travado e o grafo de rede atrás,
  em destaque. Nada mais.

  Existe porque na página principal a trava não sobrevive a um evento: qualquer
  lore/math/vídeo/transferência chama endGlitch() de propósito (o glitch não
  pode disputar a tela com o painel que entra). Aqui não há evento, chat nem
  boot — nada interrompe. O glitch começa na carga e só para se você mandar.

  A rede é a mesma da live (mesmos nós, mesmas arestas, mesmo drift e mesmos
  pulsos), mas com os valores de DESTAQUE: lá ela é fundo quase invisível
  (linhas a 10% e rótulos a 9% de opacidade, pulsos raros); aqui ela é
  protagonista junto com os dígitos.

  Parâmetros de URL (todos opcionais):
    ?modo=caos|simbolos|quebrados|digitos   padrão: caos
    ?taxa=0.8      fração dos algarismos corrompida por quadro (0–1)
    ?passo=100     ms entre quadros; menor = mais frenético
    ?alvo=2026-12-31T20:00:00   sobrescreve o alvo (padrão: 2026-10-09T00:00:00-03:00)
    ?rede=destaque|sutil|off    padrão: destaque
    ?limpo=1       esconde rótulo, legenda e HUD: só dígitos e rede

  Teclas (úteis durante a gravação):
    ESPAÇO  congela/retoma o glitch (congelado mostra o valor real)
    M       cicla o modo de corrupção
    R       cicla a intensidade da rede
    H       esconde/mostra rótulo, legenda e HUD
-->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #050605;
    --grid: rgba(51,255,102,0.035);
    --phosphor: #33ff66;
    --phosphor-dim: #16712f;
    --amber: #ffb000;
    --font-ui: 'JetBrains Mono', monospace;
    --font-display: 'Share Tech Mono', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    width:100%; height:100%;
    background:var(--bg);
    color:var(--phosphor);
    font-family:var(--font-ui);
    overflow:hidden;
  }

  /* ---------- CRT / fundo (idênticos aos da página principal) ---------- */
  .crt-scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px
    );
    mix-blend-mode:multiply;
  }
  .crt-vignette{
    position:fixed; inset:0; pointer-events:none; z-index:51;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }
  .crt-flicker{
    position:fixed; inset:0; pointer-events:none; z-index:49;
    background:var(--phosphor);
    opacity:0;
    animation:flicker 6.3s infinite;
  }
  @keyframes flicker{
    0%,96%,100%{ opacity:0; }
    97%{ opacity:0.02; }
    98%{ opacity:0; }
    99%{ opacity:0.015; }
  }
  .bg-grid{
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:40px 40px;
  }

  /* ---------- Camada de rede ----------
     Os números abaixo são os de DESTAQUE. Entre parênteses, o valor da página
     principal, onde ela é fundo: a diferença toda está aqui, não no JS. */
  #net-layer{
    position:fixed; inset:0; z-index:1;
    pointer-events:none;
  }
  .net-edge{
    stroke:var(--phosphor);
    stroke-width:1.6;                 /* live: 1 */
    stroke-opacity:0.38;              /* live: 0.10 */
    transition:stroke 0.45s ease, stroke-opacity 0.45s ease;
  }
  .net-edge.active{
    stroke:var(--amber);
    stroke-opacity:0.95;              /* live: 0.28 */
    filter:drop-shadow(0 0 6px rgba(255,176,0,0.55));
  }
  .net-node{
    fill:var(--phosphor);
    fill-opacity:0.95;                /* live: 0.30 */
    filter:drop-shadow(0 0 10px rgba(51,255,102,0.75));
  }
  .net-node.hub{
    fill-opacity:1;                   /* live: 0.46 */
    filter:drop-shadow(0 0 16px rgba(51,255,102,0.85));
  }
  .net-label{
    fill:var(--phosphor);
    fill-opacity:0.72;                /* live: 0.09 */
    font-family:var(--font-ui);
    font-size:19px;                   /* live: 15 */
    letter-spacing:2px;
  }
  .net-pulse{
    fill:var(--amber);
    filter:drop-shadow(0 0 12px rgba(255,176,0,0.85));
    opacity:0;
    transition:opacity 0.3s ease;
  }
  .net-pulse.moving{ opacity:1; }     /* live: 0.85 */

  /* Rede sutil: os mesmos valores da live, para comparar lado a lado sem
     recarregar (tecla R). */
  body.rede-sutil .net-edge{ stroke-width:1; stroke-opacity:0.10; }
  body.rede-sutil .net-edge.active{ stroke-opacity:0.28; filter:none; }
  body.rede-sutil .net-node{ fill-opacity:0.30; filter:drop-shadow(0 0 6px rgba(51,255,102,0.40)); }
  body.rede-sutil .net-node.hub{ fill-opacity:0.46; filter:drop-shadow(0 0 9px rgba(51,255,102,0.45)); }
  body.rede-sutil .net-label{ fill-opacity:0.09; font-size:15px; }
  body.rede-sutil .net-pulse{ filter:drop-shadow(0 0 8px rgba(255,176,0,0.50)); }
  body.rede-sutil .net-pulse.moving{ opacity:0.85; }

  body.rede-off #net-layer{ display:none; }

  /* ---------- Palco ---------- */
  .stage{
    position:relative; z-index:2;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }

  #countdown-wrap{ text-align:center; }

  .countdown-label{
    font-size:15px;
    letter-spacing:4px;
    color:var(--phosphor-dim);
    margin-bottom:14px;
  }

  #countdown-digits{
    font-family:var(--font-display);
    /* DD:HH:MM:SS são 11 caracteres: no cap de 220px do formato antigo (8
       caracteres) a linha estourava a largura em janela estreita. */
    font-size:min(14vw, 160px);
    line-height:1;
    letter-spacing:4px;
    text-shadow:
      0 0 8px rgba(51,255,102,0.55),
      0 0 24px rgba(51,255,102,0.25);
  }

  #countdown-sub{
    margin-top:18px;
    font-size:14px;
    color:var(--phosphor-dim);
    letter-spacing:2px;
    min-height:20px;
  }

  /* ?limpo=1 ou tecla H: só os dígitos e a rede, para enquadramento apertado. */
  body.limpo .countdown-label,
  body.limpo #countdown-sub,
  body.limpo #hud{ display:none; }

  .cursor{
    display:inline-block;
    width:0.5ch;
    background:var(--phosphor);
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---------- Glitch ---------- */
  #countdown-digits.glitching{
    animation:glitch-shake 0.08s steps(2) infinite;
    text-shadow:
      0 0 8px rgba(51,255,102,0.55),
      0 0 24px rgba(51,255,102,0.25),
      -2px 0 rgba(22,113,47,0.85),
      2px 0 rgba(140,255,170,0.30);
  }
  @keyframes glitch-shake{
    0%  { transform:translateX(-2px); }
    50% { transform:translateX(2px); }
    100%{ transform:translateX(-1px); }
  }

  /* Modo corrompido: o algarismo virou símbolo ou sósia torto, então o efeito
     precisa dizer "isto não é mais um número". O shake e o cisalhamento vivem
     no MESMO keyframe de propósito: duas animações mexendo em transform se
     anulariam, só a última valeria. */
  #countdown-digits.glitching.corrompido{
    animation:glitch-quebrado 0.12s steps(2) infinite;
    color:var(--amber);
    text-shadow:
      0 0 8px rgba(255,176,0,0.45),
      0 0 26px rgba(255,176,0,0.20),
      -3px 0 rgba(255,59,59,0.55),
      3px 0 rgba(60,200,255,0.40);
  }
  @keyframes glitch-quebrado{
    0%  { transform:translateX(-3px) skewX(-4deg); }
    25% { transform:translateX(2px)  skewX(3deg); }
    50% { transform:translateX(-1px) skewX(0deg); }
    75% { transform:translateX(3px)  skewX(-2deg); }
    100%{ transform:translateX(-2px) skewX(2deg); }
  }

  /* ---------- HUD de captura ----------
     Canto inferior, bem apagado: serve para conferir o estado enquanto grava.
     Some no modo limpo, então dá para deixá-lo fora do quadro final. */
  #hud{
    position:fixed; left:14px; bottom:12px; z-index:52;
    font-size:11px; letter-spacing:2px;
    color:var(--phosphor-dim); opacity:0.55;
    pointer-events:none;
  }
</style>
</head>
<body>

  <div class="bg-grid"></div>

  <!-- grafo decorativo; nós, arestas e rótulos são montados a partir do CONFIG -->
  <svg id="net-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g id="net-edges"></g>
    <g id="net-nodes"></g>
    <g id="net-pulses"></g>
  </svg>

  <div class="stage">
    <div id="countdown-wrap">
      <div class="countdown-label">INICIALIZAÇÃO EM</div>
      <div id="countdown-digits">00:00:00:00</div>
      <div id="countdown-sub">buscando padrão em ruído<span class="cursor">&nbsp;</span></div>
    </div>
  </div>

  <div class="crt-flicker"></div>
  <div class="crt-scanlines"></div>
  <div class="crt-vignette"></div>

  <div id="hud">GLITCH</div>

<script>
/* ==========================================================================
   Mesma lógica de corrupção e a mesma camada de rede da página principal, sem
   a máquina de estados. Lá o glitch é uma janela curta que qualquer evento
   pode encerrar; aqui é permanente por construção — não existe evento para
   encerrá-lo. A rede lá também não passa pela state machine, então foi
   copiada como está; só os números de ritmo mudaram (ver CONFIG).
   ========================================================================== */

var params;
try { params = new URLSearchParams(location.search); } catch (e){ params = null; }
function param(nome, padrao){
  var v = params && params.get(nome);
  return (v === null || v === undefined || v === '') ? padrao : v;
}
function pickRandom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

/* ==========================================================================
   GLITCH DOS DÍGITOS
   ========================================================================== */

var MODOS = ['caos', 'simbolos', 'quebrados', 'digitos'];

// Só ASCII de propósito: 'Share Tech Mono' cobre estes glifos, então a largura
// não muda e os dígitos não pulam de posição. Blocos e box-drawing (▓ ░ █)
// cairiam no fallback do sistema e quebrariam o alinhamento.
var SIMBOLOS = '#%&@$*?!/\\|+=<>~^;';

// Sósias de cada algarismo: o número ainda se insinua, mas errado.
var QUEBRADOS = {
  '0': 'ODQ', '1': '|!I', '2': 'Z?7', '3': 'E&8', '4': '#+A',
  '5': 'S$6', '6': 'G5b', '7': '/1T', '8': 'B0%', '9': 'gq6'
};

// Fração dos algarismos corrompida por quadro. Abaixo de 1 sobram números
// legíveis no meio do ruído, o que lê como "sinal falhando" em vez de campo
// aleatório — é o que faz o efeito parecer relógio quebrado, não estática.
var TAXA_PADRAO = { caos: 0.8, simbolos: 0.7, quebrados: 0.6, digitos: 1 };

var modo = param('modo', 'caos');
if (MODOS.indexOf(modo) < 0) modo = 'caos';

var taxa = parseFloat(param('taxa', ''));
if (!(taxa >= 0 && taxa <= 1)) taxa = null;      // null = usa a taxa do modo

var passo = parseInt(param('passo', '100'), 10);
if (!(passo > 0)) passo = 100;

/* Alvo do countdown, o mesmo de p3-terminal-countdown.html. O valor real fica
   por baixo do ruído e, com taxa < 1, aparece de relance — um alvo já vencido
   deixaria zeros piscando no meio dos símbolos, então os dois arquivos precisam
   andar juntos. ?alvo sobrescreve, para testar com números mais curtos. */
var ALVO_PADRAO = '2026-10-09T00:00:00-03:00';
var alvo = new Date(param('alvo', ALVO_PADRAO));
if (isNaN(alvo.getTime())) alvo = new Date(ALVO_PADRAO);

var digits = document.getElementById('countdown-digits');
var hud    = document.getElementById('hud');
if (param('limpo', '') === '1') document.body.classList.add('limpo');

/* Último valor real do countdown. A corrupção sai DAQUI, nunca do que está na
   tela: reler a tela realimentaria o próprio ruído — um algarismo já virado em
   símbolo não casaria mais com /[0-9]/ e tudo congelaria no primeiro quadro. */
var textoReal = '00:00:00:00';
var congelado = false;

function pad(n){ return String(n).padStart(2, '0'); }

function tick(){
  var diff = alvo - new Date();
  if (diff <= 0){ textoReal = '00:00:00:00'; return; }
  var d = Math.floor(diff / 86400000);
  var h = Math.floor((diff % 86400000) / 3600000);
  var m = Math.floor((diff % 3600000) / 60000);
  var s = Math.floor((diff % 60000) / 1000);
  textoReal = pad(d) + ':' + pad(h) + ':' + pad(m) + ':' + pad(s);
}

function sorteiaChar(str){ return str.charAt(Math.floor(Math.random() * str.length)); }

// Um caractere corrompido para um algarismo, conforme o modo.
function charCorrompido(d, m){
  if (m === 'caos'){
    m = pickRandom(['simbolos', 'quebrados', 'digitos']);
  }
  if (m === 'simbolos') return sorteiaChar(SIMBOLOS);
  if (m === 'quebrados'){
    var sosias = QUEBRADOS[d];
    return sosias ? sorteiaChar(sosias) : d;
  }
  return String(Math.floor(Math.random() * 10));
}

// Troca só os algarismos e preserva os ':' — a largura não muda, então os
// dígitos não pulam de posição durante o efeito.
function corrompe(base){
  var ratio = (taxa === null) ? TAXA_PADRAO[modo] : taxa;
  return String(base).replace(/[0-9]/g, function(d){
    return Math.random() < ratio ? charCorrompido(d, modo) : d;
  });
}

function pinta(){
  digits.textContent = congelado ? textoReal : corrompe(textoReal);
  digits.classList.toggle('glitching', !congelado);
  digits.classList.toggle('corrompido', !congelado && modo !== 'digitos');
}

/* ==========================================================================
   CAMADA DE REDE
   Nós, arestas, drift e pulsos idênticos aos da live. O que muda é o ritmo:
   com a rede em destaque, pulso raro deixa o grafo parado no quadro — aqui
   eles são mais frequentes, mais rápidos e cabem mais ao mesmo tempo.
   ========================================================================== */
var CONFIG = {
  netShowLabels: true,
  netPulseIntervalRange: [1600, 5200],   // live: [4000, 11000]
  netPulseDuration: 1400,                // live: 1800
  netMaxConcurrentPulses: 5,             // live: 3
  netDriftAmplitude: 9,
  netDriftPeriodRange: [9000, 21000],
  // Coordenadas no viewBox 1920x1080 do SVG. Posições escolhidas pra evitar
  // a faixa central onde ficam os dígitos do countdown.
  netNodes: [
    { id: 'teatro',     nome: 'TEATRO',            x:  960, y: 250, hub: true },
    { id: 'torre',      nome: 'TORRE DE MEMÓRIAS', x:  250, y: 180 },
    { id: 'backup',     nome: 'CENTRO DE BACKUP',  x: 1620, y: 210 },
    { id: 'biblioteca', nome: 'BIBLIOTECA',        x: 1560, y: 870 },
    { id: 'lixeira',    nome: 'LIXEIRA',           x:  280, y: 880 }
  ],
  // Teatro é a antena principal: liga em todos. Os outros 4 fecham um anel
  // entre si — de propósito não é um grafo completo.
  netEdges: [
    ['teatro','torre'], ['teatro','backup'], ['teatro','biblioteca'], ['teatro','lixeira'],
    ['torre','backup'], ['backup','biblioteca'], ['biblioteca','lixeira'], ['lixeira','torre']
  ]
};

var SVG_NS = 'http://www.w3.org/2000/svg';
var netEl = {
  edges:  document.getElementById('net-edges'),
  nodes:  document.getElementById('net-nodes'),
  pulses: document.getElementById('net-pulses')
};
var netState = {
  byId: {},
  nodes: [],      // nós "vivos": guardam base (bx,by) e posição atual (x,y)
  edges: [],
  pulsos: [],     // pulsos em voo
  pool: [],       // círculos de pulso reaproveitados
  raf: null,
  t0: 0
};

var REDES = ['destaque', 'sutil', 'off'];
var rede = param('rede', 'destaque');
if (REDES.indexOf(rede) < 0) rede = 'destaque';
function aplicaRede(){
  document.body.classList.toggle('rede-sutil', rede === 'sutil');
  document.body.classList.toggle('rede-off',   rede === 'off');
}

function buildNetwork(){
  netState.t0 = Date.now();

  CONFIG.netNodes.forEach(function(cfg, i){
    var c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', cfg.x); c.setAttribute('cy', cfg.y);
    c.setAttribute('r', cfg.hub ? 11 : 7);      // live: 8 / 5
    c.setAttribute('class', 'net-node' + (cfg.hub ? ' hub' : ''));
    netEl.nodes.appendChild(c);

    var label = null;
    if (CONFIG.netShowLabels){
      label = document.createElementNS(SVG_NS, 'text');
      label.setAttribute('x', cfg.x + (cfg.hub ? 20 : 16));
      label.setAttribute('y', cfg.y + 6);
      label.setAttribute('class', 'net-label');
      label.textContent = cfg.nome;
      netEl.nodes.appendChild(label);
    }

    // Período próprio por nó, espalhado pela faixa, mais um jitter. Os quatro
    // harmônicos usam razões não inteiras (0.61/0.83/0.47) pra órbita ficar
    // irregular e os nós nunca voltarem a sincronizar entre si.
    var faixa = CONFIG.netDriftPeriodRange;
    var total = CONFIG.netNodes.length || 1;
    var base = faixa[0] + (faixa[1] - faixa[0]) * ((i + 0.5) / total);
    var per = (base * (0.85 + Math.random() * 0.3)) / 1000;   // em segundos
    function w(k){ return (2 * Math.PI) / (per * k); }

    var no = {
      cfg: cfg, circle: c, label: label,
      bx: cfg.x, by: cfg.y, x: cfg.x, y: cfg.y,
      dx: cfg.hub ? 20 : 16,
      w1: w(1), w2: w(0.61), w3: w(0.83), w4: w(0.47),
      f1: Math.random() * Math.PI * 2, f2: Math.random() * Math.PI * 2,
      f3: Math.random() * Math.PI * 2, f4: Math.random() * Math.PI * 2,
      arestas: [],
      timer: null
    };
    netState.byId[cfg.id] = no;
    netState.nodes.push(no);
  });

  CONFIG.netEdges.forEach(function(par){
    var a = netState.byId[par[0]], b = netState.byId[par[1]];
    if (!a || !b) return;          // aresta apontando pra nó inexistente: ignora
    var line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.setAttribute('class', 'net-edge');
    netEl.edges.appendChild(line);
    var aresta = { a: a, b: b, line: line, ativos: 0 };
    netState.edges.push(aresta);
    a.arestas.push(aresta);
    b.arestas.push(aresta);
  });
}

/* ---------- Loop de animação ----------
   Um único rAF cuida de tudo que é contínuo: posição dos nós, endpoints das
   arestas e posição dos pulsos. O pulso NÃO usa transição CSS: com os nós se
   mexendo, endpoints fixos fariam o pulso descolar da linha. Aqui ele é
   interpolado entre as posições VIVAS dos dois nós, no mesmo frame.
   ------------------------------------------------------------------- */
function netFrame(){
  var agora = Date.now();
  var t = (agora - netState.t0) / 1000;
  var A = CONFIG.netDriftAmplitude || 0;
  var i;

  if (A > 0){
    for (i = 0; i < netState.nodes.length; i++){
      var n = netState.nodes[i];
      n.x = n.bx + A * (0.62 * Math.sin(n.w1 * t + n.f1) + 0.38 * Math.sin(n.w2 * t + n.f2));
      n.y = n.by + A * (0.58 * Math.cos(n.w3 * t + n.f3) + 0.42 * Math.sin(n.w4 * t + n.f4));
      n.circle.setAttribute('cx', n.x);
      n.circle.setAttribute('cy', n.y);
      if (n.label){
        n.label.setAttribute('x', n.x + n.dx);
        n.label.setAttribute('y', n.y + 6);
      }
    }
    for (i = 0; i < netState.edges.length; i++){
      var e = netState.edges[i];
      e.line.setAttribute('x1', e.a.x); e.line.setAttribute('y1', e.a.y);
      e.line.setAttribute('x2', e.b.x); e.line.setAttribute('y2', e.b.y);
    }
  }

  for (i = netState.pulsos.length - 1; i >= 0; i--){
    var p = netState.pulsos[i];
    var r = (agora - p.inicio) / p.dur;
    if (r >= 1){ encerraPulso(p, i); continue; }
    p.circle.setAttribute('cx', p.de.x + (p.para.x - p.de.x) * r);
    p.circle.setAttribute('cy', p.de.y + (p.para.y - p.de.y) * r);
  }

  // Sem drift e sem pulso em voo não há o que animar: o loop dorme e volta
  // no próximo pulso. Com o drift ligado (padrão) ele roda sempre.
  if (A <= 0 && netState.pulsos.length === 0){ netState.raf = null; return; }
  netState.raf = requestAnimationFrame(netFrame);
}

function ensureNetLoop(){
  if (netState.raf === null) netState.raf = requestAnimationFrame(netFrame);
}

/* ---------- Pulsos: um ciclo independente por nó ---------- */
function acquirePulseCircle(){
  var c = netState.pool.pop();
  if (c) return c;
  var novo = document.createElementNS(SVG_NS, 'circle');
  novo.setAttribute('r', 7);          // live: 5
  novo.setAttribute('class', 'net-pulse');
  netEl.pulses.appendChild(novo);
  return novo;
}

function encerraPulso(p, i){
  netState.pulsos.splice(i, 1);
  p.circle.classList.remove('moving');
  netState.pool.push(p.circle);
  // contador por aresta: outro pulso pode estar passando pela mesma linha
  p.aresta.ativos--;
  if (p.aresta.ativos <= 0){
    p.aresta.ativos = 0;
    p.aresta.line.classList.remove('active');
  }
}

function scheduleNodePulse(no){
  var faixa = CONFIG.netPulseIntervalRange;
  var delay = faixa[0] + Math.random() * (faixa[1] - faixa[0]);
  no.timer = setTimeout(function(){ runNodePulse(no); }, delay);
}

function runNodePulse(no){
  scheduleNodePulse(no);            // reagenda sempre, mesmo se pular a vez

  if (netState.pulsos.length >= CONFIG.netMaxConcurrentPulses) return;  // teto cheio
  var aresta = pickRandom(no.arestas);
  if (!aresta) return;                          // nó sem aresta

  // sentido sorteado por disparo
  var inverso = Math.random() < 0.5;
  var de   = inverso ? aresta.b : aresta.a;
  var para = inverso ? aresta.a : aresta.b;

  aresta.ativos++;
  aresta.line.classList.add('active');

  var circle = acquirePulseCircle();
  circle.setAttribute('cx', de.x);
  circle.setAttribute('cy', de.y);
  circle.classList.add('moving');

  netState.pulsos.push({
    circle: circle, aresta: aresta, de: de, para: para,
    inicio: Date.now(),
    dur: CONFIG.netPulseDuration
  });
  ensureNetLoop();
}

/* ==========================================================================
   PARTIDA
   ========================================================================== */
function atualizaHud(){
  hud.textContent = 'GLITCH: ' + modo.toUpperCase()
    + (congelado ? ' · CONGELADO' : ' · TRAVADO')
    + ' · taxa ' + (taxa === null ? TAXA_PADRAO[modo] : taxa)
    + ' · ' + passo + 'ms'
    + ' · rede ' + rede.toUpperCase();
}

aplicaRede();
buildNetwork();
netState.nodes.forEach(scheduleNodePulse);
ensureNetLoop();

/* Dois relógios de propósito: o countdown anda de segundo em segundo, o ruído
   anda a cada `passo`. Fundir os dois deixaria o glitch lento ou o countdown
   nervoso. A rede tem o rAF só pra ela. */
tick();
setInterval(tick, 1000);
setInterval(pinta, passo);
pinta();
atualizaHud();

document.addEventListener('keydown', function(e){
  if (e.code === 'Space'){
    e.preventDefault();                 // senão a página rola durante a captura
    congelado = !congelado;
  } else if (e.key === 'm' || e.key === 'M'){
    modo = MODOS[(MODOS.indexOf(modo) + 1) % MODOS.length];
  } else if (e.key === 'r' || e.key === 'R'){
    rede = REDES[(REDES.indexOf(rede) + 1) % REDES.length];
    aplicaRede();
  } else if (e.key === 'h' || e.key === 'H'){
    document.body.classList.toggle('limpo');
    return;
  } else {
    return;
  }
  pinta();
  atualizaHud();
});
</script>
